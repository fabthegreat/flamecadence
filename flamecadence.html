helpTitle:["How FlameCadence works & getting API keys","Comment fonctionne FlameCadence & obtenir ses clés API"],
helpContent:[
  `<h3>1. How it works</h3><p>FlameCadence allows you to build structured training workouts either by prompting an AI assistant, writing them manually, or picking from a built-in library. Once generated or selected, you can review the workout graph and send it directly to your <b>intervals.icu</b> calendar with one click. You can also reorder the workout by <b>dragging the blocks in the preview chart</b>, or the ⠿ handles in the manual editor — the description updates automatically.</p><h3>2. Getting your intervals.icu API key</h3><p>To send workouts to your calendar and fetch your fitness data/FTP, you need your intervals.icu API key:<br>• Go to <a href="https://intervals.icu/settings" target="_blank">intervals.icu/settings</a>.<br>• Scroll down to the <b>Developer Settings</b> section.<br>• Copy your API key and paste it into the FlameCadence settings.</p><h3>3. Getting an AI Provider Key</h3><p>• <b>Gemini (Recommended):</b> Free and fast. Get a key from <a href="https://aistudio.google.com/apikey" target="_blank">Google AI Studio</a>.<br>• <b>Hugging Face:</b> Free tier available. Generate a token in your <a href="https://huggingface.co/settings/tokens" target="_blank">HF Settings</a>.<br>• <b>OpenAI-compatible:</b> Use free tiers from <a href="https://console.groq.com/keys" target="_blank">Groq</a>, <a href="https://openrouter.ai/keys" target="_blank">OpenRouter</a>, or Mistral.</p>`,
  `<h3>1. Comment ça fonctionne</h3><p>FlameCadence vous permet de concevoir des séances structurées soit en décrivant votre envie à une IA, soit via l'éditeur manuel, soit en piochant dans la bibliothèque. Une fois prête, vérifiez le graphique et envoyez la séance directement dans votre calendrier <b>intervals.icu</b>. Vous pouvez aussi réordonner la séance en <b>glissant les blocs du graphique d'aperçu</b>, ou les poignées ⠿ de l'éditeur manuel — la description se met à jour automatiquement.</p><h3>2. Obtenir sa clé API intervals.icu</h3><p>Indispensable pour envoyer les séances et récupérer votre FTP et vos charges :<br>• Rendez-vous sur <a href="https://intervals.icu/settings" target="_blank">intervals.icu/settings</a>.<br>• Descendez jusqu'à la section <b>Developer Settings</b> (Paramètres développeur).<br>• Copiez votre clé API et collez-la dans les réglages de FlameCadence.</p><h3>3. Obtenir une clé de Fournisseur d'IA</h3><p>• <b>Gemini (Recommandé) :</b> Gratuit et rapide. Obtenez une clé sur <a href="https://aistudio.google.com/apikey" target="_blank">Google AI Studio</a>.<br>• <b>Hugging Face :</b> Offre gratuite disponible. Générez un jeton dans vos <a href="https://huggingface.co/settings/tokens" target="_blank">Paramètres HF</a>.<br>• <b>Compatible OpenAI :</b> Utilisez les clés gratuites de <a href="https://console.groq.com/keys" target="_blank">Groq</a>, <a href="https://openrouter.ai/keys" target="_blank">OpenRouter</a> ou Mistral.</p>`
],

function ask(k){

    const done = v => { if(d.open) d.close(); res(v); };
    $("cfmy").onclick = () => done(true); $("cfmn").onclick = () => done(false);

  });
}

$("impjsonin").onchange = () => {

  f.text().then(txt => {

    let n = 0;

    if(Array.isArray(j.geminiModels) && j.geminiModels.length){ modelList = j.geminiModels; fillModels(modelList, $("model").value || modelList[0]); }

    if(Array.isArray(j.oaModels) && j.oaModels.length){ oaList = j.oaModels; $("oal").innerHTML = oaList.map(id => `<option value="${esc(id)}"></option>`).join(""); }
    if(Array.isArray(j.starred)){ setStars(j.starred.filter(x => typeof x === "string")); n++; renderLibraryKeepOpen(); }
    if(Array.isArray(j.widgetOrder)){ WORDER = sanitizeOrder(j.widgetOrder); store.set("si_worder", JSON.stringify(WORDER)); applyOrder(); n++; }
    if(j.weatherLocation && isFinite(j.weatherLocation.lat) && isFinite(j.weatherLocation.lon)){ store.set("si_wxloc", JSON.stringify({name: String(j.weatherLocation.name || "").slice(0, 80), lat: +j.weatherLocation.lat, lon: +j.weatherLocation.lon})); store.set("si_wxcache", ""); wxCurText(); loadWx(true); n++; }

    if(!n) return jnote("jsonEmpty", "err");

};

async function fetchList(url, key){
  const r = await fetch(url, key ? {headers: {Authorization: "Bearer " + key}} : {});
  const j = await r.json();
  if(!r.ok) throw new Error((j.error && (j.error.message || (typeof j.error === "string" ? j.error : ""))) || ("HTTP " + r.status));
  return j;
}
function listBtn(btn, noteId, run){
  $(btn).onclick = async () => {
    const note = (k, c, ...a) => { $(noteId).textContent = t(k, ...a); $(noteId).className = "badge " + (c || ""); };
    $(btn).disabled = true; note("loading");
    try{ await run(note); }catch(e){ note("err", "err", errText(e)); }
    $(btn).disabled = false;
  };
}
async function geminiModels(key){
  const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000", {headers: {"x-goog-api-key": key}});
  const j = await r.json();
  if(!r.ok) throw new Error(j.error?.message || ("HTTP " + r.status));
  const ver = n => parseFloat((n.match(/^gemini-(\d+(?:\.\d+)?)-/) || [])[1]);
  return (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => m.name.replace("models/", ""))
    .filter(n => /flash/.test(n) && !/image|tts|live|audio|embed|robotics|computer|native/.test(n) && ver(n) >= 3.6)
    .sort((x, y) => ver(y) - ver(x) || x.localeCompare(y));
}
listBtn("refm", "mnote", async note => {

  if(!key) return note("needG", "err");
  modelList = await geminiModels(key);
  const cur = $("model").value;
  fillModels(modelList, modelList.includes(cur) ? cur : (modelList[0] || cur));
  modelList.length ? note("nModels", "ok", modelList.length) : note("noModels", "err");
});

// ---------- intervals.icu ----------
const KEY = () => store.get("si_ikey"), AID = () => store.get("si_aid") || "0";
const ICU = {ftpIn: 0, ftpOut: 0, weight: 0, age: null, name: "", city: "", country: "", lthr: 0, maxHr: 0, loaded: false}, LAST = {}, NEXT = {ev: null, loaded: false, tok: 0};
const icuAuth = () => ({Authorization: "Basic " + btoa("API_KEY:" + KEY())});
const icuUrl = path => `https://intervals.icu/api/v1/athlete/${encodeURIComponent(AID())}${path}`;
async function icuFetch(url, opt){
  if(!KEY()) throw new Error(t("keyMissing"));
  const r = await fetch(url, {headers: icuAuth(), ...(opt || {})});
  if(!r.ok) throw new Error("HTTP " + r.status);
  return opt && opt.method === "DELETE" ? null : r.json();
}
const icu = path => icuFetch(icuUrl(path));
const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return iso(d); };
const pad = n => String(n).padStart(2, "0");
const hm = sec => { const m = Math.round(sec / 60); return m >= 60 ? Math.floor(m / 60) + "h" + pad(m % 60) : m + " min"; };
const mmss = sec => Math.floor(sec / 60) + ":" + pad(Math.round(sec) % 60);
const loc = () => lang === "fr" ? "fr-FR" : "en-GB";
const isBike = s => /Ride/.test(s);
// Source de vérité unique : le type de sortie détermine la FTP (home trainer / VirtualRide → FTP indoor, vélo extérieur → FTP outdoor ; repli sur l'autre si absente)
function ftpFor(sp){ const virt = sp === "VirtualRide"; return (virt ? ICU.ftpIn : ICU.ftpOut) || (virt ? ICU.ftpOut : ICU.ftpIn) || 0; }
function curFtp(){ return ftpFor($("sport").value); }
// Liens vers les pages intervals.icu correspondantes
const icuAthlete = () => ICU.id || AID();
const icuPage = path => `https://intervals.icu/athlete/${icuAthlete()}${path || ""}`;
function updateIcuLinks(){
  if(!KEY() || !icuAthlete()){ ["lkCal","lkFit","lkLoad","lkBest","lkLast","lkNext"].forEach(id => $(id).href = "https://intervals.icu"); return; }
  // semaine affichée dans le bloc calendrier (lundi de la semaine courante ou du 1er du mois visionné)
  const ref = CAL.m ? calFirst(CAL.m) : new Date();
  const mon = new Date(ref); mon.setDate(ref.getDate() - ((ref.getDay() + 6) % 7));
  $("lkCal").href = "https://intervals.icu/?w=" + iso(mon);
  $("lkFit").href = "https://intervals.icu/fitness";
  $("lkLoad").href = icuPage("");
  $("lkBest").href = "https://intervals.icu/power";
  const nd = NEXT.ev ? (NEXT.ev.start_date_local || "").slice(0, 10) : "";
  if(nd){ const d = new Date(nd + "T12:00:00"); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); $("lkNext").href = "https://intervals.icu/?w=" + iso(d); }
  else $("lkNext").href = "https://intervals.icu";
  $("lkLast").href = LAST.last && LAST.last.id ? "https://intervals.icu/activities/" + encodeURIComponent(LAST.last.id) : icuPage("/activities");
}
// Le lien de la dernière séance est aussi recalculé au survol / focus / clic à partir de l'activité réellement affichée
// (évite tout décalage si l'affichage a changé entre-temps ; fonctionne aussi pour le clic molette et « ouvrir dans un nouvel onglet »)

// Libellés des sélecteurs de type de sortie : « Vélo indoor (FTP 240 W) » / « Vélo extérieur (FTP 250 W) »
function fillFtp(){

// Panneau « Utilisateur » des réglages (lecture seule, données intervals.icu)
function profText(){
  const box = $("userbox"); if(!box) return;
  if(!KEY()){ box.innerHTML = `<div class="hint">${esc(t("userNeed"))}</div>`; return; }
  if(LAST.profErr){ box.innerHTML = `<div class="hint err">${esc(t("errI", LAST.profErr))}</div>`; return; }
  if(!ICU.loaded){ box.innerHTML = `<div class="hint">${esc(t("loading"))}</div>`; return; }
  const kg = ICU.weight, dash = "–";
  const ftp = f => f ? f + " W" + (kg ? " · " + (f / kg).toFixed(2) + " W/kg" : "") : dash;
  const rows = [
    ICU.name ? [t("userName"), ICU.name] : null,
    [t("userWeight"), kg ? kg + " kg" : dash],

    [t("userFtpOut"), ftp(ICU.ftpOut)],
    ICU.lthr ? [t("userLthr"), ICU.lthr + " bpm"] : null,

  box.innerHTML = `<div class="ukv">` + rows.map(([k, v]) => `<span>${esc(k)}</span><b>${esc(v)}</b>`).join("") + `</div>`;

async function loadProfile(){
  const a = await icu("");
  ICU.id = a.id;
  const rideSet = x => (x.types || []).includes("Ride");
  let ss = (a.sportSettings || []).find(rideSet);
  if(!ss){ try{ ss = (await icu("/sport-settings")).find(rideSet); }catch(e){} }
  ICU.ftpOut = (ss && ss.ftp) || 0; ICU.ftpIn = (ss && (ss.indoor_ftp || ss.ftp)) || 0;
  ICU.lthr = (ss && ss.lthr) || 0; ICU.maxHr = (ss && ss.max_hr) || 0;
  ICU.name = a.name || [a.firstname, a.lastname].filter(Boolean).join(" "); ICU.city = a.city || ""; ICU.country = a.country || "";
  ICU.weight = a.icu_weight || a.weight || 0;
  const dob = a.icu_date_of_birth || a.date_of_birth || a.birthdate;
  ICU.age = dob ? Math.floor((Date.now() - new Date(dob)) / 31557600000) : null;
  ICU.loaded = true; LAST.profErr = ""; fillFtp(); profText(); updateIcuLinks();
  wxAuto().catch(() => {}); // lieu météo déduit de la ville du profil, une seule fois
}

// ---------- Météo de la semaine (Open-Meteo : sans clé API) ----------
const WX = {data: null, err: "", busy: false};
function wxLoc(){ try{ const o = JSON.parse(store.get("si_wxloc") || "null"); return o && isFinite(o.lat) && isFinite(o.lon) ? o : null; }catch(e){ return null; } }
const WMO = c => c === 0 ? ["☀️", "wx0"] : c === 1 ? ["🌤️", "wx1"] : c === 2 ? ["⛅", "wx2"] : c === 3 ? ["☁️", "wx3"] : c === 45 || c === 48 ? ["🌫️", "wx45"] : c >= 51 && c <= 57 ? ["🌦️", "wx51"]
  : c >= 61 && c <= 67 ? ["🌧️", "wx61"] : c >= 71 && c <= 77 || c === 85 || c === 86 ? ["🌨️", "wx71"] : c >= 80 && c <= 82 ? ["🌦️", "wx80"] : c >= 95 ? ["⛈️", "wx95"] : ["☁️", "wx3"];
// 0 = bien pour rouler dehors, 1 = limite, 2 = plutôt en intérieur
function wxRide(d){
  const snow = d.code >= 71 && d.code <= 77 || d.code === 85 || d.code === 86;
  if(d.code >= 95 || snow || d.pr >= 5 || (d.pp >= 70 && d.pr >= 1) || d.wind >= 40 || d.gust >= 65 || d.tmax < 2) return 2;
  if(d.pr >= 1 || d.pp >= 50 || d.wind >= 28 || d.gust >= 50 || d.tmax < 8 || d.tmax >= 33) return 1;
  return 0;
}
async function loadWx(force){
  if(!$("wxbox")) return;
  const L = wxLoc();
  if(!L){ WX.data = null; WX.err = ""; renderWx(); return; }
  const key = L.lat + "," + L.lon;
  let c = null; try{ c = JSON.parse(store.get("si_wxcache") || "null"); }catch(e){}
  if(c && c.k === key && Array.isArray(c.d)) WX.data = c.d; else WX.data = null;
  if(!force && c && c.k === key && Date.now() - c.ts < 30 * 60000){ WX.err = ""; renderWx(); return; } // cache de 30 min
  if(WX.busy) return;
  WX.busy = true; renderWx();
  try{
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${L.lat}&longitude=${L.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max&timezone=auto&forecast_days=7`);
    if(!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json(), d = j.daily;
    if(!d || !Array.isArray(d.time)) throw new Error("no data");
    const n = v => typeof v === "number" ? v : 0;
    WX.data = d.time.map((k, i) => ({k, code: n(d.weather_code[i]), tmax: n(d.temperature_2m_max[i]), tmin: n(d.temperature_2m_min[i]), pr: n(d.precipitation_sum[i]), pp: n(d.precipitation_probability_max[i]), wind: n(d.wind_speed_10m_max[i]), gust: n(d.wind_gusts_10m_max[i])}));
    store.set("si_wxcache", JSON.stringify({k: key, ts: Date.now(), d: WX.data}));
    WX.err = "";
  }catch(e){ WX.err = errText(e); } // en cas d'échec on garde les dernières prévisions connues
  WX.busy = false; renderWx();
}
function renderWx(){
  const box = $("wxbox"), cap = $("wxcap"); if(!box) return;
  const L = wxLoc();
  if(!L){
    box.innerHTML = `<div class="hint">${esc(t("wxNeed"))}</div><div class="actions" style="margin-top:8px"><button class="alt small" id="wxset" type="button">${esc(t("wxSet"))}</button></div>`;
    cap.textContent = ""; $("wxset").onclick = () => { $("open").click(); cfgTab("user"); };
    return;
  }
  if(!WX.data){ box.innerHTML = `<div class="hint ${WX.err ? "err" : ""}">${esc(WX.err ? t("wxErr", WX.err) : t("loading"))}</div>`; cap.textContent = ""; return; }
  const today = iso(new Date()), f1 = v => (Math.round(v * 10) / 10).toLocaleString(loc());
  box.innerHTML = `<div class="wx">` + WX.data.map(d => {
    const [ic, lk] = WMO(d.code), rk = wxRide(d), dt = new Date(d.k + "T12:00:00");
    const rain = d.pr >= 0.1 ? f1(d.pr) + " mm" : d.pp >= 30 ? d.pp + " %" : "–";
    const verdict = t(["wxGood", "wxMid", "wxBad"][rk]);
    const tip = [dt.toLocaleDateString(loc(), {weekday: "long", day: "numeric", month: "long"}), t(lk), Math.round(d.tmin) + " / " + Math.round(d.tmax) + " °C",
      t("wxRain", f1(d.pr), Math.round(d.pp)), t("wxWind", Math.round(d.wind), Math.round(d.gust)), verdict].join(" · ");
    return `<div class="wxr${d.k === today ? " now" : ""}" title="${esc(tip)}"><span class="wxd">${esc(dt.toLocaleDateString(loc(), {weekday: "short", day: "numeric"}))}</span><span class="wxi" aria-hidden="true">${ic}</span><span class="wxt"><i>${Math.round(d.tmin)}°</i> / <b>${Math.round(d.tmax)}°</b></span><span class="wxp">💧 ${esc(rain)}</span><span class="wxw">💨 ${Math.round(d.wind)} km/h</span><span class="wxk${rk === 1 ? " m" : rk === 2 ? " b" : ""}" role="img" aria-label="${esc(verdict)}"></span></div>`;
  }).join("") + `</div>`;
  cap.innerHTML = `<div class="wxleg"><span><i class="wxk"></i>${esc(t("wxGood"))}</span><span><i class="wxk m"></i>${esc(t("wxMid"))}</span><span><i class="wxk b"></i>${esc(t("wxBad"))}</span></div><div style="margin-top:4px">${esc(L.name)}${WX.err ? " · " + esc(t("wxErr", WX.err)) : ""} · <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a></div>`;
}
function wxCurText(){
  const L = wxLoc(), el = $("wxcur"); if(!el) return;
  el.textContent = L ? t("wxCur", L.name + (L.auto ? t("wxAuto") : "")) : t("wxNoLoc");
  $("wxclr").hidden = !L;
}
function wxSetLoc(o){
  store.set("si_wxloc", o ? JSON.stringify(o) : ""); store.set("si_wxcache", ""); store.set("si_wxauto", "1");
  wxCurText(); return loadWx(true);
}
const wxGeoUrl = (q, n) => `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=${n}&language=${lang}&format=json`;
const wxPlace = p => ({name: p.name + (p.country_code ? ", " + p.country_code : ""), lat: Math.round(p.latitude * 1000) / 1000, lon: Math.round(p.longitude * 1000) / 1000});
async function wxSearch(){
  const q = $("wxq").value.trim(), out = $("wxres"); if(!q) return;
  out.textContent = t("loading");
  try{
    const r = await fetch(wxGeoUrl(q, 6)); if(!r.ok) throw new Error("HTTP " + r.status);
    const res = (await r.json()).results || [];
    out.innerHTML = "";
    if(!res.length){ out.textContent = t("wxNone"); return; }
    res.forEach(p => {
      const b = document.createElement("button"); b.type = "button"; b.className = "alt small";
      b.textContent = [p.name, p.admin1, p.country].filter(Boolean).join(", ");
      b.onclick = () => { out.innerHTML = ""; $("wxq").value = ""; wxSetLoc(wxPlace(p)); };
      out.appendChild(b);
    });
  }catch(e){ out.textContent = t("wxErr", errText(e)); }
}
async function wxAuto(){
  if(wxLoc() || store.get("si_wxauto") || !ICU.city) return;
  store.set("si_wxauto", "1"); // une seule tentative
  const r = await fetch(wxGeoUrl(ICU.city, 5)); if(!r.ok) return;
  const res = (await r.json()).results || [], c = String(ICU.country || "").toLowerCase();
  const p = res.find(x => c && [x.country, x.country_code].some(v => String(v || "").toLowerCase() === c)) || res[0];
  if(!p) return;
  store.set("si_wxloc", JSON.stringify({...wxPlace(p), auto: true})); wxCurText(); loadWx(true);
}
$("wxfind").onclick = wxSearch;
$("wxq").addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); wxSearch(); } });
$("wxclr").onclick = () => { $("wxres").textContent = ""; wxSetLoc(null); };
$("wxgeo").onclick = () => {

    () => { out.textContent = t("wxNoGeo"); }, {timeout: 10000, maximumAge: 600000});
};

// --- deux dernières semaines ---
const grp = l => l.reduce((m, a) => { const k = (a.start_date_local || "").slice(0, 10); (m[k] = m[k] || []).push(a); return m; }, {});
function dayHtml(k, L, w, P){
  const f = v => Math.round(v), n1 = v => String(Math.round(v * 10) / 10);
  let h = `<b>${esc(new Date(k + "T12:00:00").toLocaleDateString(loc(), {weekday: "long", day: "numeric", month: "long"}))}</b>`;
  if(w && w.ctl != null) h += `<div>CTL ${f(w.ctl)} · ATL ${f(w.atl)} · ${lang === "fr" ? "forme" : "form"} ${f(w.ctl - w.atl)}</div>`;
  if(!L.length) h += `<div>${t("rest")}</div>`;
  for(const a of L){
    const parts = [hm(a.moving_time || 0)];
    if(a.distance) parts.push(n1(a.distance / 1000) + " km");
    if(a.total_elevation_gain) parts.push(t("dElev", f(a.total_elevation_gain)));
    const q = [t("dLoad", f(a.icu_training_load || 0))];
    if(a.icu_intensity) q.push("IF " + (a.icu_intensity > 5 ? a.icu_intensity / 100 : a.icu_intensity).toFixed(2));
    if(a.icu_weighted_avg_watts) q.push("NP " + f(a.icu_weighted_avg_watts) + " W");
    if(a.icu_average_watts) q.push(t("dAvg", f(a.icu_average_watts)));
    if(a.average_heartrate) q.push(t("dHR", f(a.average_heartrate)));
    h += `<div class="act"><b>${esc(a.name || a.type || "")}</b> ${esc(actT(a.type))} ${esc((a.start_date_local || "").slice(11, 16))}<br>${esc(parts.join(" · "))}<br>${esc(q.join(" · "))}</div>`;
  }
  for(const e of P) h += `<div class="act">${esc(t("planned", (e.name || "") + (e.moving_time ? " (" + hm(e.moving_time) + ")" : "")))}</div>`;
  return h;
}
function renderLoad(){
  if(!LAST.acts) return;
  const by = grp(LAST.acts), pl = grp(LAST.plan || []), wl = {};
  (LAST.well || []).forEach(w => { wl[w.id] = w; });
  const cols = []; let max = 1, tl = 0, tt = 0;
  for(let i = 13; i >= 0; i--){
    const k = daysAgo(i), L = by[k] || [], load = L.reduce((s, a) => s + (a.icu_training_load || 0), 0);
    max = Math.max(max, load); tl += load; tt += L.reduce((s, a) => s + (a.moving_time || 0), 0);
    cols.push({k, load, html: dayHtml(k, L, wl[k], pl[k] || [])});
  }
  LAST.days = cols.map(c => c.html);
  $("loadbox").innerHTML = `<div class="days">` + cols.map((c, n) => `<div class="d${c.k === daysAgo(0) ? " now" : ""}" data-n="${n}"><div class="bar${c.load > 120 ? " h3" : c.load > 60 ? " h2" : c.load > 0 ? " h1" : ""}" style="height:${c.load ? Math.max(4, c.load / max * 72) : 2}px"></div><span>${c.k.slice(8)}</span></div>`).join("") + `</div><div class="tip" hidden></div>`;
  const w = (LAST.well || [])[(LAST.well || []).length - 1];
  $("loadcap").textContent = t("loadCap", LAST.acts.length, hm(tt), Math.round(tl)) + (w && w.ctl != null ? t("loadCap2", Math.round(w.ctl), Math.round(w.atl), Math.round(w.ctl - w.atl)) : "");
}
function hoverTip(box, htmlOf){
  const move = e => {
    const tip = box.querySelector(".tip"); if(!tip) return;
    const d = e.target.closest ? e.target.closest("[data-n]") : null;
    if(!d || !box.contains(d)){ tip.hidden = true; return; }
    if(tip.dataset.n !== d.dataset.n){ tip.dataset.n = d.dataset.n; tip.innerHTML = htmlOf(+d.dataset.n); }
    tip.hidden = false;
    const r = box.getBoundingClientRect();
    tip.style.left = Math.max(0, Math.min(e.clientX - r.left - tip.offsetWidth / 2, r.width - tip.offsetWidth)) + "px";
    tip.style.top = (e.clientY - r.top + 16) + "px";
  };
  ["pointermove", "pointerdown"].forEach(ev => box.addEventListener(ev, move));
  box.addEventListener("pointerleave", () => { const tip = box.querySelector(".tip"); if(tip) tip.hidden = true; });
}
hoverTip($("loadbox"), i => LAST.days[i]);

// --- dernière séance ---
function ds(arr, n){
  if(!arr || !arr.length) return [];
  const w = Math.max(1, Math.floor(arr.length / n)), out = [];
  for(let i = 0; i < arr.length; i += w){
    let s = 0, c = 0;
    for(let j = i; j < Math.min(i + w, arr.length); j++){ const v = arr[j]; if(typeof v === "number" && !isNaN(v)){ s += v; c++; } }
    out.push(c ? s / c : 0);
  }
  return out;
}
function streamsSvg(){
  const w = ds(LAST.sw, 240), h = ds(LAST.sh, 240), n = Math.max(w.length, h.length);
  if(!n) return `<div class="hint">${esc(t("noStreams"))}</div>`;
  const X = i => (i / Math.max(1, n - 1) * 300).toFixed(1);
  let svg = `<svg id="lsvg" viewBox="0 0 300 90" preserveAspectRatio="none"><title>${esc(t("lCast"))}</title>`;
  if(w.length){ const m = Math.max(...w, 1); svg += `<path class="lp" d="M0 90${w.map((v, i) => `L${X(i)} ${(88 - v / m * 84).toFixed(1)}`).join("")}L300 90Z"/>`; }
  const hv = h.filter(v => v > 0);
  if(hv.length){ const lo = Math.min(...hv), hi = Math.max(...hv); svg += `<polyline class="lh" points="${h.map((v, i) => X(i) + "," + (88 - (Math.max(v, lo) - lo) / Math.max(1, hi - lo) * 80).toFixed(1)).join(" ")}"/>`; }
  const lg = [w.length ? `<span><i style="background:var(--acc)"></i>${esc(t("lPow"))} · max ${Math.round(Math.max(...w))} W</span>` : "", hv.length ? `<span><i style="background:#d6336c"></i>${esc(t("lHRs"))} · max ${Math.round(Math.max(...hv))} bpm</span>` : ""].join("");
  return svg + `</svg><div class="hint" id="linfo">&nbsp;</div><div class="leg">${lg}</div>`;
}
function renderLast(){
  const box = $("lastbox"), a = LAST.last;
  if(!LAST.acts){ box.textContent = ""; return; }
  if(!a){ box.textContent = t("noWorkout"); return; }
  const f = v => Math.round(v), kv = [[t("lDur"), hm(a.moving_time || 0)]];
  if(a.distance) kv.push([t("lDist"), (Math.round(a.distance / 100) / 10) + " km"]);

// Curseur vertical + infobulle sur un graphe SVG (viewBox quelconque) : infoAt(i) → {html, leave?}
function chartHover(box, svg, count, infoAt){
  if(!svg || !count) return;
  const NS = "http://www.w3.org/2000/svg", vb = svg.viewBox.baseVal;
  const ln = document.createElementNS(NS, "line"); ln.setAttribute("class", "cur"); ln.setAttribute("y1", 0); ln.setAttribute("y2", vb.height); ln.style.display = "none"; svg.appendChild(ln);
  let tip = box.querySelector(":scope > .tip.ctip"); if(!tip){ tip = document.createElement("div"); tip.className = "tip ctip"; tip.hidden = true; box.appendChild(tip); }
  let leave = null;
  const hide = () => { ln.style.display = "none"; tip.hidden = true; if(leave) leave(); };
  const move = e => {
    const r = svg.getBoundingClientRect(); if(!r.width) return;
    const fr = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), i = Math.round(fr * (count - 1)), x = i / Math.max(1, count - 1);
    ln.setAttribute("x1", x * vb.width); ln.setAttribute("x2", x * vb.width); ln.style.display = "";
    const info = infoAt(i, fr); leave = info.leave || null; tip.innerHTML = info.html; tip.hidden = false;
    const br = box.getBoundingClientRect();
    tip.style.left = Math.max(0, Math.min(r.left - br.left + x * r.width - tip.offsetWidth / 2, br.width - tip.offsetWidth)) + "px";
    tip.style.top = Math.max(0, r.top - br.top - tip.offsetHeight - 6) + "px"; // au-dessus du graphe, pour ne pas masquer la courbe
  };
  ["pointermove", "pointerdown"].forEach(ev => svg.addEventListener(ev, move));
  svg.addEventListener("pointerleave", hide);
}

// Mise en forme légère (markdown minimal) de l'analyse IA
function mdLite(txt){
  const inline = s => esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, "$1<i>$2</i>");
  const out = [];
  let list = null;
  const closeList = () => { if(list){ out.push(list === "ul" ? "</ul>" : "</ol>"); list = null; } };
  for(const raw of String(txt).split(/\r?\n/)){
    const line = raw.trim();
    if(!line){ closeList(); continue; }
    const li = line.match(/^[-*•]\s+(.*)$/) || line.match(/^\d+[.)]\s+(.*)$/);
    if(li){
      const kind = /^[-*•]/.test(line) ? "ul" : "ol";
      if(list !== kind){ closeList(); out.push(kind === "ul" ? "<ul>" : "<ol>"); list = kind; }
      out.push(`<li>${inline(li[1])}</li>`);
    }else{
      closeList();
      const h = line.match(/^#{1,4}\s+(.*)$/);
      if(h) out.push(`<h3>${inline(h[1])}</h3>`);
      else out.push(`<p>${inline(line)}</p>`);
    }
  }
  closeList();
  return out.join("");
}

// Indicateurs calculés ici (le modèle ne doit pas faire d'arithmétique) : zones de puissance, moitiés de séance, découplage puissance/FC
function aiDerived(a, sw, sh, ftp){
  const f = Math.round, out = [], num = v => typeof v === "number" && !isNaN(v);
  const avg = (arr, s, e, skip0) => { let n = 0, sum = 0; for(let i = s; i < Math.min(e, arr.length); i++){ const v = arr[i]; if(!num(v) || (skip0 && v <= 0)) continue; sum += v; n++; } return n ? sum / n : 0; };

    const lim = [.55, .75, .9, 1.05, 1.2, 1.5], c = [0, 0, 0, 0, 0, 0, 0]; let n = 0;
    for(const v of sw){ if(!num(v)) continue; let z = 0; const r = v / ftp; while(z < 6 && r > lim[z]) z++; c[z]++; n++; }
    if(n) out.push("Time in power zones (% of FTP, coasting counts as Z1): " + c.map((x, i) => x ? `Z${i + 1} ${f(x / n * 100)}%` : "").filter(Boolean).join(", "));
  }
  if(sw && sw.length > 1200){
    const m = Math.floor(sw.length / 2), p1 = avg(sw, 0, m), p2 = avg(sw, m, sw.length);
    let line = `First half vs second half: average power ${f(p1)} W vs ${f(p2)} W`;
    if(sh && sh.length > 1200){
      const h1 = avg(sh, 0, m, true), h2 = avg(sh, m, sh.length, true);
      if(h1 && h2){ line += `, average HR ${f(h1)} vs ${f(h2)} bpm`; if(p1 && p2){ const e1 = p1 / h1, e2 = p2 / h2; out.push(line); out.push(`Power-to-HR drift between halves (decoupling): ${((e1 - e2) / e1 * 100).toFixed(1)} % (below 5 % = good aerobic stability; positive = HR rising relative to power)`); return out; } }
    }
    out.push(line);
  }
  return out;
}

// --- Widget « Estimation de VO₂max » (vélo) : meilleure puissance sur 5 min × équation ACSM ; valeur de l'appareil si intervals.icu en a une ---
const VO2 = {loaded: false, busy: false, d: null};
const vo2Est = (w, kg) => 10.8 * w / kg + 7; // ml/kg/min (équation ACSM du cyclisme, P en watts)
function best5(w){ // meilleure puissance moyenne sur 300 s (flux à 1 Hz)
  const n = 300; if(!w || w.length < n) return 0;
  let s = 0; for(let i = 0; i < n; i++) s += w[i] || 0;
  let b = s; for(let i = n; i < w.length; i++){ s += (w[i] || 0) - (w[i - n] || 0); if(s > b) b = s; }
  return b / n;
}
function to1Hz(w, tm){ // ré-échantillonne à 1 Hz si le flux « time » montre un pas plus grand
  if(!tm || tm.length !== w.length || tm.length < 2) return w;
  const span = tm[tm.length - 1] - tm[0]; if(span <= (w.length - 1) * 1.5) return w;
  const out = new Array(Math.floor(span) + 1); let k = 0;
  for(let i = 0; i < out.length; i++){ while(k + 1 < tm.length && tm[k + 1] - tm[0] <= i) k++; out[i] = w[k]; }
  return out;
}
function curve5(c){ // puissance moyenne maximale sur 5 min d'une courbe de puissance intervals.icu

  return i >= 0 && vals[i] > 0 ? vals[i] : 0;
}
const vo2Per = () => { const e = $("vo2per"), v = e && e.value; return v === "14" ? 14 : v === "42" ? 42 : 7; };
async function rideB5(a){ // meilleur 5 min d'une sortie, d'après son flux de puissance (mis en cache)
  VO2.c = VO2.c || {}; if(VO2.c[a.id] !== undefined) return VO2.c[a.id];
  let j = null, b = 0;
  for(const u of [`https://intervals.icu/api/v1/activity/${a.id}/streams?types=watts,time`, `https://intervals.icu/api/v1/activity/${a.id}/streams?types=watts`]){
    try{ j = await icuFetch(u); if(j) break; }catch(e){}
  }
  const list = Array.isArray(j) ? j : (j && j.streams) || [], get = (...tys) => { for(const ty of tys){ const d = (list.find(x => x.type === ty) || {}).data; if(d && d.length) return d; } return null; };
  const w = get("watts", "power", "watts_calc"); if(w) b = best5(to1Hz(w, get("time")));
  return VO2.c[a.id] = b;
}
async function vo2Peak(per){ // meilleur 5 min sur les `per` derniers jours : courbe de puissance, sinon calcul sur les sorties de la période
  const d = VO2.d; if(d.cur[per] > 0) return d.cur[per];
  const from = daysAgo(per); let b = 0;
  for(const a of d.rides.filter(a => (a.start_date_local || "").slice(0, 10) >= from).slice(0, 8)) b = Math.max(b, await rideB5(a));

}
const med = a => { const v = [...a].sort((x, y) => x - y), m = v.length >> 1; return v.length ? (v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2) : 0; };
async function rideHr(a){ // flux puissance + FC à 1 Hz d'une sortie (mis en cache)
  VO2.h = VO2.h || {}; if(VO2.h[a.id]) return VO2.h[a.id];
  let j = null;
  for(const u of [`https://intervals.icu/api/v1/activity/${a.id}/streams?types=watts,heartrate,time`, `https://intervals.icu/api/v1/activity/${a.id}/streams?types=watts,heartrate`]){
    try{ j = await icuFetch(u); if(j) break; }catch(e){}
  }
  const list = Array.isArray(j) ? j : (j && j.streams) || [], get = (...tys) => { for(const ty of tys){ const d = (list.find(x => x.type === ty) || {}).data; if(d && d.length) return d; } return null; };
  const w = get("watts", "power", "watts_calc"), h = get("heartrate", "hr"), tm = get("time");

function hrSegs(w, h, kg, hrMax, hrRest){ // segments stables de 10 min : réserve de FC ≈ réserve de VO₂ (Swain), VO₂ de la puissance par l'équation ACSM, extrapolé à 100 %
  const out = [], n = Math.min(w.length, h.length), N = 600;
  for(let s = 600; s + N <= n; s += 300){ // les 10 premières minutes sont ignorées (la FC suit avec retard)
    const bp = [], bh = [];
    for(let b = 0; b < 10; b++){ let sp = 0, sh = 0; for(let i = s + b * 60; i < s + b * 60 + 60; i++){ sp += w[i] || 0; sh += h[i] || 0; } bp.push(sp / 60); bh.push(sh / 60); }

async function vo2Hr(){

      icu(`/activities?oldest=${daysAgo(42)}&newest=${today}`).catch(() => []),
      icu(`/wellness?oldest=${daysAgo(90)}&newest=${today}`).catch(() => []),
      icu(`/power-curves?type=Ride&curves=42d,84d,1y`).catch(() => null),
      icu(`/power-curves?type=VirtualRide&curves=42d,84d,1y`).catch(() => null),
      icu(`/power-curves?type=Ride&curves=7d,14d`).catch(() => null),

    const W = (Array.isArray(well) ? well : []).filter(x => x && x.id).sort((a, b) => a.id < b.id ? -1 : 1);
    const lastW = k => { for(let i = W.length - 1; i >= 0; i--) if(W[i][k] > 0) return W[i]; return null; };
    const kg = ICU.weight || (lastW("weight") || {}).weight || 0, dv = lastW("vo2max");
    const L = c => c ? (c.list || [c]) : [], pk = (x, y, i) => Math.max(curve5(L(x)[i]), curve5(L(y)[i])); // meilleur 5 min : Ride et VirtualRide
    const win = [0, 1, 2].map(i => pk(a1, a2, i)); // 6 semaines, 12 semaines, 1 an

    const rides = (Array.isArray(acts) ? acts : []).filter(a => /Ride/.test(a.type || "") && a.moving_time >= 300 && (a.icu_average_watts > 0 || a.average_watts > 0 || a.icu_weighted_avg_watts > 0))

    const hrRest = med(W.map(x => x.restingHR).filter(v => v > 0).slice(-14)), hrMax = ICU.maxHr || Math.max(0, ...rides.map(a => a.max_heartrate || 0));

const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

function renderZon(){

// Infos par étape pour l'infobulle : début, intitulé de la section du programme (« Main set ») et numéro de répétition (3/10)
function nextMeta(e, steps){
  const hdr = [], rx = /\d(?:[.,]\d+)?\s*%|\d(?:[.,]\d+)?\s*w\b|\bz[1-7]\b/i;
  let cur = "";
  (e.description || "").split("\n").forEach((raw, i) => {
    const l = raw.trim();
    if(!l){ cur = ""; return; }
    if(l.startsWith("-") || rx.test(l)){ hdr[i] = cur; return; }
    cur = l;
  });
  const seen = {}, tot = {};
  steps.forEach(s => { if(s.line != null) tot[s.line] = (tot[s.line] || 0) + 1; });
  let t0 = 0;
  return steps.map(s => {
    const has = s.line != null, k = has ? (seen[s.line] = (seen[s.line] || 0) + 1) : 0, n = has ? tot[s.line] : 0;
    const name = (has ? (hdr[s.line] || "").replace(/\s*\d+\s*x\s*$/i, "") : (s.text || "")).trim();
    const m = {d: s.d, a: s.a, b: s.b, start: t0, line: s.line, label: [name, n > 1 ? k + "/" + n : ""].filter(Boolean).join(" · ")};
    t0 += s.d; return m;
  });

// ---------- Réduction à durée cible (shrink) ----------
function fmtDur(sec){
  sec = Math.max(1, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? `${h}h${m}m` : m ? (s ? `${m}m${s}s` : `${m}m`) : `${s}s`;
}
function reTime(line, sec){
  const tok = "(?:\\d+(?:[.,]\\d+)?\\s*(?:h|min|m|s)(?![a-z])|\\d+:\\d{2}(?::\\d{2})?)";
  // remplace TOUTE l'expression de durée en tête de ligne (« 15m », « 1h30 », « 2m5s »…) par une durée unique et propre
  const re = new RegExp("^(\\s*-\\s*)(" + tok + "(?:\\s*\\d{1,2}(?![a-z0-9%:-]))?(?:\\s*" + tok + ")*)(?=\\s|$)", "i");
  const m = line.match(re);
  return m ? m[1] + fmtDur(sec) + line.slice(m[0].length) : line;
}
function shrinkRegion(lines, steps, cut){
  // raccourcit les lignes de la région (échauffement ou retour au calme) pour lui retirer ~cut secondes
  if(!steps.length || cut <= 0) return 0;
  const tot = steps.reduce((s, x) => s + x.d, 0);
  const scale = Math.max(0, (tot - cut) / tot);
  const byLine = {};
  steps.forEach(s => { (byLine[s.line] = byLine[s.line] || []).push(s); });
  let done = 0;
  for(const li of Object.keys(byLine)){
    const ls = byLine[li], per = ls[0].d;
    const newPer = Math.max(30, Math.round(per * scale / 30) * 30);
    if(newPer >= per) continue;
    const nl = reTime(lines[li], newPer);
    if(nl === lines[li]) continue; // durée non réécrite (ex. étape en distance) : ne pas comptabiliser
    lines[li] = nl;
    done += ls.length * (per - newPer);
  }
  return done;
}

// --- ajustement global des intensités (±5 % de FTP) ---
function shiftIntensity(delta){
  const steps = parseWorkout($("desc").value, $("sport").value, curFtp());
  if(!steps.length) return say("prevEmpty", "err");
  pushUndo();
  const lines = $("desc").value.split("\n");
  let touched = 0;
  // décale les pourcentages et les watts ; les rampes gardent leur écart
  lines.forEach((line, i) => {
    if(!/^\s*-/.test(line)) return;
    let moved = false;
    // décale les pourcentages (bornes des plages comprises) et les watts
    const np = line.replace(/(\d+(?:\.\d+)?)(?:\s*-\s*(\d+(?:\.\d+)?))?\s*%/g, (m, p, q) => {
      moved = true;
      const sh = v => Math.max(0, Math.round((+v + delta) * 10) / 10);
      return q != null ? sh(p) + "-" + sh(q) + "%" : sh(p) + "%";
    });
    const nw = np.replace(/(\d+(?:\.\d+)?)\s*w\b/gi, (m, w) => { moved = true; return (Math.max(0, Math.round((+w * (1 + delta / 100)) * 10) / 10)) + "w"; });
    if(moved){ lines[i] = nw; touched++; }
  });
  if(!touched){ UNDO = null; $("undoBtn").hidden = true; return say("shrinkNone", "err"); }
  $("desc").value = lines.join("\n"); selLine = null; renderChart();
  say("intensDone", "ok", (delta > 0 ? "+" : "") + delta + " % FTP");
  toast(t("intensDone", (delta > 0 ? "+" : "") + delta + " % FTP"), "ok", doUndo);
}

$("shrinkbtn").onclick = () => {
  const before = $("desc").value;
  const steps = parseWorkout(before, $("sport").value, curFtp());
  if(!steps.length) return say("prevEmpty", "err");
  const total = steps.reduce((s, x) => s + x.d, 0);
  const target = (+$("shrinksel").value) * 60;
  if(total <= target + 5) return say("shrinkAlready", "ok", hm(target));
  const mid = s => (s.a + s.b) / 2;
  const cnt = {}; steps.forEach(s => cnt[s.line] = (cnt[s.line] || 0) + 1);
  // les étapes d'un bloc de répétitions font partie du cœur : on n'y touche pas
  const easy = s => mid(s) < 80 && cnt[s.line] === 1;
  let wi = 0; while(wi < steps.length && easy(steps[wi])) wi++;
  let ci = steps.length; while(ci > wi && easy(steps[ci - 1])) ci--;
  if(wi >= steps.length){ wi = Math.ceil(steps.length / 2); ci = wi; } // séance entièrement facile : couper au milieu
  const wSteps = steps.slice(0, wi), cSteps = steps.slice(ci);
  const wTot = wSteps.reduce((s, x) => s + x.d, 0), cTot = cSteps.reduce((s, x) => s + x.d, 0);
  const wAvail = Math.max(0, wTot - 300), cAvail = Math.max(0, cTot - 300); // on laisse jusqu'à 5' de chaque côté
  if(wAvail + cAvail <= 0) return say("shrinkNone", "err");
  const excess = Math.min(total - target, wAvail + cAvail);
  let wCut = Math.min(Math.round(excess * wAvail / (wAvail + cAvail)), wAvail);
  const cCut = Math.min(excess - wCut, cAvail);
  const lines = before.split("\n");
  const done = shrinkRegion(lines, wSteps, wCut) + shrinkRegion(lines, cSteps, cCut);
  if(!done) return say("shrinkNone", "err");
  pushUndo();
  $("desc").value = lines.join("\n"); selLine = null; renderChart();
  const newTotal = total - done;
  if(newTotal > target + 60) say("shrinkPart", "ok", hm(done), hm(newTotal));
  else say("shrinkDone", "ok", hm(total), hm(newTotal));
  toast(t(newTotal > target + 60 ? "shrinkPart" : "shrinkDone", ...(newTotal > target + 60 ? [hm(done), hm(newTotal)] : [hm(total), hm(newTotal)])), "ok", doUndo);
};

// ---------- Catalogue Blocks (blocks.zone) : séances vélo ----------
function bzWarm(theme){
  if(theme === "bz_recovery") return "Warmup\n- 5m 45%";
  if(theme === "bz_endurance") return "Warmup\n- 15m 55%";
  if(theme === "bz_tempo") return "Warmup\n- 10m 50%\n- 5m 65%";
  if(theme === "bz_test") return "Warmup\n- 15m 50%\n- 5m 65%";
  return "Warmup\n- 10m 50%\n- 5m 70%\n- 3x 30s 115%\n- 2m 50%";
}
function bz(theme, name, name_fr, main, expl_en, expl_fr, warm, cool){
  const desc_en = (warm || bzWarm(theme)) + "\n\n" + main + "\n\n" + (cool || "Cooldown\n- 10m 50%");
  LIBRARY.push(extraWorkout(theme, name, name_fr, desc_en, expl_en, expl_fr));
}

function workoutPreviewSvg(desc, sport, ftp){ return stepsSvg(parseWorkout(desc, sport, ftp)); }
function stepsSvg(steps){
  if(!steps || !steps.length) return "";
  const total = steps.reduce((sum, step) => sum + step.d, 0);
  const peak = Math.max(120, ...steps.map(step => Math.max(step.a, step.b)));
  const W = 300, H = 100;
  let x = 0, path = "";
  for(const step of steps){
    const w = step.d / total * W;
    const ya = H - step.a / peak * (H - 4), yb = H - step.b / peak * (H - 4);
    path += `<path class="z${zoneOf((step.a + step.b) / 2)}" d="M${x.toFixed(2)} ${H}L${x.toFixed(2)} ${ya.toFixed(1)}L${(x+w).toFixed(2)} ${yb.toFixed(1)}L${(x+w).toFixed(2)} ${H}Z"/>`;
    x += w;
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${path}</svg>`;
}

// Durée / puissance moyenne / NP d'une séance de la bibliothèque
function libDuration(item){
  if(item._dur == null){
    const steps = parseWorkout(item.desc_en, item.sport, 0);
    item._dur = steps.reduce((s, x) => s + x.d, 0);
  }
  return item._dur;
}
function stepsStats(steps){
  if(!steps.length) return null;
  const total = steps.reduce((s, x) => s + x.d, 0);
  const avgPct = steps.reduce((s, x) => s + x.d * (x.a + x.b) / 2, 0) / total;
  // NP : moyenne glissante 30 s, puissance^4, moyenne, racine 4e (échantillonnage à la seconde)
  const win = 30, ser = [];
  for(const st of steps){
    const d = Math.round(st.d);
    for(let i = 0; i < d; i++) ser.push(st.a + (st.b - st.a) * (d > 1 ? i / (d - 1) : 0));
  }
  let npPct = avgPct;
  if(ser.length >= win){
    let sum = 0; const pre = [];
    for(let i = 0; i < ser.length; i++){ sum += ser[i]; if(i >= win) sum -= ser[i - win]; if(i >= win - 1) pre.push(sum / win); }
    const m4 = pre.reduce((s, v) => s + Math.pow(Math.max(v, 0), 4), 0) / pre.length;
    npPct = Math.pow(m4, 0.25);
  }
  // TSS = heures × IF² × 100 (IF = NP / FTP)
  const iff = npPct / 100, tss = total / 3600 * iff * iff * 100;
  return {total, avgPct, npPct, iff, tss};
}
function libStats(item, ftp){ return stepsStats(parseWorkout(item.desc_en, item.sport, ftp)); }
function libStatsText(item, ftp){
  const st = libStats(item, ftp);
  if(!st) return "";
  const w = ftp > 0;
  const np = w ? " · NP " + Math.round(st.npPct * ftp / 100) + " W" : " · NP " + Math.round(st.npPct) + " %";
  const load = " · IF " + st.iff.toFixed(2) + " · TSS " + Math.round(st.tss);
  return hm(st.total) + " · " + t("libAvg") + " " + (w ? Math.round(st.avgPct * ftp / 100) + " W" : Math.round(st.avgPct) + " %") + np + load;
}

let LIBF = -1, LIBFK = "";
// Mode « Auto » : niveau de forme déduit d'intervals.icu. Forme = CTL − ATL (TSB) : ≥ +5 en pleine forme, ≥ −10 bien, ≥ −20 bof, ≥ −30 fatigué, sinon épuisé ;
// puis un niveau de moins (jusqu'à deux) si les signaux du jour sont au rouge : VFC ≤ 90 % de la moyenne des 7 jours, FC de repos ≥ +5 %, sommeil < 6 h.
const FEEL_ORDER = ["great", "good", "soso", "tired", "exhausted"];
function autoFeel(){
  const W = ((NEXT.well && NEXT.well.length ? NEXT.well : LAST.well) || []).filter(w => w && w.id);
  const fw = W.filter(w => w.ctl != null).sort((a, b) => a.id < b.id ? -1 : 1).pop();
  if(!fw) return null;
  const f = Math.round(fw.ctl - (fw.atl || 0)), today = iso(new Date()), td = W.find(w => w.id === today), why = [];
  let lvl = f >= 5 ? 0 : f >= -10 ? 1 : f >= -20 ? 2 : f >= -30 ? 3 : 4;
  if(td){
    const base = key => { const v = W.filter(w => w.id < today && w[key] > 0).map(w => w[key]); return v.length >= 3 ? v.reduce((a, b) => a + b, 0) / v.length : 0; };
    const hb = base("hrv"), rb = base("restingHR");
    if(td.hrv > 0 && hb && td.hrv <= hb * 0.9) why.push(t("autoHrv"));
    if(td.restingHR > 0 && rb && td.restingHR >= rb * 1.05) why.push(t("autoRhr"));
    if(td.sleepSecs > 0 && td.sleepSecs < 6 * 3600) why.push(t("autoSleep"));
    lvl = Math.min(4, lvl + Math.min(2, why.length));
  }
  return {level: FEEL_ORDER[lvl], f, why};
}
// quand les données de forme d'intervals.icu arrivent (ou changent), le mode Auto met à jour l'affichage et la liste
function libAutoRefresh(){ try{ if($("libform").checked && $("libfeel").value === "auto"){ feelUI(); if(!document.querySelector('[data-block="lib"]').hidden) renderLibrary(); } }catch(e){} }
const feelEff = () => { const v = $("libfeel").value; if(v !== "auto") return v; const a = autoFeel(); return a ? a.level : "good"; };
function renderLibrary(){
  const c = $("libContainer");
  $("libsport").value = $("sport").value; LIBF = curFtp(); // le type de sortie choisi (indoor / extérieur) fixe la FTP utilisée pour les watts
  const q = ($("libsearch").value || "").trim().toLowerCase();

function libFillCard(card){
  if(card.dataset.ld) return; card.dataset.ld = "1";
  const item = LIBRARY[+card.dataset.lc]; if(!item) return;
  const ftp = curFtp();
  card.querySelector(".lib-preview").innerHTML = workoutPreviewSvg(item.desc_en, item.sport, ftp);
  card.querySelector(".lib-stats").textContent = libStatsText(item, ftp);
}
function libHydrate(d){
  if(d._io) return;
  const body = d.querySelector(".lib-theme-body"); if(!body) return;
  const cards = Array.from(d.querySelectorAll(".lib-card[data-lc]"));
  if(!("IntersectionObserver" in window)){ d._io = true; cards.forEach(libFillCard); return; }
  const io = d._io = new IntersectionObserver(es => es.forEach(en => { if(en.isIntersecting){ io.unobserve(en.target); libFillCard(en.target); } }), {root: body, rootMargin: "400px 0px"});
  cards.forEach(c => io.observe(c));
}

// ---------- Récupération courte entre l'échauffement et le cœur de séance ----------
// Beaucoup de séances enchaînent directement la fin de la montée en puissance de
// l'échauffement (jusqu'à ~80 %) et le premier bloc dur. On insère automatiquement
// 2 minutes de récupération (50 % FTP) quand le premier palier après l'échauffement
// est un effort dur (>= 85 % FTP).
function insertWarmRest(desc){
  const d = "\n" + desc;
  const m = d.match(/\n(?:warmup|échauffement)\n((?:[ \t]*-[^\n]*\n)+)/i);
  if(!m) return desc;
  const end = m.index + m[0].length;
  const after = d.slice(end);
  const first = after.match(/[ \t]*-[^\n]*%/); // première étape après l'échauffement
  if(!first) return desc;
  const pm = first[0].match(/(\d+(?:\.\d+)?)\s*%/);
  if(!pm || parseFloat(pm[1]) < 85) return desc;
  return (d.slice(0, end) + "- 2m 50%\n" + after).slice(1);
}

// En-tête (nom de la séance) et pied de page (mention FlameCadence) ajoutés au texte envoyé à intervals.icu ; retirés au rechargement dans l'éditeur
const BRAND = "Generated by FlameCadence (flamecadence.lutix.org)";
function stripBrand(desc, name){
  const L = String(desc || "").replace(/\r/g, "").split("\n");
  while(L.length && !L[L.length - 1].trim()) L.pop();
  if(L.length && /^generated by flamecadence\b/i.test(L[L.length - 1].trim())) L.pop();
  while(L.length && !L[L.length - 1].trim()) L.pop();
  const nm = String(name || "").trim();
  if(nm && L.length > 1 && L[0].trim() === nm && !L[1].trim()){ L.shift(); while(L.length && !L[0].trim()) L.shift(); }
  return L.join("\n");
}
function brandDesc(name, desc){
  const nm = String(name || "").trim(), body = stripBrand(desc, nm).trim();
  return (nm ? nm + "\n\n" : "") + body + "\n\n" + BRAND;
}

function dlFile(name, data, mime){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], {type: mime}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function prevSteps(){
  const steps = parseWorkout($("desc").value, $("sport").value, curFtp());
  if(!steps.length) return say("prevEmpty", "err");
  return steps;
}
function expFname(ext){
  return (($("name").value || "workout").trim().replace(/[^\w\-]+/g, "_").slice(0, 60) + ext);
}
function buildZwo(steps){
  const body = steps.map(s => {
    const dur = Math.round(s.d), lo = Math.min(s.a, s.b) / 100, hi = Math.max(s.a, s.b) / 100;
    if(Math.abs(s.a - s.b) > 0.5) return `<${lo < hi ? "Warmup" : "Cooldown"} Duration="${dur}" PowerLow="${lo.toFixed(3)}" PowerHigh="${hi.toFixed(3)}"/>`;
    return `<SteadyState Duration="${dur}" Power="${(s.a / 100).toFixed(3)}"/>`;
  }).join("\n      ");
  return `<?xml version="1.0" encoding="UTF-8"?>\n<workout_file>\n  <author>FlameCadence</author>\n  <name>${esc(($("name").value || "Workout").trim())}</name>\n  <workout>\n      ${body}\n  </workout>\n</workout_file>`;
}
// --- FIT binaire (workout) ---
function fitCrc(bytes){
  let crc = 0;
  for(const b of bytes){ crc ^= b << 8; for(let i = 0; i < 8; i++) crc = crc & 0x8000 ? ((crc << 1) ^ 0x1021) & 0xffff : (crc << 1) & 0xffff; }
  return crc;
}
function fitDef(local, global, fields){
  const b = [0x40 | local, 0, 0, global & 0xff, (global >> 8) & 0xff, fields.length];
  fields.forEach(([n, s, t]) => b.push(n, s, t));
  return b;
}
const u16 = v => [v & 0xff, (v >> 8) & 0xff];
const u32 = v => [v & 0xff, (v >> 8) & 0xff, (v >> 16) & 0xff, (v >>> 24) & 0xff];
function buildFit(steps){
  const str = (s, n) => { const b = []; for(let i = 0; i < n; i++) b.push(i < s.length ? s.charCodeAt(i) & 0xff : 0); return b; };
  const pad4 = n => Math.min(64, (Math.floor(n / 4) + 1) * 4); // chaîne FIT : multiple de 4 recommandé
  const name = ($("name").value || "Workout").trim().slice(0, 40), nameLen = pad4(name.length + 1);
  const ts = Math.floor(Date.now() / 1000) - 631065600; // epoch FIT : 31/12/1989
  const records = [];
  // file_id (local 0) : time(4,u32), manufacturer(1,u16), product(2,u16), serial(3,u32), type(0,enum)
  records.push(fitDef(0, 0, [[4, 4, 134], [1, 2, 132], [2, 2, 132], [3, 4, 134], [0, 1, 0]]));
  records.push([0, ...u32(ts), ...u16(255), ...u16(0), ...u32(ts), 5]);
  // workout (local 1) : sport(0,enum), num_valid_steps(5,u16), wkt_name(6,string), sub_sport(11,enum)
  records.push(fitDef(1, 26, [[0, 1, 0], [5, 2, 132], [6, nameLen, 7], [11, 1, 0]]));
  records.push([1, isBike($("sport").value) ? 2 : 1, ...u16(steps.length), ...str(name, nameLen), 0]);
  // workout_step (local 2) : message_index(254,u16), duration_type(0,enum), duration_value(1,u32),
  // target_type(2,enum), target_value(3,u32), custom_target_value_low(5,u32), custom_target_value_high(6,u32), intensity(7,enum)
  records.push(fitDef(2, 27, [[254, 2, 132], [0, 1, 0], [1, 4, 134], [2, 1, 0], [3, 4, 134], [5, 4, 134], [6, 4, 134], [7, 1, 0]]));
  steps.forEach((s, i) => {
    const mid = (s.a + s.b) / 2;
    let intensity = 0; // active
    if(i === 0 && mid < 76) intensity = 2; // warmup
    else if(i === steps.length - 1 && mid < 76) intensity = 3; // cooldown
    else if(mid < 56) intensity = 1; // rest
    const pm = Math.max(0, Math.min(1000, Math.round(mid * 10))); // puissance relative 0..1000 pour mille
    records.push([2, ...u16(i), 0, ...u32(Math.round(s.d) * 1000), 4, ...u32(0), ...u32(pm), ...u32(pm), intensity]);
  });
  const data = records.flat();
  const head = [12, 0x10, 0xB6, 0x0B, ...u32(data.length), 0x2E, 0x46, 0x49, 0x54];
  const headCrc = fitCrc(head);
  const file = [...head, headCrc & 0xff, (headCrc >> 8) & 0xff, ...data];
  const crc = fitCrc(file);
  file.push(crc & 0xff, (crc >> 8) & 0xff);
  return file;
}
// --- ERG / MRC : points « minutes valeur » (rampes = deux points, paliers = saut vertical) ---
function buildErgPoints(steps, val){
  const rows = []; let t = 0;
  steps.forEach(s => { rows.push(t.toFixed(2) + "\t" + val(s.a)); t += s.d / 60; rows.push(t.toFixed(2) + "\t" + val(s.b)); });
  return rows;
}
function ergHeader(kind, fname, desc){
  return `[COURSE HEADER]\nVERSION = 2\nUNITS = ENGLISH\nDESCRIPTION = ${desc}\nFILE NAME = ${fname}\nMINUTES ${kind === "mrc" ? "PERCENT" : "WATTS"}\n[END]\n[COURSE DATA]\n`;
}
function buildErg(steps){
  const ftp = curFtp(), name = ($("name").value || "workout").trim();
  return ergHeader("erg", expFname(".erg"), name) + buildErgPoints(steps, p => Math.round(p * ftp / 100)).join("\n") + "\n[END]";
}
function buildMrc(steps){
  const name = ($("name").value || "workout").trim();
  return ergHeader("mrc", expFname(".mrc"), name) + buildErgPoints(steps, p => p.toFixed(1)).join("\n") + "\n[END]";
}
function buildJson(steps){

    name: ($("name").value || "Workout").trim(),

}

function fmtDurImp(sec){
  sec = Math.round(sec);
  if(sec >= 3600 && sec % 3600 === 0) return (sec / 3600) + "h";
  if(sec >= 3600) return Math.floor(sec / 3600) + "h" + Math.round((sec % 3600) / 60);
  if(sec >= 60 && sec % 60 === 0) return (sec / 60) + "m";
  if(sec < 60) return sec + "s";
  return Math.floor(sec / 60) + "m" + (sec % 60);
}
function stepsToDesc(steps, watt){
  const key = s => Math.round(s.d) + "|" + (s.hr ? "h" + s.ha.toFixed(1) + "|" + s.hb.toFixed(1) : s.a.toFixed(1) + "|" + s.b.toFixed(1));
  const line = s => {
    if(s.hr) return "- " + fmtDurImp(s.d) + " " + (Math.abs(s.ha - s.hb) > 0.5 ? Math.round(Math.min(s.ha, s.hb)) + "-" + Math.round(Math.max(s.ha, s.hb)) + "% LTHR ramp" : Math.round(s.ha) + "% LTHR");
    const p = Math.abs(s.a - s.b) > 0.5
      ? Math.round(Math.min(s.a, s.b)) + " - " + Math.round(Math.max(s.a, s.b)) + (watt ? "w" : "% ramp")
      : Math.round(s.a) + (watt ? "w" : "%");
    return "- " + fmtDurImp(s.d) + " " + p;
  };
  const out = []; let i = 0;
  while(i < steps.length){
    if(i + 1 < steps.length && key(steps[i]) === key(steps[i + 1])){ // même étape répétée d'affilée
      let n = 1, j = i + 1;
      while(j < steps.length && key(steps[j]) === key(steps[i])){ n++; j++; }
      out.push(n + " x", line(steps[i]), ""); i = j; continue;
    }
    if(i + 3 < steps.length && key(steps[i]) === key(steps[i + 2]) && key(steps[i + 1]) === key(steps[i + 3])){ // couple effort/récup répété
      let n = 1, j = i + 2;
      while(j + 1 < steps.length && key(steps[j]) === key(steps[i]) && key(steps[j + 1]) === key(steps[i + 1])){ n++; j += 2; }
      out.push(n + " x", line(steps[i]), line(steps[i + 1]), ""); i = j; continue;
    }
    out.push(line(steps[i])); i++;
  }
  return out.join("\n");
}
function parseZwo(xml){
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  if(doc.querySelector("parsererror")) throw new Error("invalid XML");
  const wk = doc.querySelector("workout");
  if(!wk) throw new Error("no <workout> element");
  const out = [];
  const p = (el, n) => { const v = el.getAttribute(n); return v == null ? null : parseFloat(v); };
  const add = (d, a, b) => { if(d > 0 && a != null) out.push({d: Math.round(d), a: a * 100, b: b * 100}); };
  for(const el of wk.children){
    const tag = el.tagName.toLowerCase();
    if(tag === "steadystate"){ add(p(el, "Duration"), p(el, "Power"), p(el, "Power")); }
    else if(tag === "warmup" || tag === "cooldown" || tag === "ramp" || tag === "warmdown"){
      const lo = p(el, "PowerLow"), hi = p(el, "PowerHigh");
      add(p(el, "Duration"), Math.min(lo, hi), Math.max(lo, hi));
    }
    else if(tag === "intervals" || tag === "intervalst"){
      const rep = p(el, "Repeat") || 1, on = p(el, "OnDuration"), off = p(el, "OffDuration");
      const op = p(el, "OnPower"), fp2 = p(el, "OffPower");
      for(let k = 0; k < rep; k++){ add(on, op, op); if(off && fp2 != null) add(off, fp2, fp2); }
    }
  }
  return out;
}
// --- lecture d'un fichier FIT (workout) ---
function parseFit(bytes){
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  if(bytes.length < 12 || bytes[1] !== 0x10 || String.fromCharCode(...bytes.slice(8, 12)) !== ".FIT") throw new Error("not a FIT file");
  const hl = bytes[0];
  const defs = new Map(), msgs = {};
  const rd = (base, p, big) => {
    switch(base){
      case 0: case 2: case 10: return bytes[p];
      case 1: return dv.getInt8(p);
      case 3: return dv.getInt16(p, !big);
      case 4: case 11: return dv.getUint16(p, !big);
      case 5: return dv.getInt32(p, !big);
      case 6: case 12: return dv.getUint32(p, !big);
      case 8: return dv.getFloat32(p, !big);
      case 9: return dv.getFloat64(p, !big);
      default: return null;
    }
  };
  const scan = (start, stop) => {
    defs.clear(); Object.keys(msgs).forEach(k => delete msgs[k]);
    let pos = start;
    try{
      while(pos < stop && pos < bytes.length){
        let h = bytes[pos++];
        if(h & 0x80){ pos += 2; continue; } // horodatage compressé : ignoré
        if(h & 0x40){
          pos++; // réservé
          const big = bytes[pos] === 1; // architecture : 0 = petit boutiste, 1 = gros boutiste
          pos++;
          const g = dv.getUint16(pos, !big); pos += 2;
          const n = bytes[pos++], fields = [];
          for(let k = 0; k < n; k++){ fields.push([bytes[pos], bytes[pos + 1], bytes[pos + 2]]); pos += 3; }
          defs.set(h & 0x0f, {g, fields, big});
        }else{
          const d = defs.get(h & 0x0f);
          if(!d) break;
          const rec = {};
          for(const [num, sz, tp] of d.fields){
            if((tp & 0x1f) === 7){ // chaîne
              let e = pos; while(e < bytes.length && bytes[e]) e++;
              rec[num] = new TextDecoder().decode(bytes.slice(pos, Math.min(e, pos + sz)));
              pos += sz;
            }else{
              rec[num] = rd(tp & 0x1f, pos, d.big);
              pos += sz;
            }
          }
          (msgs[d.g] = msgs[d.g] || []).push(rec);
        }
      }
    }catch(e){ /* flux désynchronisé ou tronqué : on garde ce qui a été lu */ }
  };
  scan(hl === 14 ? 14 : 12, hl === 14 ? 14 + dv.getUint32(4, true) : bytes.length);
  if(!(msgs[27] || []).length && hl === 12 && bytes.length > 14){
    // certaines écritures placent un CRC après une en-tête de 12 octets : les données commencent alors à 14
    scan(14, bytes.length);
  }
  // workout (26) / workout_step (27)
  const ftp = curFtp();
  const out = [];
  for(const r of (msgs[27] || [])){
    let d = 0;
    if((r[0] === 0 || r[0] == null) && r[1]) d = r[1] / 1000; // durée en ms
    if(!d) continue;
    let a = null, b = null;
    if(r[2] === 4 && r[3] != null){ // cible puissance relative (pour mille)
      const v = r[3];
      if(v <= 1000) a = b = v / 10;
      else if(ftp > 0) a = b = v / ftp * 100;
    }
    if(r[5] != null && r[6] != null){ // plage personnalisée
      const lo = r[5], hi = r[6];
      if(lo <= 1000 && hi <= 1000){ a = lo / 10; b = hi / 10; }
      else if(ftp > 0){ a = lo / ftp * 100; b = hi / ftp * 100; }
    }
    if(a == null) continue;
    out.push({d: Math.round(d), a, b});
  }
  return out;
}
// .mrc / .erg : points « temps valeur » (minutes ; % de FTP pour .mrc, watts pour .erg) ; un saut vertical entre deux points = changement de palier
function parseErgMrc(txt, ext){
  const lines = txt.replace(/^\uFEFF/, "").split(/\r?\n/).map(l => l.trim());
  const di = lines.findIndex(l => /^\[COURSE DATA\]/i.test(l)); if(di < 0) throw new Error(t("impErgBad"));
  const head = lines.slice(0, di).join("\n");
  const pct = /PERCENT/i.test(head) || (!/WATTS/i.test(head) && ext === "mrc"), unit = /^SECONDS\b/im.test(head) ? 1 : 60;
  const fm = /^FTP\s*=\s*(\d+(?:\.\d+)?)/im.exec(head), ftp = fm ? +fm[1] : curFtp(), dm = /^DESCRIPTION\s*=\s*(.*)$/im.exec(head);
  if(!pct && !(ftp > 0)) throw new Error("FTP");
  const pts = [];
  for(const l of lines.slice(di + 1)){
    if(/^\[END\]/i.test(l)) break;
    const v = l.split(/[\s,;]+/).map(parseFloat); if(v.length >= 2 && isFinite(v[0]) && isFinite(v[1])) pts.push({t: v[0], v: v[1]});
  }
  const toP = v => Math.round((pct ? v : v / ftp * 100) * 10) / 10, steps = [];
  for(let k = 1; k < pts.length; k++){
    const d = Math.round((pts[k].t - pts[k - 1].t) * unit); if(d < 1) continue; // saut vertical : pas de durée
    const a = toP(pts[k - 1].v), b = toP(pts[k].v), last = steps[steps.length - 1];
    if(last && Math.abs(last.a - last.b) < 0.05 && Math.abs(a - b) < 0.05 && Math.abs(last.b - a) < 0.05) last.d += d; // fusionne les paliers identiques consécutifs (fichiers à points denses)
    else steps.push({d, a, b});
  }
  return {steps, name: dm ? dm[1].trim() : "", watts: !pct, ftp};
}
// .json : export FlameCadence (steps: duration_s / from_pct / to_pct)
function parseJsonWorkout(txt){
  const j = JSON.parse(txt.replace(/^\uFEFF/, "")), arr = j && !Array.isArray(j) ? j.steps : null;
  if(!Array.isArray(arr)) throw new Error(t("impJsonBad"));
  const steps = arr.map(x => ({d: Math.round(+x.duration_s), a: +x.from_pct, b: +x.to_pct})).filter(x => x.d > 0 && isFinite(x.a) && isFinite(x.b));
  return {steps, name: typeof j.name === "string" ? j.name.trim() : ""};
}
async function importFile(f){
  try{
    const ext = ((/\.([a-z0-9]+)$/i.exec(f.name) || [])[1] || "").toLowerCase();
    let steps, name = "", desc = null, ftpUsed = 0;
    if(ext === "fit") steps = parseFit(new Uint8Array(await f.arrayBuffer()));
    else if(ext === "zwo" || ext === "xml") steps = parseZwo(await f.text());
    else if(ext === "mrc" || ext === "erg"){ const r = parseErgMrc(await f.text(), ext); steps = r.steps; name = r.name; if(r.watts) ftpUsed = r.ftp; }
    else if(ext === "json"){ const r = parseJsonWorkout(await f.text()); steps = r.steps; name = r.name; }
    else if(ext === "txt"){ const txt = (await f.text()).replace(/^\uFEFF/, "").trim(); steps = parseWorkout(txt, $("sport").value, curFtp()); desc = txt; } // le texte est gardé tel quel (répétitions, commentaires)
    else return say("impUnk", "err");
    if(!steps.length) return say("impEmpty", "err");
    const nm = name.slice(0, 60) || f.name.replace(/\.[a-z0-9]+$/i, "").replace(/[_-]+/g, " ").replace(/\s*\b\w/g, c => c.toUpperCase()).trim().slice(0, 60);
    if(nm) $("name").value = nm;
    $("desc").value = desc != null ? desc : stepsToDesc(steps);
    $("prev").hidden = false; selLine = null; EXPL = null; setSrcAct(null);
    renderChart(); if(ftpUsed) say("impOkW", "ok", f.name, Math.round(ftpUsed)); else say("impOk", "ok", f.name);
  }catch(e){
    say("impErr", "err", e && e.message === "FTP" ? t("impNoFtp") : e && e.message ? e.message : errText(e));
  }
}

// aperçu graphique de chaque activité de la liste (chargé à l'affichage, mêmes flux/cache que le calendrier)
function actMiniLoad(box, L){
  if(ACTS.io){ ACTS.io.disconnect(); ACTS.io = null; }
  const els = Array.from(box.querySelectorAll(".act-mini")); if(!els.length) return;
  // même chaîne que le bouton de reconstruction (flux complet → detectSteps → barres colorées par zone) :
  // la vignette montre exactement la séance qu'on obtiendra en cliquant ; repli sur le profil lissé sinon
  const fill = async el => {
    if(el.dataset.ld) return; el.dataset.ld = "1";
    const a = L[+el.dataset.ai]; if(!a){ el.remove(); return; }
    let svg = "";
    try{

          await streamSlot();

            const steps = st && st.w ? detectSteps(Array.from(st.w), ftp) : [];
            ACTS.svg[a.id] = steps.length ? stepsSvg(steps.map(x => ({d: x.d, a: x.a / ftp * 100, b: x.b / ftp * 100}))) : "";
          }finally{ streamFree(); }

}
// Détection d'intervalles : lissage 5 s, segmentation par paliers, fusion des segments courts,
// tolérance adaptative pour éviter les séances-patates d'arena à des centaines d'étapes.
function detectSteps(watts, ftp, opt){
  opt = opt || {};
  const s = [];
  for(const v of watts) s.push(typeof v === "number" && v >= 0 && v < 2500 ? v : 0);
  const N = s.length;
  if(N < 60 || !ftp) return [];
  const K = opt.K || 5, sm = [];
  let sum = 0;
  for(let i = 0; i < N; i++){ sum += s[i]; if(i >= K) sum -= s[i - K]; sm.push(sum / Math.min(i + 1, K)); }
  const build = rel => {
    const tol = v => Math.max(8, v * rel);
    const groups = [];
    let g = null;
    for(let i = 0; i < N; i++){
      const v = sm[i], avg = g ? g.sum / g.n : 0;
      if(g && Math.abs(v - avg) <= tol(avg)){ g.sum += v; g.n++; g.end = i; }
      else{ if(g) groups.push(g); g = {sum: v, n: 1, start: i, end: i}; }
    }
    if(g) groups.push(g);
    // fusion des segments courts (< 20 s) dans le voisin
    const min = opt.min || 20, out = [];
    for(const gr of groups){
      if(gr.n >= min){ out.push({...gr}); continue; }
      if(out.length){ const p = out[out.length - 1]; p.sum += gr.sum; p.n += gr.n; p.end = gr.end; }
      else out.push({...gr}); // court en tête : absorbé par le suivant
    }
    const out2 = [];
    for(let i = 0; i < out.length; i++){
      if(!out2.length && out[i].n < min && i + 1 < out.length){ const nx = out[i + 1]; nx.sum += out[i].sum; nx.n += out[i].n; nx.start = out[i].start; continue; }
      out2.push(out[i]);
    }
    // étapes : moyennes en excluant ~8 s de transition aux bords des groupes
    const ents = [];
    for(const gr of out2){
      const raw = s.slice(gr.start, gr.end + 1);
      const off = raw.length >= 25 ? Math.min(8, Math.round(min * 0.4)) : 0;
      const core = off ? raw.slice(off, raw.length - off) : raw;
      const edge = arr => arr.reduce((x, y) => x + y, 0) / arr.length;
      ents.push({d: gr.n, headW: edge(core.slice(0, Math.min(15, core.length))), tailW: edge(core.slice(-Math.min(15, core.length))), midW: edge(core), wN: core.length});
    }
    // fusion des paliers contigus : une rampe linéaire découpée par la segmentation est recollée
    const mrg = [];
    for(const e of ents){
      const last = mrg[mrg.length - 1];
      if(last && Math.abs(last.tailW - e.headW) <= Math.max(12, (last.midW + e.midW) / 2 * 0.12)){
        last.d += e.d; last.tailW = e.tailW;
        last.midW = (last.midW * last.wN + e.midW * e.wN) / (last.wN + e.wN); last.wN += e.wN;
      }else mrg.push({...e});
    }
    // conversion en % FTP — pas de rampes (certains home trainers ne les gèrent pas) :
    // chaque ancienne rampe devient un palier plat au maximum ou au minimum de la rampe,
    // selon le contexte : voisins plus durs que la rampe → maximum, voisins plus faciles → minimum ;
    // sans voisin, on garde la valeur d'arrivée de la rampe (montante → max, descendante → min).
    // étapes en WATTS ABSOLUS (moyennes réelles du flux de puissance) : pas de conversion en % FTP
    // qui dépend d'une FTP parfois différente de celle de l'activité et surestime les blocs.
    // Les paliers plats utilisent la moyenne du cœur du segment ; les rares rampes sont aplaties
    // au maximum ou au minimum selon le contexte (voisins plus durs → max, plus faciles → min).
    const flat = mrg.map(e => {
      if(e.d >= 30 && Math.abs(e.headW - e.tailW) > Math.max(15, e.midW * 0.15)){
        return {d: e.d, ramp: true, rise: e.tailW >= e.headW, hi: Math.max(e.headW, e.tailW), lo: Math.min(e.headW, e.tailW), mid: e.midW};
      }
      return {d: e.d, ramp: false, mid: e.midW};
    });
    return flat.map((e, i) => {
      if(!e.ramp) return {d: e.d, a: e.mid, b: e.mid};
      const ref = st => st.ramp ? (st.hi + st.lo) / 2 : st.mid;
      const pv = i > 0 ? ref(flat[i - 1]) : null, nx = i + 1 < flat.length ? ref(flat[i + 1]) : null;
      const arr = [pv, nx].filter(x => x != null);
      let v;
      if(!arr.length) v = e.rise ? e.hi : e.lo; // pas de voisin : valeur d'arrivée de la rampe
      else{
        const ctx = arr.reduce((x, y) => x + y, 0) / arr.length;
        v = ctx >= e.mid ? Math.min(e.hi, Math.max(...arr)) : Math.max(e.lo, Math.min(...arr));
      }
      return {d: e.d, a: v, b: v};
    });
  };
  let steps = [];
  for(const rel of [0.07, 0.12, 0.18, 0.25]){
    steps = build(rel);
    if(steps.length <= (opt.max || 50)) break;
  }
  return steps;
}
async function pairedEvent(a){ // séance planifiée liée à l'activité (superposées dans intervals.icu)
  const id = a.paired_event_id, own = (CAL.ev || []).find(e => (id && e.id === id) || (e.paired_activity_id && e.paired_activity_id === a.id));
  if(own) return own;

  try{ return await icu(`/events/${id}`); }catch(e){ return null; }
}
async function buildFromAct(a, btn){
  btn.disabled = true; say(null);
  try{
    // FTP adaptée à l'activité : home trainer (VirtualRide) → FTP indoor, sortie extérieure → FTP outdoor.
    // On ne suit PAS le sélecteur du panneau « Générer » (souvent sur indoor) : une sortie outdoor
    // reconstruite avec la FTP indoor surestime tous les blocs. Repli sur l'autre FTP si absente.
    const virt = a.type === "VirtualRide";
    const ftp = (virt ? ICU.ftpIn : ICU.ftpOut) || (virt ? ICU.ftpOut : ICU.ftpIn);
    if(!ftp) throw new Error(t("actNeedFtp"));
    const pe = await pairedEvent(a); // séance prévue : on la restaure telle quelle (plus fidèle que la détection d'étapes)
    if(pe){
      const ps = plannedSteps(pe, ftp);
      if(ps.length && !ps.some(x => x.est)){
        if(isBike(a.type)){ $("sport").value = a.type === "VirtualRide" ? "VirtualRide" : "Ride"; syncUnit(); }
        $("name").value = (pe.name || a.name || a.type || "Workout").trim().slice(0, 60);
        $("desc").value = pe.description && parseWorkout(pe.description, pe.type || a.type || "Ride", ftp).length ? pe.description : stepsToDesc(ps);
        $("prev").hidden = false; selLine = null; EXPL = null; setSrcAct(a);
        renderChart(); say("actPlan", "ok", pe.name || a.name || "");
        $("prev").scrollIntoView({behavior: "smooth", block: "start"});
        btn.disabled = false; return true;
      }
    }
    const j = await icuFetch(`https://intervals.icu/api/v1/activity/${a.id}/streams?types=watts`);
    const list = Array.isArray(j) ? j : (j.streams || []);
    const get = (...tys) => { for(const ty of tys){ const d = (list.find(x => x.type === ty) || {}).data; if(d && d.length) return d; } return null; };
    const w = get("watts", "power", "watts_calc");
    if(!w) throw new Error(t("actNoPow"));
    let steps = detectSteps(w, ftp);
    if(!steps.length) throw new Error(t("actNoPow"));
    if(isBike(a.type)){ $("sport").value = a.type === "VirtualRide" ? "VirtualRide" : "Ride"; syncUnit(); }
    $("name").value = (a.name || a.type || "Workout").trim().slice(0, 60);
    if($("actout").value === "pct"){
      // Pourcentages calés sur la FTP sélectionnée pour conserver exactement les watts
      // absolus de l'activité : pct = watts / FTP × 100. On aligne ensuite le sélecteur
      // « intervals.icu FTP » de l'aperçu sur cette même FTP, car l'aperçu, les exports
      // et l'envoi vers intervals.icu réappliquent les pourcentages sur cette FTP :
      // la valeur absolue est ainsi identique de bout en bout.
      // La FTP vient du type de l'activité (déjà appliqué au sélecteur de type ci-dessus) : aperçu, exports et envoi utilisent la même.
      const pf = ftp;
      steps = steps.map(s => ({d: s.d, a: s.a / pf * 100, b: s.b / pf * 100}));
      $("desc").value = stepsToDesc(steps);
    }else{
      $("desc").value = stepsToDesc(steps, true); // valeurs absolues en watts : la séance reproduit la puissance réelle
    }
    $("prev").hidden = false; selLine = null; EXPL = null; setSrcAct(a);
    renderChart(); say("actOk", "ok", a.name || a.type || "");
    $("prev").scrollIntoView({behavior: "smooth", block: "start"});
    btn.disabled = false; return true;
  }catch(e){
    say("err", "err", errText(e));
  }
  btn.disabled = false; return false;
}
// Recherche d'activités : même moteur que le comparateur (forme, type, nom, intérieur/extérieur) ;
// sans forme ni type, simple filtre sur les métadonnées (aucun flux à télécharger)
// Barre de progression du scan (« À partir d'une activité » et « Comparer ») : remplace le simple compteur texte.
// total inconnu (0) → barre indéterminée ; le texte final (bilan) écrase la barre via textContent.
function scanProg(el, done, total){
  let bar = el.querySelector(".pb");
  if(!bar){
    el.innerHTML = '<div class="pb" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i></i></div><div class="scanlbl"></div>';
    bar = el.querySelector(".pb");
  }
  const known = total > 0, pct = known ? Math.min(100, Math.round(done / total * 100)) : 0;
  bar.classList.toggle("ind", !known);
  if(known) bar.setAttribute("aria-valuenow", pct); else bar.removeAttribute("aria-valuenow");
  bar.firstChild.style.width = known ? pct + "%" : "";

const PAI_SYSTEM = `You are an expert cycling coach. You build a multi-week training plan by choosing sessions from a fixed catalogue.

- Use ONLY dates from the allowed dates list, at most one session per date, and exactly the requested number of sessions per week (fewer only when the week offers fewer dates).
- Progressive overload: weekly load builds week after week; every 4th week, and the last week of plans of 6+ weeks, is a recovery week (about 60-65% of the previous weekly TSS, no hard sessions).
- Follow the purpose of the plan. Vary the workouts: do not reuse an id unless the catalogue is too small.

const GL_ALIAS = {"seuil": "threshold", "anaérobie": "anaerobic", "affûtage": "taper", "vo₂max": "vo2max", "over-under": "overunder", "over-unders": "overunder", "fc": "hr", "w/kg": "wkg", "sweetspot": "sweetspot"};
const GL_RE = /(?<![\p{L}\p{N}_/])(?:[Ss]weet [Ss]pot|[Oo]ver-[Uu]nders?|[Tt]hreshold|[Ss]euil|[Tt]empo|[Aa]naerobic|[Aa]naérobie|[Tt]aper|[Aa]ffûtage|VO₂max|VO2max|W\/kg|FTP|TSS|CTL|ATL|TSB|IF|NP|EF|HR|FC|CP|Z[1-7]|rpm|kJ)(?![\p{L}\p{N}_])/gu;

{
  const gt = document.createElement("div"); gt.id = "gltip"; gt.setAttribute("role", "tooltip"); gt.hidden = true; document.body.appendChild(gt);
  let pend = new Set(), raf = 0, cur = null, hideT = 0;
  const flush = () => { raf = 0; const l = [...pend]; pend = new Set(); l.forEach(n => { if(n.isConnected) glScan(n); }); obs.takeRecords(); };

  const show = a => {
    const d = GL[a.dataset.gl]; if(!d) return;
