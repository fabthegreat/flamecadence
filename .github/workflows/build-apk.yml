name: Build debug APK

on:
  push:
    branches: [ main ]
    paths: [ "android/**", ".github/workflows/build-apk.yml" ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish APK as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fixed file name so the download URL never changes:
          # https://github.com/<owner>/<repo>/releases/latest/download/paceforge.apk
          cp app/build/outputs/apk/debug/app-debug.apk paceforge.apk

          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" paceforge.apk \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Debug APK built from ${GITHUB_SHA::7}" \
            --latest

          # Keep only the 5 most recent build releases
          gh release list --limit 100 --json tagName -q '.[].tagName' \
            | grep '^build-' | tail -n +6 \
            | xargs -r -I{} gh release delete {} --cleanup-tag --yes
