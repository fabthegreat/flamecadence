<meta charset="utf-8">

<title>PaceForge — Forge your next workout</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#1b2733;--mute:#5d6b78;--line:#cfd7de;--acc:#0f6e6e;--err:#b3261e;--ok:#1d7a3a;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#12181e;--card:#1a232b;--ink:#e6ebef;--mute:#98a6b3;--line:#2d3944;--acc:#4fc3c3;--err:#ff8a80;--ok:#7bd88f;--on:#08201f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:1120px;margin:0 auto;padding:20px 16px 24px}
h1{font-size:1.65rem;margin:0;font-weight:600;letter-spacing:-0.02em}
p.sub{color:var(--mute);margin:6px 0 20px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-size:1rem;margin:0 0 12px}
h3.blk{font-size:1rem;margin:20px 0 0}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:90px;resize:vertical}
#desc{font-family:"IBM Plex Mono",monospace;font-size:.85rem;min-height:240px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button,a.alt{display:inline-block;margin-top:14px;padding:11px 16px;border:0;border-radius:6px;background:var(--acc);color:var(--on);font-family:inherit;font-weight:600;font-size:1rem;cursor:pointer;text-decoration:none}
button:disabled{opacity:.5;cursor:default}
.alt{background:transparent!important;color:var(--acc)!important;border:1px solid var(--acc)!important}
.small{margin:0!important;padding:8px 12px!important;font-size:.9rem!important;white-space:nowrap}
.icon{padding:6px 8px!important;line-height:0!important}
.icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon svg.fill{fill:currentColor;stroke:none}
.danger{color:var(--err)!important;border-color:var(--err)!important}
.soon{opacity:.45}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
#msg{margin:-4px 0 16px;padding:0 4px;font-size:.9rem}#msg:empty{display:none}
.err{color:var(--err)}.ok{color:var(--ok)}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;flex:none}
.logo rect{fill:var(--acc)}
.tools{display:flex;gap:8px;align-items:center}
.lang{display:flex;border:1px solid var(--acc);border-radius:6px;overflow:hidden}
.lang button{margin:0;padding:6px 10px;border-radius:0;background:transparent;color:var(--acc);font-size:.85rem}
.lang button[aria-pressed="true"]{background:var(--acc);color:var(--on)}
.layout{display:grid;grid-template-columns:minmax(0,640px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.phead h2{margin:0 auto 0 0}
.phead select{width:auto}
.tgl{font-size:1rem!important;line-height:1!important;min-width:32px}
.off>:not(.phead){display:none!important}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.actions button{margin:0}
.pw{display:flex;gap:8px}.pw{align-items:center}.pw>select,.pw>input{flex:1 1 0;width:0;min-width:0}.pw button{flex:none;margin:0;padding:8px 12px;font-size:.9rem;white-space:nowrap}
.lbl{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}.lbl label{margin:10px 0 4px}
.badge{font-size:.8rem}
.hint{font-size:.8rem;color:var(--mute);margin-top:6px}
.hint a,.help{color:var(--acc);font-size:.8rem}
.help{display:block;margin-top:4px}
dialog{width:min(92vw,560px);max-height:90vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin-bottom:6px}
.chart{position:relative;margin-bottom:6px}
.chart svg{display:block;width:100%;height:64px;border-radius:6px;background:var(--bg)}
.chart path{stroke:var(--bg);stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer}
.chart path:hover{opacity:.8}
.chart path.sel{stroke:var(--ink);stroke-width:2}
.chart .cap{font-size:.8rem;color:var(--mute);margin-top:4px}
.z1{fill:#3a9d8f}.z2{fill:#5cb85c}.z3{fill:#e3cf3f}.z4{fill:#f2a33a}.z5{fill:#ee6c4d}.z6{fill:#d6336c}.z7{fill:#8e44ad}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:var(--card);padding:6px 8px;border-radius:6px;font-size:.8rem;line-height:1.35;width:max-content;max-width:260px;white-space:pre-line;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.tip .act{margin-top:6px}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;align-items:flex-start;max-width:min(92vw,560px);padding:12px 14px;border-radius:8px;background:var(--card);color:var(--ink);border:1px solid var(--err);border-left:6px solid var(--err);box-shadow:0 6px 24px rgba(0,0,0,.3);font-size:.9rem}
#toast button{margin:0;padding:0 6px;line-height:1.2;font-size:1.2rem;background:transparent;color:var(--mute)}
#prog{margin:-4px 0 16px}.pt{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--mute);margin-bottom:4px}.pb{height:10px;border-radius:999px;background:var(--line);overflow:hidden}.pb i{display:block;height:100%;width:0;border-radius:999px;background:var(--acc);transition:width .3s}
.explain{margin-top:10px;padding:10px 12px;border-radius:6px;background:var(--bg);font-size:.9rem}.explain p{margin:4px 0 6px}
#fsvg{display:block;width:100%;height:150px;border-radius:6px;background:var(--bg);touch-action:none}
#fsvg .fc{fill:#3b82c4;fill-opacity:.35;stroke:#3b82c4;stroke-width:1.2;vector-effect:non-scaling-stroke}
#fsvg .fa{fill:none;stroke:#d6336c;stroke-width:1.2;vector-effect:non-scaling-stroke}
#fsvg .ft{fill:#e3cf3f;fill-opacity:.5;stroke:#c9b52b;stroke-width:1;vector-effect:non-scaling-stroke}
#fsvg .fz{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
#fsvg .fcur{stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke;opacity:0}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--mute);margin-top:6px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;align-items:center;padding:8px;margin-bottom:6px;border-left:5px solid var(--line);border-radius:6px;background:var(--bg)}
.st.warm{border-color:#5cb85c}.st.work{border-color:#ee6c4d}.st.rec{border-color:#3a9d8f}.st.cool{border-color:#4a90d9}
.st select,.st input,.gh input{padding:7px;background:var(--card)}
.ctl{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}.ctl button{margin:0!important}
.fld{position:relative}.fld input{padding-right:58px}.fld span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:.75rem;color:var(--mute);pointer-events:none}
.grp{border:1px dashed var(--acc);border-radius:8px;padding:8px;margin-bottom:8px}.gh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}.gh .fld{width:90px}.gh .ctl{grid-column:auto;margin-left:auto}.grp>.actions{margin-top:6px}
#loadbox,#lastbox{position:relative}
.days{display:flex;gap:3px;align-items:flex-end;height:96px}
.d{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.65rem;color:var(--mute);cursor:default}
.d:hover{background:var(--bg)}
.d .bar{width:100%;border-radius:3px 3px 0 0;background:var(--line)}
.d .bar.h1{background:#5cb85c}.d .bar.h2{background:#f2a33a}.d .bar.h3{background:#d6336c}
.d.now span{color:var(--ink);font-weight:600}
.tbl table{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 12px;font-size:.8rem;color:var(--mute);margin-top:8px}.kv b{display:block;font-size:1rem;color:var(--ink)}
.lt{font-weight:600}
#lsvg{display:block;width:100%;height:110px;border-radius:6px;background:var(--bg);margin-top:8px;touch-action:none}
#lsvg .lp{fill:var(--acc);fill-opacity:.3;stroke:var(--acc);stroke-width:1.2;vector-effect:non-scaling-stroke}
#lsvg .lh{fill:none;stroke:#d6336c;stroke-width:1.2;vector-effect:non-scaling-stroke}
footer{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0 32px;color:var(--mute);font-size:.9rem}
footer a{color:var(--acc);text-decoration:none}
footer a:hover{text-decoration:underline}
a.coffee{margin:0;display:inline-flex;gap:8px;align-items:center;background:#ffc439;color:#111!important;border-radius:999px;padding:10px 20px;font-weight:600;text-decoration:none}
a.coffee.soon{opacity:.6}
h2.ic{display:flex;align-items:center;gap:8px}
.hic{width:22px;height:22px;flex:none;stroke:var(--acc);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mode{display:flex;gap:4px;padding:4px;margin-bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.mode button{flex:1;margin:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border-radius:7px;background:transparent;color:var(--ink);font-size:.95rem}
.mode button svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mode button[aria-selected="true"]{background:var(--acc);color:var(--on)}
.stp{display:inline-flex;align-items:center;gap:4px}
.stp input{width:64px;padding:7px 4px;text-align:center;-moz-appearance:textfield;appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stp button{margin:0!important;min-width:36px;padding:7px 0!important;font-size:1.1rem!important;line-height:1}
.lib-card{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px;background:var(--bg)}
.lib-card h3{margin:0 0 4px;font-size:1rem}
.lib-card p{margin:0 0 10px;font-size:.85rem;color:var(--mute)}
.lib-preview{display:block;width:100%;height:42px;margin:8px 0 10px;border-radius:6px;background:var(--card);overflow:hidden}
.lib-preview svg{display:block;width:100%;height:100%}
.lib-theme{border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden;background:var(--card)}
.lib-theme>summary{display:flex;align-items:center;gap:10px;list-style:none;cursor:pointer;padding:13px 14px;font-weight:600;background:var(--bg);user-select:none}
.lib-theme>summary::-webkit-details-marker{display:none}
.lib-theme>summary:before{content:"＋";display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--acc);color:var(--on);font-size:16px;line-height:1}
.lib-theme[open]>summary:before{content:"−"}
.lib-theme .theme-count{margin-left:auto;color:var(--mute);font-size:.8rem;font-weight:400}
.lib-theme-body{padding:12px}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.lib-grid .lib-card{margin:0;min-width:0}
.lib-theme .theme-icon{font-size:1.15rem}
</style>
</head>

helpContent:[
  `<h3>1. How it works</h3><p>PaceForge allows you to build structured training workouts either by prompting an AI assistant, writing them manually, or picking from a built-in library. Once generated or selected, you can review the workout graph and send it directly to your <b>intervals.icu</b> calendar with one click.</p><h3>2. Getting your intervals.icu API key</h3><p>To send workouts to your calendar and fetch your fitness data/FTP, you need your intervals.icu API key:<br>• Go to <a href="https://intervals.icu/settings" target="_blank">intervals.icu/settings</a>.<br>• Scroll down to the <b>Developer Settings</b> section.<br>• Copy your API key and paste it into the PaceForge settings.</p><h3>3. Getting an AI Provider Key</h3><p>• <b>Gemini (Recommended):</b> Free and fast. Get a key from <a href="https://aistudio.google.com/apikey" target="_blank">Google AI Studio</a>.<br>• <b>Hugging Face:</b> Free tier available. Generate a token in your <a href="https://huggingface.co/settings/tokens" target="_blank">HF Settings</a>.<br>• <b>OpenAI-compatible:</b> Use free tiers from <a href="https://console.groq.com/keys" target="_blank">Groq</a>, <a href="https://openrouter.ai/keys" target="_blank">OpenRouter</a>, or Mistral.</p>`,
  `<h3>1. Comment ça fonctionne</h3><p>PaceForge vous permet de concevoir des séances structurées soit en décrivant votre envie à une IA, soit via l'éditeur manuel, soit en piochant dans la bibliothèque. Une fois prête, vérifiez le graphique et envoyez la séance directement dans votre calendrier <b>intervals.icu</b>.</p><h3>2. Obtenir sa clé API intervals.icu</h3><p>Indispensable pour envoyer les séances et récupérer votre FTP et vos charges :<br>• Rendez-vous sur <a href="https://intervals.icu/settings" target="_blank">intervals.icu/settings</a>.<br>• Descendez jusqu'à la section <b>Developer Settings</b> (Paramètres développeur).<br>• Copiez votre clé API et collez-la dans les réglages de PaceForge.</p><h3>3. Obtenir une clé de Fournisseur d'IA</h3><p>• <b>Gemini (Recommandé) :</b> Gratuit et rapide. Obtenez une clé sur <a href="https://aistudio.google.com/apikey" target="_blank">Google AI Studio</a>.<br>• <b>Hugging Face :</b> Offre gratuite disponible. Générez un jeton dans vos <a href="https://huggingface.co/settings/tokens" target="_blank">Paramètres HF</a>.<br>• <b>Compatible OpenAI :</b> Utilisez les clés gratuites de <a href="https://console.groq.com/keys" target="_blank">Groq</a>, <a href="https://openrouter.ai/keys" target="_blank">OpenRouter</a> ou Mistral.</p>`
],
libDesc:["Select a proven session from the library to instantly preview it and send it to intervals.icu.","Sélectionne une séance éprouvée dans la bibliothèque pour l'afficher instantanément et l'envoyer sur intervals.icu."],
libSearch:["Search by keyword (name, goal, intensity…)","Rechercher par mot-clé (nom, objectif, intensité…)"], libNo:["No session matches this search.","Aucune séance ne correspond à cette recherche."],
lib1Name:["Sweet Spot 3 x 10 min","Sweet Spot 3 x 10 min"], lib1Desc:["Classic aerobic efficiency builder with 3 intervals at 90% FTP.","Développement de l'endurance aérobie avec 3 blocs à 90 % de FTP."],
lib2Name:["Threshold Over-Unders 4 x 8 min","Over-Unders au seuil 4 x 8 min"], lib2Desc:["Alternating surges above and below FTP to improve lactate clearance.","Alternance d'efforts au-dessus et en dessous du seuil pour progresser."],
lib3Name:["VO2max Intervals 5 x 3 min","Intervalles VO2max 5 x 3 min"], lib3Desc:["High-intensity intervals to boost maximal aerobic power.","Intervalles de haute intensité pour booster la puissance aérobie maximale."],
lib4Name:["Endurance Zone 2 (1h30)","Endurance Zone 2 (1h30)"], lib4Desc:["Steady aerobic endurance ride to build mitochondrial density.","Sortie d'endurance fondamentale continue pour développer la base aérobie."]
};
const t = (k, ...a) => ((T[k] || [k, k])[lang === "fr" ? 1 : 0]).replace(/\{(\d)\}/g, (m, i) => a[i] === undefined ? "" : a[i]);
const esc = x => String(x).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
let MSG = null, toastT, ptimer, phide, abortGen = null;
function toast(m){ $("toastt").textContent = m; $("toast").hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { $("toast").hidden = true; }, 12000); }
function say(k, cls, ...a){
  const txt = k ? t(k, ...a) : "";
  if(cls === "err"){ MSG = null; $("msg").textContent = ""; if(txt) toast(txt); return; }
  MSG = k ? {k, cls, a} : null; $("msg").textContent = txt; $("msg").className = cls || "";
}
$("toastx").onclick = () => { $("toast").hidden = true; };
function progStart(k){
  clearInterval(ptimer); clearTimeout(phide); const t0 = Date.now();
  abortGen = new AbortController();
  $("progk").textContent = t(k); $("prog").hidden = false;
  const upd = () => { const sec = (Date.now() - t0) / 1000; $("progf").style.width = (92 * (1 - Math.exp(-sec / 20))).toFixed(1) + "%"; $("progs").textContent = Math.round(sec) + " s"; $("prog").querySelector(".pb").setAttribute("aria-valuenow", parseInt($("progf").style.width)); };
  upd(); ptimer = setInterval(upd, 250);
}
function progEnd(){
  clearInterval(ptimer); abortGen = null; if($("prog").hidden) return; $("progf").style.width = "100%";
  phide = setTimeout(() => { $("prog").hidden = true; $("progf").style.width = "0"; }, 500);
}
$("stopGen").onclick = () => { if(abortGen) abortGen.abort(); };

const ACT = {Ride: ["Ride", "Vélo"], VirtualRide: ["Virtual ride", "Vélo virtuel"], Run: ["Run", "Course à pied"], VirtualRun: ["Virtual run", "Course virtuelle"], TrailRun: ["Trail run", "Trail"], Swim: ["Swim", "Natation"], WeightTraining: ["Strength", "Renforcement"], Walk: ["Walk", "Marche"], Hike: ["Hike", "Randonnée"], Workout: ["Workout", "Séance"], Rowing: ["Rowing", "Aviron"], NordicSki: ["Nordic ski", "Ski nordique"], Yoga: ["Yoga", "Yoga"]};
const actT = ty => (ACT[ty] || [ty, ty])[lang === "fr" ? 1 : 0] || "";
const errText = e => e.name === "AbortError" ? t("timeout") : e.name === "TypeError" ? t("cors") : e.message;

function ask(k){
  return new Promise(res => {
    const d = $("cfm"); $("cfmt").textContent = t(k);
    const done = v => { if(d.open) d.close(); res(v); };
    $("cfmy").onclick = () => done(true); $("cfmn").onclick = () => done(false);
    d.addEventListener("cancel", () => res(false), {once: true});
    d.showModal();
  });
}

// ---------- Réglages & Aide ----------
const FIELDS = ["gkey","model","ikey","aid","think","prov","hfkey","hfmodel","oaurl","oakey","oamodel"];
const DEF = {model: "gemini-3.7-flash", aid: "0", think: "low", prov: "gemini", hfmodel: "meta-llama/Llama-3.1-8B-Instruct", oaurl: "https://api.groq.com/openai/v1", oamodel: ""};
const SECRET = ["gkey","ikey","hfkey","oakey"];
let modelList = [], hfList = [], oaList = [];
function provUI(){ const v = $("prov").value; $("pg").hidden = v !== "gemini"; $("ph").hidden = v !== "hf"; $("po").hidden = v !== "oa"; }
function badges(){
  [["gkey","bg"],["ikey","bi"],["hfkey","bh"],["oakey","bo"]].forEach(([k, b]) => {
    const ok = !!store.get("si_" + k); $(b).textContent = t(ok ? "saved" : "missing"); $(b).className = "badge " + (ok ? "ok" : "err");
  });
}
function fillModels(list, sel){
  const ids = [...new Set([sel, ...list].filter(Boolean))];
  $("model").innerHTML = ""; ids.forEach(id => { const o = document.createElement("option"); o.value = o.textContent = id; $("model").appendChild(o); });
  $("model").value = sel;
}
function loadSettings(){
  FIELDS.forEach(k => { if(k !== "model") $(k).value = store.get("si_" + k) || DEF[k] || ""; });
  fillModels(modelList, store.get("si_model") || DEF.model);
  SECRET.forEach(k => $(k).type = "password");
  document.querySelectorAll(".tog").forEach(b => { b.dataset.i = "show"; b.textContent = t("show"); });
  provUI(); badges();
}
document.querySelectorAll(".tog").forEach(b => b.onclick = () => {
  const i = $(b.dataset.for), show = i.type === "password";
  i.type = show ? "text" : "password"; b.dataset.i = show ? "hide" : "show"; b.textContent = t(b.dataset.i);
});
$("prov").onchange = provUI;
$("open").onclick = () => {
  loadSettings(); $("cfg").showModal();
  const pv = store.get("si_prov");
  if(pv === "hf"){ if(!hfList.length) $("refh").click(); }
  else if(pv === "oa"){ if(store.get("si_oakey") && !oaList.length) $("refo").click(); }
  else if(store.get("si_gkey") && !modelList.length) $("refm").click();
};
$("close").onclick = () => $("cfg").close();
$("cfg").addEventListener("close", loadSettings);
$("save").onclick = () => { FIELDS.forEach(k => store.set("si_" + k, $(k).value.trim())); $("cfg").close(); say("settingsSaved", "ok"); loadAll(); };
$("clear").onclick = async () => { if(!(await ask("cfmClear"))) return; SECRET.forEach(k => store.set("si_" + k, "")); loadSettings(); };

$("openHelp").onclick = () => {
  $("helpBody").innerHTML = t("helpContent");
  $("helpDlg").showModal();
};
$("closeHelp").onclick = () => $("helpDlg").close();

async function fetchList(url, key){
  const r = await fetch(url, key ? {headers: {Authorization: "Bearer " + key}} : {});
  const j = await r.json();
  if(!r.ok) throw new Error((j.error && (j.error.message || (typeof j.error === "string" ? j.error : ""))) || ("HTTP " + r.status));
  return j;
}
function listBtn(btn, noteId, run){
  $(btn).onclick = async () => {
    const note = (k, c, ...a) => { $(noteId).textContent = t(k, ...a); $(noteId).className = "badge " + (c || ""); };
    $(btn).disabled = true; note("loading");
    try{ await run(note); }catch(e){ note("err", "err", errText(e)); }
    $(btn).disabled = false;
  };
}
async function geminiModels(key){
  const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000", {headers: {"x-goog-api-key": key}});
  const j = await r.json();
  if(!r.ok) throw new Error(j.error?.message || ("HTTP " + r.status));
  const ver = n => parseFloat((n.match(/^gemini-(\d+(?:\.\d+)?)-/) || [])[1]);
  return (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => m.name.replace("models/", ""))
    .filter(n => /flash/.test(n) && !/image|tts|live|audio|embed|robotics|computer|native/.test(n) && ver(n) >= 3.6)
    .sort((x, y) => ver(y) - ver(x) || x.localeCompare(y));
}
listBtn("refm", "mnote", async note => {
  const key = $("gkey").value.trim();
  if(!key) return note("needG", "err");
  modelList = await geminiModels(key);
  const cur = $("model").value;
  fillModels(modelList, modelList.includes(cur) ? cur : (modelList[0] || cur));
  modelList.length ? note("nModels", "ok", modelList.length) : note("noModels", "err");
});
listBtn("refh", "hnote", async note => {
  const j = await fetchList("https://router.huggingface.co/v1/models", $("hfkey").value.trim());
  hfList = (j.data || []).map(m => m.id).sort((x, y) => x.localeCompare(y));
  $("hfl").innerHTML = hfList.map(id => `<option value="${esc(id)}"></option>`).join("");
  note("nModels", "ok", hfList.length);
});
listBtn("refo", "onote", async note => {
  const base = $("oaurl").value.trim().replace(/\/+$/, "");
  if(!base) return note("needUrl", "err");
  const j = await fetchList(base + "/models", $("oakey").value.trim());
  oaList = (Array.isArray(j) ? j : (j.data || [])).map(m => m.id || m.name).filter(Boolean).sort((x, y) => x.localeCompare(y));
  $("oal").innerHTML = oaList.map(id => `<option value="${esc(id)}"></option>`).join("");
  note("nModels", "ok", oaList.length);
});
$("oaurl").onchange = () => { oaList = []; };

// ---------- intervals.icu ----------
const KEY = () => store.get("si_ikey"), AID = () => store.get("si_aid") || "0";
const ICU = {ftpIn: 0, ftpOut: 0, weight: 0, age: null}, LAST = {};
const icuAuth = () => ({Authorization: "Basic " + btoa("API_KEY:" + KEY())});
const icuUrl = path => `https://intervals.icu/api/v1/athlete/${encodeURIComponent(AID())}${path}`;
async function icuFetch(url, opt){
  if(!KEY()) throw new Error(t("keyMissing"));
  const r = await fetch(url, {headers: icuAuth(), ...(opt || {})});
  if(!r.ok) throw new Error("HTTP " + r.status);
  return opt && opt.method === "DELETE" ? null : r.json();
}
const icu = path => icuFetch(icuUrl(path));
const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return iso(d); };
const pad = n => String(n).padStart(2, "0");
const hm = sec => { const m = Math.round(sec / 60); return m >= 60 ? Math.floor(m / 60) + "h" + pad(m % 60) : m + " min"; };
const mmss = sec => Math.floor(sec / 60) + ":" + pad(Math.round(sec) % 60);
const loc = () => lang === "fr" ? "fr-FR" : "en-GB";
const isBike = s => /Ride/.test(s);
function curFtp(){ return ($("ftpsel").value === "in" ? ICU.ftpIn : ICU.ftpOut) || 0; }
function fillFtp(){
  const a = t("indoor") + (ICU.ftpIn ? ` (${ICU.ftpIn} W)` : ""), b = t("outdoor") + (ICU.ftpOut ? ` (${ICU.ftpOut} W)` : "");
  [$("ftpsel"), $("edftp"), $("libftp")].forEach(s => { s.options[0].textContent = a; s.options[1].textContent = b; });
}
function profText(){
  if(!$("prof")) return;
  if(LAST.profErr){ $("prof").textContent = t("errI", LAST.profErr); return; }
  $("prof").textContent = [ICU.weight ? ICU.weight + " kg" : "", ICU.age ? t("age", ICU.age) : "", "FTP " + t("indoor") + " " + (ICU.ftpIn || "–") + " W", t("outdoor") + " " + (ICU.ftpOut || "–") + " W"].filter(Boolean).join(" · ");
}
async function loadProfile(){
  const a = await icu("");
  const rideSet = x => (x.types || []).includes("Ride");
  let ss = (a.sportSettings || []).find(rideSet);
  if(!ss){ try{ ss = (await icu("/sport-settings")).find(rideSet); }catch(e){} }
  ICU.ftpOut = (ss && ss.ftp) || 0; ICU.ftpIn = (ss && (ss.indoor_ftp || ss.ftp)) || 0;
  ICU.weight = a.icu_weight || a.weight || 0;
  const dob = a.icu_date_of_birth || a.date_of_birth || a.birthdate;
  ICU.age = dob ? Math.floor((Date.now() - new Date(dob)) / 31557600000) : null;
  LAST.profErr = ""; fillFtp(); profText();
}

// --- deux dernières semaines ---
const grp = l => l.reduce((m, a) => { const k = (a.start_date_local || "").slice(0, 10); (m[k] = m[k] || []).push(a); return m; }, {});
function dayHtml(k, L, w, P){
  const f = v => Math.round(v), n1 = v => String(Math.round(v * 10) / 10);
  let h = `<b>${esc(new Date(k + "T12:00:00").toLocaleDateString(loc(), {weekday: "long", day: "numeric", month: "long"}))}</b>`;
  if(w && w.ctl != null) h += `<div>CTL ${f(w.ctl)} · ATL ${f(w.atl)} · ${lang === "fr" ? "forme" : "form"} ${f(w.ctl - w.atl)}</div>`;
  if(!L.length) h += `<div>${t("rest")}</div>`;
  for(const a of L){
    const parts = [hm(a.moving_time || 0)];
    if(a.distance) parts.push(n1(a.distance / 1000) + " km");
    if(a.total_elevation_gain) parts.push(t("dElev", f(a.total_elevation_gain)));
    const q = [t("dLoad", f(a.icu_training_load || 0))];
    if(a.icu_intensity) q.push("IF " + (a.icu_intensity > 5 ? a.icu_intensity / 100 : a.icu_intensity).toFixed(2));
    if(a.icu_weighted_avg_watts) q.push("NP " + f(a.icu_weighted_avg_watts) + " W");
    if(a.icu_average_watts) q.push(t("dAvg", f(a.icu_average_watts)));
    if(a.average_heartrate) q.push(t("dHR", f(a.average_heartrate)));
    h += `<div class="act"><b>${esc(a.name || a.type || "")}</b> ${esc(actT(a.type))} ${esc((a.start_date_local || "").slice(11, 16))}<br>${esc(parts.join(" · "))}<br>${esc(q.join(" · "))}</div>`;
  }
  for(const e of P) h += `<div class="act">${esc(t("planned", (e.name || "") + (e.moving_time ? " (" + hm(e.moving_time) + ")" : "")))}</div>`;
  return h;
}
function renderLoad(){
  if(!LAST.acts) return;
  const by = grp(LAST.acts), pl = grp(LAST.plan || []), wl = {};
  (LAST.well || []).forEach(w => { wl[w.id] = w; });
  const cols = []; let max = 1, tl = 0, tt = 0;
  for(let i = 13; i >= 0; i--){
    const k = daysAgo(i), L = by[k] || [], load = L.reduce((s, a) => s + (a.icu_training_load || 0), 0);
    max = Math.max(max, load); tl += load; tt += L.reduce((s, a) => s + (a.moving_time || 0), 0);
    cols.push({k, load, html: dayHtml(k, L, wl[k], pl[k] || [])});
  }
  LAST.days = cols.map(c => c.html);
  $("loadbox").innerHTML = `<div class="days">` + cols.map((c, n) => `<div class="d${c.k === daysAgo(0) ? " now" : ""}" data-n="${n}"><div class="bar${c.load > 120 ? " h3" : c.load > 60 ? " h2" : c.load > 0 ? " h1" : ""}" style="height:${c.load ? Math.max(4, c.load / max * 72) : 2}px"></div><span>${c.k.slice(8)}</span></div>`).join("") + `</div><div class="tip" hidden></div>`;
  const w = (LAST.well || [])[(LAST.well || []).length - 1];
  $("loadcap").textContent = t("loadCap", LAST.acts.length, hm(tt), Math.round(tl)) + (w && w.ctl != null ? t("loadCap2", Math.round(w.ctl), Math.round(w.atl), Math.round(w.ctl - w.atl)) : "");
}
function hoverTip(box, htmlOf){
  const move = e => {
    const tip = box.querySelector(".tip"); if(!tip) return;
    const d = e.target.closest ? e.target.closest("[data-n]") : null;
    if(!d || !box.contains(d)){ tip.hidden = true; return; }
    if(tip.dataset.n !== d.dataset.n){ tip.dataset.n = d.dataset.n; tip.innerHTML = htmlOf(+d.dataset.n); }
    tip.hidden = false;
    const r = box.getBoundingClientRect();
    tip.style.left = Math.max(0, Math.min(e.clientX - r.left - tip.offsetWidth / 2, r.width - tip.offsetWidth)) + "px";
    tip.style.top = (e.clientY - r.top + 16) + "px";
  };
  ["pointermove", "pointerdown"].forEach(ev => box.addEventListener(ev, move));
  box.addEventListener("pointerleave", () => { const tip = box.querySelector(".tip"); if(tip) tip.hidden = true; });
}
hoverTip($("loadbox"), i => LAST.days[i]);

// --- dernière séance ---
function ds(arr, n){
  if(!arr || !arr.length) return [];
  const w = Math.max(1, Math.floor(arr.length / n)), out = [];
  for(let i = 0; i < arr.length; i += w){
    let s = 0, c = 0;
    for(let j = i; j < Math.min(i + w, arr.length); j++){ const v = arr[j]; if(typeof v === "number" && !isNaN(v)){ s += v; c++; } }
    out.push(c ? s / c : 0);
  }
  return out;
}
function streamsSvg(){
  const w = ds(LAST.sw, 240), h = ds(LAST.sh, 240), n = Math.max(w.length, h.length);
  if(!n) return `<div class="hint">${esc(t("noStreams"))}</div>`;
  const X = i => (i / Math.max(1, n - 1) * 300).toFixed(1);
  let svg = `<svg id="lsvg" viewBox="0 0 300 90" preserveAspectRatio="none">`;
  if(w.length){ const m = Math.max(...w, 1); svg += `<path class="lp" d="M0 90${w.map((v, i) => `L${X(i)} ${(88 - v / m * 84).toFixed(1)}`).join("")}L300 90Z"/>`; }
  const hv = h.filter(v => v > 0);
  if(hv.length){ const lo = Math.min(...hv), hi = Math.max(...hv); svg += `<polyline class="lh" points="${h.map((v, i) => X(i) + "," + (88 - (Math.max(v, lo) - lo) / Math.max(1, hi - lo) * 80).toFixed(1)).join(" ")}"/>`; }
  const lg = [w.length ? `<span><i style="background:var(--acc)"></i>${esc(t("lPow"))} · max ${Math.round(Math.max(...w))} W</span>` : "", hv.length ? `<span><i style="background:#d6336c"></i>${esc(t("lHRs"))} · max ${Math.round(Math.max(...hv))} bpm</span>` : ""].join("");
  return svg + `</svg><div class="hint" id="linfo">&nbsp;</div><div class="leg">${lg}</div>`;
}
function renderLast(){
  const box = $("lastbox"), a = LAST.last;
  if(!LAST.acts){ box.textContent = ""; return; }
  if(!a){ box.textContent = t("noWorkout"); return; }
  const f = v => Math.round(v), kv = [[t("lDur"), hm(a.moving_time || 0)]];
  if(a.distance) kv.push([t("lDist"), (Math.round(a.distance / 100) / 10) + " km"]);
  if(a.total_elevation_gain) kv.push([t("lElev"), f(a.total_elevation_gain) + " m"]);
  kv.push([t("lLoad"), f(a.icu_training_load || 0)]);
  if(a.icu_intensity) kv.push([t("lIF"), (a.icu_intensity > 5 ? a.icu_intensity / 100 : a.icu_intensity).toFixed(2)]);
  if(a.icu_weighted_avg_watts) kv.push([t("lNP"), f(a.icu_weighted_avg_watts) + " W"]);
  if(a.icu_average_watts) kv.push([t("lAvgP"), f(a.icu_average_watts) + " W"]);
  if(a.average_heartrate) kv.push([t("lHR"), f(a.average_heartrate) + " bpm"]);
  if(a.max_heartrate) kv.push([t("lMaxHR"), f(a.max_heartrate) + " bpm"]);
  if(a.average_cadence) kv.push([t("lCad"), f(a.average_cadence) + " rpm"]);
  if(a.average_speed && /Run|Swim/.test(a.type || "")){ const sw = /Swim/.test(a.type); kv.push([t("lPace"), mmss((sw ? 100 : 1000) / a.average_speed) + (sw ? " /100 m" : " /km")]); }
  else if(a.average_speed) kv.push([t("lSpeed"), (a.average_speed * 3.6).toFixed(1) + " km/h"]);
  if(a.icu_efficiency_factor) kv.push([t("lEF"), (+a.icu_efficiency_factor).toFixed(2)]);
  const when = new Date(a.start_date_local).toLocaleString(loc(), {weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
  const pos = (LAST.list || []).length > 1 ? ` · ${LAST.li + 1}/${LAST.list.length}` : "";
  $("lprev").disabled = !(LAST.list || []).length || (LAST.li || 0) >= LAST.list.length - 1;

let selLine = null, EXPL = null;
function parseWorkout(txt, sport, ftp){
  const steps = []; let group = null;
  const flush = () => { if(group){ for(let i = 0; i < group.n; i++) steps.push(...group.items); group = null; } };
  const num = x => parseFloat(String(x).replace(",", "."));
  const dur = str => {
    let tt = 0, m; const re = /(\d+(?:[.,]\d+)?)\s*(h|min|m|s)(?![a-z])/gi;
    while((m = re.exec(str))){ const v = num(m[1]), u = m[2].toLowerCase(); tt += u === "h" ? v * 3600 : u === "s" ? v : v * 60; }
    return tt;
  };
  const dist = str => {
    const m = str.match(/(\d+(?:[.,]\d+)?)\s*(mtr|km|yrd)/i); if(!m) return 0;
    const v = num(m[1]), u = m[2].toLowerCase(); return u === "km" ? v * 1000 : u === "yrd" ? v * 0.9144 : v;
  };
  const inten = str => {
    let m = str.match(/(\d+(?:[.,]\d+)?)(?:\s*-\s*(\d+(?:[.,]\d+)?))?\s*%/);
    if(m){ const a = num(m[1]), b = m[2] ? num(m[2]) : a; return {a, b, idx: m.index, ramp: /ramp/i.test(str)}; }
    m = str.match(/(\d+(?:[.,]\d+)?)\s*w\b/i);
    if(m && ftp > 0){ const v = num(m[1]) / ftp * 100; return {a: v, b: v, idx: m.index, ramp: false}; }
    m = str.match(/\bz([1-7])\b/i);
    if(m){ const v = [50, 65, 82, 97, 112, 135, 160][m[1] - 1]; return {a: v, b: v, idx: m.index, ramp: false}; }
    return null;
  };
  const spm = sport === "Swim" ? 1 : sport === "Run" ? 0.24 : 0.36;
  for(const [li, raw] of txt.split("\n").entries()){
    const line = raw.trim();
    if(!line){ flush(); continue; }
    if(line.startsWith("-")){
      const it = inten(line); if(!it) continue;
      const pre = line.slice(0, it.idx), mid = (it.a + it.b) / 2;
      let d = dur(pre);
      if(!d){ const m = dist(pre); if(m) d = m * spm / Math.max(mid / 100, 0.3); }
      if(!d) continue;
      const step = {d, a: it.ramp ? it.a : mid, b: it.ramp ? it.b : mid, line: li};
      if(group) group.items.push(step); else steps.push(step);
    }else{
      flush();
      const r = line.match(/(\d+)\s*x\s*$/i);
      if(r) group = {n: Math.min(parseInt(r[1], 10), 50), items: []};
    }
  }
  flush();
  return steps;
}
const zoneOf = p => p < 56 ? 1 : p < 76 ? 2 : p < 91 ? 3 : p < 106 ? 4 : p < 121 ? 5 : p < 151 ? 6 : 7;
const toWatts = (desc, ftp) => desc.split("\n").map(l => l.trim().startsWith("-") ? l.replace(/(\d+(?:\.\d+)?)\s*%/, (m, p) => Math.round(p * ftp / 100) + "w") : l).join("\n");
function renderChart(){
  const box = $("chart"), sport = $("sport").value, ftp = curFtp();
  const steps = parseWorkout($("desc").value, sport, ftp);
  if(!steps.length){ box.innerHTML = ""; box._steps = []; $("explain").hidden = true; return; }
  const total = steps.reduce((s, x) => s + x.d, 0), peak = Math.max(120, ...steps.map(s => Math.max(s.a, s.b)));
  const W = 300, H = 100, meta = [];
  let x = 0, path = "", wsum = 0, t0 = 0;
  for(const s of steps){
    const w = s.d / total * W, ya = H - s.a / peak * (H - 4), yb = H - s.b / peak * (H - 4);
    path += `<path data-n="${meta.length}" class="z${zoneOf((s.a + s.b) / 2)}${s.line === selLine ? " sel" : ""}" d="M${x.toFixed(2)} ${H}L${x.toFixed(2)} ${ya.toFixed(1)}L${(x + w).toFixed(2)} ${yb.toFixed(1)}L${(x + w).toFixed(2)} ${H}Z"/>`;
    meta.push({d: s.d, a: s.a, b: s.b, start: t0, line: s.line}); t0 += s.d; x += w; wsum += s.d * (s.a + s.b) / 2;
  }
  const avg = Math.round(wsum / total), pace = sport === "Run" || sport === "Swim", mins = Math.round(total / 60);
  const dtxt = mins >= 60 ? Math.floor(mins / 60) + "h" + pad(mins % 60) : mins + " min";
  const cap = dtxt + t("capAvg") + avg + (pace ? t("pctPace") : t("pctFtp")) + (!pace && ftp > 0 ? " (" + Math.round(avg * ftp / 100) + " W)" : "");

  box._steps = meta; renderExplain(steps);
}
function tipText(s, ftp, pace){
  const f = v => Math.round(v), sec = Math.round(s.d);
  const d = sec < 60 ? sec + " s" : (sec % 60 ? Math.floor(sec / 60) + "'" + pad(sec % 60) : Math.round(sec / 60) + " min");

}

async function smartRandom(){
  if(!KEY()) return classicRandom();
  $("rand").disabled = true; progStart("analyzing");
  try{
    const rng = `oldest=${daysAgo(27)}&newest=${daysAgo(0)}`;
    const [acts, well] = await Promise.all([icu(`/activities?${rng}`), icu(`/wellness?oldest=${daysAgo(3)}&newest=${daysAgo(0)}`).catch(() => [])]);
    acts.sort((x, y) => (x.start_date_local || "") < (y.start_date_local || "") ? -1 : 1);
    const w = well[well.length - 1], ctl = w && w.ctl != null ? w.ctl : 0, tsb = w && w.ctl != null ? w.ctl - w.atl : 0;
    const lines = acts.slice(-14).map(a => `- ${(a.start_date_local || "").slice(0, 10)} ${a.type} "${a.name}" ${hm(a.moving_time || 0)}, load ${Math.round(a.icu_training_load || 0)}` + (a.icu_weighted_avg_watts ? `, NP ${Math.round(a.icu_weighted_avg_watts)} W` : "")).join("\n");
    const fit = w && w.ctl != null ? `Current form: CTL ${Math.round(w.ctl)}, ATL ${Math.round(w.atl)}, TSB ${Math.round(w.ctl - w.atl)}.` : "";
    const yest = acts.filter(a => (a.start_date_local || "").slice(0, 10) === daysAgo(1));
    const yLoad = yest.reduce((s, a) => s + (a.icu_training_load || 0), 0);
    const yIF = Math.max(0, ...yest.map(a => a.icu_intensity ? (a.icu_intensity > 5 ? a.icu_intensity / 100 : a.icu_intensity) : 0));
    const yTime = yest.reduce((s, a) => s + (a.moving_time || 0), 0), hard = yest.length && (yLoad >= 90 || yIF >= 0.85 || (ctl && yLoad > ctl * 1.2) || yTime >= 7200), mod = yest.length && !hard && (yLoad >= 60 || yTime >= 5400);
    let rule = "Yesterday: no recorded workout (rest day).";
    if(yest.length) rule = `Yesterday: ${yest.map(a => `"${a.name}" ${hm(a.moving_time || 0)}`).join(", ")}, total load ${Math.round(yLoad)}, max IF ${yIF.toFixed(2)} => ${hard ? "HARD session" : mod ? "moderately hard session" : "easy session"}.`;
    if(hard) rule += "\nMANDATORY: yesterday was hard, so today MUST be an easy day: active recovery or very easy endurance only, Z1-Z2 (at most 65% intensity), no intervals, no tempo, at most 60 minutes (this overrides any longer requested duration).";
    else if(mod) rule += "\nYesterday was fairly demanding: no hard intervals today, prefer endurance or light tempo.";
    if(!hard && tsb < -25) rule += "\nMANDATORY: accumulated fatigue is high (form " + Math.round(tsb) + "), so today MUST be an easy day: Z1-Z2 only, no intervals.";
    const ctx = `intervals.icu context (last 28 days):\n${lines || "- no workout"}\n${fit}\n${rule}\nPropose today's workout in the spirit of these recent workouts and adapted to my current load, with some variety.`;
    $("date").value = iso(new Date());
    $("prompt").value = t("randPrompt");
    $("rand").disabled = false;
    generate(ctx);
  }catch(e){
    progEnd(); $("rand").disabled = false; say("randFallback", "err", errText(e)); classicRandom();
  }
}

function bzWarm(theme){
  if(theme === "bz_recovery") return "Warmup\n- 5m 45%";
  if(theme === "bz_endurance") return "Warmup\n- 15m 55%";
  if(theme === "bz_tempo") return "Warmup\n- 10m 50%\n- 5m 65%";
  if(theme === "bz_test") return "Warmup\n- 15m 50%\n- 5m 65%";
  return "Warmup\n- 10m 50%\n- 5m 70%\n- 3x 30s 115%\n- 2m 50%";
}
function bz(theme, name, name_fr, main, expl_en, expl_fr, warm, cool){
  const desc_en = (warm || bzWarm(theme)) + "\n\n" + main + "\n\n" + (cool || "Cooldown\n- 10m 50%");
  LIBRARY.push(extraWorkout(theme, name, name_fr, desc_en, expl_en, expl_fr));
}

function workoutPreviewSvg(desc, sport, ftp){
  const steps = parseWorkout(desc, sport, ftp);
  if(!steps.length) return "";
  const total = steps.reduce((sum, step) => sum + step.d, 0);
  const peak = Math.max(120, ...steps.map(step => Math.max(step.a, step.b)));
  const W = 300, H = 100;
  let x = 0, path = "";
  for(const step of steps){
    const w = step.d / total * W;
    const ya = H - step.a / peak * (H - 4), yb = H - step.b / peak * (H - 4);
    path += `<path class="z${zoneOf((step.a + step.b) / 2)}" d="M${x.toFixed(2)} ${H}L${x.toFixed(2)} ${ya.toFixed(1)}L${(x+w).toFixed(2)} ${yb.toFixed(1)}L${(x+w).toFixed(2)} ${H}Z"/>`;
    x += w;
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${path}</svg>`;
}

function renderLibrary(){
  const c = $("libContainer");
  const q = ($("libsearch").value || "").trim().toLowerCase();
  const matches = item => {
    if(!q) return true;
    const hay = [item.name_en, item.name_fr, item.expl_en, item.expl_fr, item.desc_en].join(" ").toLowerCase();
    return q.split(/\s+/).every(w => hay.includes(w));
  };
  const themes = [
    {id:"beginner",icon:"🌱",en:"Beginner",fr:"Débutant"},
    {id:"short",icon:"⏱️",en:"Under 35 Min",fr:"Moins de 35 min"},
    {id:"fast",icon:"⚡",en:"Fast Fitness",fr:"Fitness rapide"},
    {id:"testing",icon:"🎯",en:"Testing & Preparation",fr:"Tests & préparation"},
    {id:"anaerobic",icon:"🔥",en:"Anaerobic",fr:"Anaérobie"},
    {id:"endurance",icon:"🚴",en:"Endurance",fr:"Endurance"},
    {id:"sprint",icon:"💥",en:"Sprint",fr:"Sprint"},
    {id:"sweetspot",icon:"🟠",en:"Sweet Spot",fr:"Sweet spot"},
    {id:"taper",icon:"🏁",en:"Taper",fr:"Affûtage"},
    {id:"tempo",icon:"📈",en:"Tempo",fr:"Tempo"},
    {id:"threshold",icon:"🔥",en:"Threshold",fr:"Seuil"},
    {id:"uae",icon:"🏔️",en:"UAE Team Emirates Style",fr:"Style UAE Team Emirates"},
    {id:"adq",icon:"🚴‍♀️",en:"UAE Team ADQ Style",fr:"Style UAE Team ADQ"},
    {id:"vo2max",icon:"⚡",en:"VO₂ Max",fr:"VO₂ Max"},
    {id:"recovery",icon:"🌿",en:"Recovery",fr:"Récupération"},
    {id:"bz_recovery",icon:"🌿",en:"Blocks — Recovery",fr:"Blocks — Récupération"},
    {id:"bz_endurance",icon:"🚴",en:"Blocks — Endurance",fr:"Blocks — Endurance"},
    {id:"bz_tempo",icon:"📈",en:"Blocks — Tempo & Sweet Spot",fr:"Blocks — Tempo & Sweet spot"},
    {id:"bz_threshold",icon:"🔥",en:"Blocks — Threshold",fr:"Blocks — Seuil"},
    {id:"bz_vo2max",icon:"⚡",en:"Blocks — VO₂ Max",fr:"Blocks — VO₂ Max"},
    {id:"bz_sprint",icon:"💥",en:"Blocks — Sprint & Anaerobic",fr:"Blocks — Sprint & Anaérobie"},
    {id:"bz_test",icon:"🎯",en:"Blocks — Testing",fr:"Blocks — Tests"}
  ];
  const groups=themes.map(theme=>({...theme,items:[]}));
  const categorize=item=>{
    if(item.category) return item.category;
    const n=(item.name_en+" "+item.name_fr).toLowerCase();
    if(/recovery|récupération/.test(n)) return "recovery";
    if(/vo2|max|punchy|explosif/.test(n)) return "vo2max";
    if(/sprint/.test(n)) return "sprint";
    if(/threshold|seuil|over-under|redline/.test(n)) return "threshold";
    if(/sweet spot/.test(n)) return "sweetspot";
    if(/tempo|cadence|fast finish/.test(n)) return "tempo";
    if(/endurance|aerobic|aérobie/.test(n)) return "endurance";
    if(/uae team em/.test(n)) return "uae";
    if(/uae team adq/.test(n)) return "adq";
    if(/beginner|débutant/.test(n)) return "beginner";
    return "endurance";
  };
  LIBRARY.forEach((item,idx)=>{ if(!matches(item)) return; const group=groups.find(g=>g.id===categorize(item))||groups[5]; group.items.push({item,idx}); });
  const filled = groups.filter(g => g.items.length);
  if(!filled.length){ c.innerHTML = `<div class="hint">${esc(t("libNo"))}</div>`; return; }
  c.innerHTML=filled.map(group=>`<details class="lib-theme"${q ? " open" : ""}>
    <summary><span class="theme-icon">${group.icon}</span><span>${esc(lang==="fr"?group.fr:group.en)}</span><span class="theme-count">${group.items.length} ${lang==="fr"?"séances":"workouts"}</span></summary>
    <div class="lib-theme-body"><div class="lib-grid">${group.items.map(({item,idx})=>{
      const title=lang==="fr"?item.name_fr:item.name_en;
      const desc=lang==="fr"?item.expl_fr:item.expl_en;
      const chart=workoutPreviewSvg(item.desc_en,item.sport,curFtp());
      return `<div class="lib-card"><h3>${esc(title)}</h3><div class="lib-preview" role="img" aria-label="${esc(title)} session preview">${chart}</div><p>${esc(desc)}</p><button class="alt small" data-lib="${idx}" type="button">${esc(t("edGo"))}</button></div>`;
    }).join("")}</div></div>
  </details>`).join("");
}

// ---------- Historique et envoi ----------
const hist = () => { try{ return JSON.parse(store.get("si_hist") || "[]"); }catch(e){ return []; } };
function renderHist(){
  const cur = $("hist").value;
  $("hist").innerHTML = `<option value="">${esc(t("histPick"))}</option>` + hist().map((h, i) => `<option value="${i}">${esc(h.date)} · ${esc(h.name)}</option>`).join("");
  $("hist").value = cur;
}
function addHist(h){
  const l = hist();
  if(l.some(x => x.date === h.date && x.sport === h.sport && x.name === h.name && x.desc === h.desc)) return;
  l.unshift(h); store.set("si_hist", JSON.stringify(l.slice(0, 60))); renderHist();
}
$("hist").onchange = () => {
  const h = hist()[+$("hist").value]; if(!h) return;
  $("date").value = h.date; $("sport").value = h.sport; $("name").value = h.name; $("desc").value = h.desc; EXPL = h.ex || null;
  syncUnit(); selLine = null; $("prev").hidden = false; renderChart();
};
$("hdel").onclick = async () => {
  const l = hist(), i = +$("hist").value, h = l[i];
  if($("hist").value === "" || !h || !(await ask("cfmDel"))) return;
  if(h.id){
    try{ await icuFetch(icuUrl("/events/" + h.id), {method: "DELETE"}); }
    catch(e){ if(!/404/.test(e.message)) return say("errI", "err", errText(e)); }
  }
  l.splice(i, 1); store.set("si_hist", JSON.stringify(l)); $("hist").value = ""; renderHist(); say("workoutDeleted", "ok");
};
$("send").onclick = async () => {
  if(!KEY()) return say("needI", "err");
  $("send").disabled = true; say("sending");
  try{
    const r = await fetch(icuUrl("/events"), {method: "POST", headers: {"Content-Type": "application/json", ...icuAuth()},
      body: JSON.stringify({category: "WORKOUT", start_date_local: $("date").value + "T00:00:00", type: $("sport").value, name: $("name").value.trim(), description: $("desc").value})});
    if(!r.ok) throw new Error("HTTP " + r.status + " " + (await r.text()).slice(0, 200));
    const ev = await r.json().catch(() => ({}));
    addHist({id: ev.id, date: $("date").value, sport: $("sport").value, name: $("name").value.trim(), desc: $("desc").value, ex: EXPL});
    say("sentOk", "ok", $("date").value);
  }catch(e){ say("errI", "err", errText(e)); }
  $("send").disabled = false;
};

// ---------- Explication de la séance ----------
function renderExplain(steps){
  const el = $("explain"), tot = steps.reduce((x, y) => x + y.d, 0) || 1, z = {e: 0, t: 0, h: 0, v: 0};
  steps.forEach(p => { const m = (p.a + p.b) / 2; z[m < 76 ? "e" : m < 91 ? "t" : m < 106 ? "h" : "v"] += p.d; });
  const k = z.v / tot > .08 ? "exV" : z.h / tot > .12 ? "exH" : z.t / tot > .15 ? "exT" : "exE", pc = x => Math.round(x / tot * 100);
  el.innerHTML = `<b>${esc(t("exTitle"))}</b><p>${esc((EXPL && EXPL[lang]) || t(k))}</p><div class="hint">${esc(t("exMix", pc(z.e), pc(z.t), pc(z.h + z.v)))}</div>`;
  el.hidden = false;
}

// ---------- Graphe fitness ----------
const fitDays = () => +$("fper").value || 60;
async function loadFit(){ LAST.fit = await icu(`/wellness?oldest=${daysAgo(fitDays() - 1)}&newest=${daysAgo(0)}`); renderFit(); }
$("fper").onchange = () => { store.set("si_fper", $("fper").value); loadFit().catch(e => { $("fitbox").textContent = t("errI", errText(e)); }); };
function fitInfo(i){
  const x = (LAST.fw || [])[i]; if(!x) return; const f = Math.round;
  $("finfo").textContent = new Date(x.id + "T12:00:00").toLocaleDateString(loc(), {day: "numeric", month: "short", ...(fitDays() >= 180 ? {year: "numeric"} : {})}) + " · " + t("fFit") + " " + f(x.ctl) + " · " + t("fFat") + " " + f(x.atl || 0) + " · " + t("fForm") + " " + f(x.ctl - (x.atl || 0));
}
function renderFit(){
  const box = $("fitbox"), w = (LAST.fit || []).filter(x => x.ctl != null).sort((a, b) => a.id < b.id ? -1 : 1);
  LAST.fw = w;
  if(!w.length){ box.textContent = LAST.fit ? t("nodata") : ""; return; }
  const n = w.length, X = i => (i / Math.max(1, n - 1) * 300).toFixed(1), mx = Math.max(10, ...w.map(x => Math.max(x.ctl, x.atl || 0))) * 1.08;
  const tb = w.map(x => x.ctl - (x.atl || 0)), tm = Math.max(10, ...tb.map(Math.abs)), Y = v => (70 - v / mx * 66).toFixed(1), Z = v => (100 - v / tm * 19).toFixed(1);
  box.innerHTML = `<svg id="fsvg" viewBox="0 0 300 122" preserveAspectRatio="none" role="img" aria-label="${esc(t("fitT"))}"><path class="fc" d="M0 70${w.map((x, i) => `L${X(i)} ${Y(x.ctl)}`).join("")}L300 70Z"/><polyline class="fa" points="${w.map((x, i) => X(i) + "," + Y(x.atl || 0)).join(" ")}"/><line class="fz" x1="0" x2="300" y1="100" y2="100"/><path class="ft" d="M0 100${tb.map((v, i) => `L${X(i)} ${Z(v)}`).join("")}L300 100Z"/><line id="fcur" class="fcur" x1="0" x2="0" y1="0" y2="122"/></svg><div class="hint" id="finfo"></div><div class="leg"><span><i style="background:#3b82c4"></i>${esc(t("fFit"))}</span><span><i style="background:#d6336c"></i>${esc(t("fFat"))}</span><span><i style="background:#e3cf3f"></i>${esc(t("fForm"))}</span></div>`;
  fitInfo(n - 1);
}
$("fitbox").addEventListener("pointermove", e => {
  const sv = e.target.closest ? e.target.closest("#fsvg") : null; if(!sv || !(LAST.fw || []).length) return;
  const r = sv.getBoundingClientRect(), fr = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), i = Math.round(fr * (LAST.fw.length - 1)), x = i / Math.max(1, LAST.fw.length - 1) * 300, c = $("fcur");
  c.setAttribute("x1", x); c.setAttribute("x2", x); c.style.opacity = 1; fitInfo(i);
});
$("fitbox").addEventListener("pointerleave", () => { const c = $("fcur"); if(c) c.style.opacity = 0; fitInfo((LAST.fw || []).length - 1); });

// ---------- Éditeur de séance manuel ----------
const ED = [];
const edSp = () => $("edsport").value, edKm = () => isBike(edSp()), edW = () => edKm() && $("unit").value === "w";
const opts = (a, cur) => a.map(([v, l]) => `<option value="${v}"${v === cur ? " selected" : ""}>${esc(l)}</option>`).join("");
function edDef(ty){
  const pc = {warm: 55, work: 95, rec: 50, cool: 50}[ty], f = curFtp();
  return {k: "s", ty, mode: "t", v: ty === "work" ? "5:00" : ty === "rec" ? "2:00" : "10:00", i: String(edW() && f ? Math.round(f * pc / 100) : pc), n: ""};
}
const edAt = p => { const a = String(p).split(".").map(Number); return a.length === 1 ? {list: ED, i: a[0]} : {list: ED[a[0]].items, i: a[1]}; };
const edBtn = (a, txt, ttl, cls) => `<button class="alt small${cls ? " " + cls : ""}" data-a="${a}" type="button"${ttl ? ` title="${esc(ttl)}" aria-label="${esc(ttl)}"` : ""}>${txt}</button>`;
const edCtl = rec => `<span class="ctl">${edBtn("up", "↑", t("mvUp"))}${edBtn("down", "↓", t("mvDown"))}${edBtn("dup", "⧉", t("dup"))}${rec ? edBtn("rec", esc(t("addRecAfter"))) : ""}${edBtn("del", "✕", t("del"), "danger")}</span>`;
function edStep(x, p){
  const u = edW() ? "W" : edKm() ? "% FTP" : "% " + t("pace");
  return `<div class="st ${x.ty}" data-p="${p}"><select data-f="ty" aria-label="${esc(t("edT"))}">${opts(["warm", "work", "rec", "cool"].map(y => [y, t("tt_" + y)]), x.ty)}</select>` +
    `<select data-f="mode">${opts([["t", t("edTime")], ["d", t("edDist")]], x.mode)}</select>` +
    `<div class="fld"><input data-f="v" value="${esc(x.v)}" aria-label="${esc(t(x.mode === "d" ? "edDist" : "edTime"))}"><span>${x.mode === "d" ? (edKm() ? "km" : "m") : "mm:ss"}</span></div>` +
    `<div class="fld"><input data-f="i" type="number" min="0" value="${esc(x.i)}" aria-label="${esc(t("edInt"))}"><span>${esc(u)}</span></div>` +
    `<input data-f="n" value="${esc(x.n)}" placeholder="${esc(t("edNote"))}">${edCtl(x.ty !== "rec")}</div>`;
}
const edGrp = (g, i) => `<div class="grp"><div class="gh" data-p="${i}"><b>${esc(t("repLbl"))}</b><span class="stp">${edBtn("rm", "−", t("repDec"))}<input data-f="r" type="number" min="1" max="50" value="${esc(g.r)}" aria-label="${esc(t("repLbl"))}">${edBtn("rp", "+", t("repInc"))}<span aria-hidden="true">×</span></span>${edCtl(false)}</div>${g.items.map((x, j) => edStep(x, i + "." + j)).join("")}<div class="actions"><button class="alt small" data-a="addin" data-g="${i}" data-ty="work" type="button">${esc(t("addWork"))}</button><button class="alt small" data-a="addin" data-g="${i}" data-ty="rec" type="button">${esc(t("addRec"))}</button></div></div>`;
function edDur(x){
  if(x.mode === "d") return (parseFloat(String(x.v).replace(",", ".")) || 0) + (edKm() ? "km" : "mtr");
  const [m, sc] = String(x.v).split(":"), sec = (parseInt(m, 10) || 0) * 60 + (parseInt(sc, 10) || 0), h = Math.floor(sec / 3600), mm = Math.floor(sec % 3600 / 60), ss = sec % 60;
  return (h ? h + "h" : "") + (mm ? mm + "m" : "") + (ss ? ss + "s" : "") || "0s";
}
function edLine(x){
  const i = x.i !== "" && x.i != null ? " " + x.i + (edW() ? "w" : "%") + (edKm() ? "" : " Pace") : "", n = x.n || (x.ty === "rec" ? t("tt_rec") : "");
  return `- ${edDur(x)}${i}${n ? " " + n : ""}`;
}
function edText(){
  const out = [];
  ED.forEach(x => { if(x.k === "g") out.push(`${t("tMain")} ${parseInt(x.r, 10) || 1}x`, ...x.items.map(edLine), ""); else out.push(t("tt_" + x.ty), edLine(x), ""); });
  return out.join("\n").trim();
}
function edSum(){
  const tot = parseWorkout(edText(), edSp(), curFtp()).reduce((a, b) => a + b.d, 0);
  $("edsum").textContent = tot ? t("edTot", hm(tot)) : "";
}
function edRender(){
  $("edftp").disabled = $("edunit").disabled = !edKm();
  $("edhint").textContent = t(edW() ? "edHintW" : edKm() ? "edHintP" : "edHintPace");
  $("edbox").innerHTML = ED.length ? ED.map((x, i) => x.k === "g" ? edGrp(x, i) : edStep(x, String(i))).join("") : `<div class="hint">${esc(t("edNone"))}</div>`;
  edSum();
}
$("edbox").addEventListener("input", e => {
  const el = e.target, h = el.closest("[data-p]"); if(!h || !el.dataset.f) return;
  const {list, i} = edAt(h.dataset.p); list[i][el.dataset.f] = el.value;
  if(el.dataset.f === "ty" || el.dataset.f === "mode") edRender(); else edSum();
});
$("edbox").addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if(!b) return; const a = b.dataset.a;
  const gp = (a === "rm" || a === "rp") ? b.closest("[data-p]").dataset.p : null;
  if(a === "addin") ED[+b.dataset.g].items.push(edDef(b.dataset.ty));
  else{
    const {list, i} = edAt(b.closest("[data-p]").dataset.p);
    if(a === "rm" || a === "rp") list[i].r = Math.min(50, Math.max(1, (parseInt(list[i].r, 10) || 1) + (a === "rp" ? 1 : -1)));
    else if(a === "del") list.splice(i, 1);
    else if(a === "dup") list.splice(i + 1, 0, JSON.parse(JSON.stringify(list[i])));
    else if(a === "rec") list.splice(i + 1, 0, edDef("rec"));
    else if(a === "up" && i > 0){ const o = list[i - 1]; list[i - 1] = list[i]; list[i] = o; }
    else if(a === "down" && i < list.length - 1){ const o = list[i + 1]; list[i + 1] = list[i]; list[i] = o; }
  }
  edRender();
  if(gp !== null){ const nb = $("edbox").querySelector(`[data-p="${gp}"] [data-a="${a}"]`); if(nb) nb.focus(); }
});
document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { const ty = b.dataset.add; ED.push(ty === "grp" ? {k: "g", r: 4, items: [edDef("work"), edDef("rec")]} : edDef(ty)); edRender(); });
$("edsport").onchange = edRender; $("unit").addEventListener("change", edRender);
$("edgo").onclick = () => {
  const txt = edText(); if(!txt) return say("edNone", "err");
  $("sport").value = edSp(); syncUnit(); $("name").value = $("edname").value.trim() || t("edDefName"); $("desc").value = txt;
  EXPL = null; selLine = null; $("prev").hidden = false; renderChart(); $("prev").scrollIntoView({behavior: "smooth", block: "start"}); say("edBuilt", "ok");
};
$("edsport").value = $("sport").value;
[["ftpsel", "edftp"], ["unit", "edunit"]].forEach(([a, b]) => {
  $(b).onchange = () => { $(a).value = $(b).value; $(a).dispatchEvent(new Event("change")); };
  $(a).addEventListener("change", () => { $(b).value = $(a).value; });
});

// ---------- Bascule des modes (AI / Edit / Lib) ----------
let mode = store.get("si_mode") || "ai";
function applyMode(){
  document.querySelector('[data-block="req"]').hidden = mode !== "ai";
  document.querySelector('[data-block="edit"]').hidden = mode !== "edit";
  document.querySelector('[data-block="lib"]').hidden = mode !== "lib";
  document.querySelectorAll(".mode button").forEach(b => { const on = b.dataset.m === mode; b.setAttribute("aria-selected", String(on)); b.tabIndex = on ? 0 : -1; });
}
document.querySelectorAll(".mode button").forEach(b => {
  b.onclick = () => { mode = b.dataset.m; store.set("si_mode", mode); applyMode(); };
  b.onkeydown = e => {
    const modes = ["ai", "edit", "lib"]; let idx = modes.indexOf(mode);
    if(e.key === "ArrowLeft") idx = (idx - 1 + modes.length) % modes.length;
    else if(e.key === "ArrowRight") idx = (idx + 1) % modes.length;
    else return;
    mode = modes[idx]; store.set("si_mode", mode); applyMode(); document.querySelector(`.mode [data-m="${mode}"]`).focus();
  };
});

// ---------- Blocs repliables, liens, langue, démarrage ----------
let off = []; try{ const so = store.get("si_off"); if(so) off = JSON.parse(so).filter(k => k !== "req" && k !== "edit" && k !== "lib"); }catch(e){}
function applyBlocks(){
  document.querySelectorAll("[data-block]").forEach(sec => {
    const closed = off.includes(sec.dataset.block); sec.classList.toggle("off", closed);
    const b = sec.querySelector(".tgl"); if(b){ b.textContent = closed ? "▸" : "▾"; b.setAttribute("aria-expanded", String(!closed)); }

document.querySelectorAll('[data-block]:not([data-block="req"]):not([data-block="edit"]):not([data-block="lib"]) > .phead').forEach(h => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "alt small icon tgl"; b.dataset.ia = "title:collapse;aria-label:collapse";

function applyLang(){
  document.documentElement.lang = lang; document.title = t("docTitle");
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t(el.dataset.i); });
  document.querySelectorAll("[data-ia]").forEach(el => el.dataset.ia.split(";").forEach(p => { const [a, k] = p.split(":"); el.setAttribute(a, t(k)); }));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
  setLinks(); fillFtp(); profText(); badges(); renderHist(); renderChart(); renderBest(); renderLoad(); renderLast(); renderFit(); edRender(); renderLibrary();
  if(MSG) say(MSG.k, MSG.cls, ...MSG.a);
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.l; store.set("si_lang", lang); applyLang(); });
$("date").value = iso(new Date());
applyBlocks(); applyMode(); loadSettings(); applyLang(); syncUnit(); $("edsport").value = $("sport").value; edRender(); renderLibrary();
$("ftpsel").value = store.get("si_ftpsel") || "in"; $("bkind").value = store.get("si_bkind") || "VirtualRide";
$("fper").value = store.get("si_fper") || "60"; $("edftp").value = $("ftpsel").value; $("edunit").value = $("unit").value; $("libftp").value = $("ftpsel").value;
if(!store.get("si_gkey") && !store.get("si_hfkey") && !store.get("si_oakey") || !KEY()) $("cfg").showModal();
loadAll();
