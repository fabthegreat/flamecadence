<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaceForge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%230f6e6e'/%3E%3Ccircle cx='20' cy='20' r='12' fill='none' stroke='white' stroke-opacity='.5' stroke-width='3'/%3E%3Cpath d='M22 8 14 22h6l-2 10 9-15h-6z' fill='white'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#1b2733;--mute:#5d6b78;--line:#cfd7de;--acc:#0f6e6e;--err:#b3261e;--ok:#1d7a3a;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#12181e;--card:#1a232b;--ink:#e6ebef;--mute:#98a6b3;--line:#2d3944;--acc:#4fc3c3;--err:#ff8a80;--ok:#7bd88f;--on:#08201f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:1120px;margin:0 auto;padding:20px 16px 24px}
h1{font-size:1.4rem;margin:0}
p.sub{color:var(--mute);margin:6px 0 20px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-size:1rem;margin:0 0 12px}
h3.blk{font-size:1rem;margin:20px 0 0}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:90px;resize:vertical}
#desc{font-family:"IBM Plex Mono",monospace;font-size:.85rem;min-height:240px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button,a.alt{display:inline-block;margin-top:14px;padding:11px 16px;border:0;border-radius:6px;background:var(--acc);color:var(--on);font-family:inherit;font-weight:600;font-size:1rem;cursor:pointer;text-decoration:none}
button:disabled{opacity:.5;cursor:default}
.alt{background:transparent!important;color:var(--acc)!important;border:1px solid var(--acc)!important}
.small{margin:0!important;padding:8px 12px!important;font-size:.9rem!important;white-space:nowrap}
.icon{padding:6px 8px!important;line-height:0!important}
.icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon svg.fill{fill:currentColor;stroke:none}
.danger{color:var(--err)!important;border-color:var(--err)!important}
.soon{opacity:.45}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
#msg{margin:-4px 0 16px;padding:0 4px;font-size:.9rem}#msg:empty{display:none}
.err{color:var(--err)}.ok{color:var(--ok)}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;flex:none}
.logo rect{fill:var(--acc)}.logo circle{fill:none;stroke:var(--on);stroke-width:3;opacity:.5}.logo path{fill:var(--on)}
.tools{display:flex;gap:8px;align-items:center}
.lang{display:flex;border:1px solid var(--acc);border-radius:6px;overflow:hidden}
.lang button{margin:0;padding:6px 10px;border-radius:0;background:transparent;color:var(--acc);font-size:.85rem}
.lang button[aria-pressed="true"]{background:var(--acc);color:var(--on)}
.layout{display:grid;grid-template-columns:minmax(0,640px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.phead h2{margin:0 auto 0 0}
.phead select{width:auto}
.tgl{font-size:1rem!important;line-height:1!important;min-width:32px}
.off>:not(.phead){display:none!important}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.actions button{margin:0}
.pw{display:flex;gap:8px}.pw{align-items:center}.pw>select,.pw>input{flex:1 1 0;width:0;min-width:0}.pw button{flex:none;margin:0;padding:8px 12px;font-size:.9rem;white-space:nowrap}
.lbl{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}.lbl label{margin:10px 0 4px}
.badge{font-size:.8rem}
.hint{font-size:.8rem;color:var(--mute);margin-top:6px}
.hint a,.help{color:var(--acc);font-size:.8rem}
.help{display:block;margin-top:4px}
dialog{width:min(92vw,520px);max-height:90vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin-bottom:4px}
.chart{position:relative;margin-bottom:6px}
.chart svg{display:block;width:100%;height:64px;border-radius:6px;background:var(--bg)}
.chart path{stroke:var(--bg);stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer}
.chart path:hover{opacity:.8}
.chart path.sel{stroke:var(--ink);stroke-width:2}
.chart .cap{font-size:.8rem;color:var(--mute);margin-top:4px}
.z1{fill:#3a9d8f}.z2{fill:#5cb85c}.z3{fill:#e3cf3f}.z4{fill:#f2a33a}.z5{fill:#ee6c4d}.z6{fill:#d6336c}.z7{fill:#8e44ad}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:var(--card);padding:6px 8px;border-radius:6px;font-size:.8rem;line-height:1.35;width:max-content;max-width:260px;white-space:pre-line;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.tip .act{margin-top:6px}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;align-items:flex-start;max-width:min(92vw,560px);padding:12px 14px;border-radius:8px;background:var(--card);color:var(--ink);border:1px solid var(--err);border-left:6px solid var(--err);box-shadow:0 6px 24px rgba(0,0,0,.3);font-size:.9rem}
#toast button{margin:0;padding:0 6px;line-height:1.2;font-size:1.2rem;background:transparent;color:var(--mute)}
#prog{margin:-4px 0 16px}.pt{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mute);margin-bottom:4px}.pb{height:10px;border-radius:999px;background:var(--line);overflow:hidden}.pb i{display:block;height:100%;width:0;border-radius:999px;background:var(--acc);transition:width .3s}
.explain{margin-top:10px;padding:10px 12px;border-radius:6px;background:var(--bg);font-size:.9rem}.explain p{margin:4px 0 6px}
#fsvg{display:block;width:100%;height:150px;border-radius:6px;background:var(--bg);touch-action:none}
#fsvg .fc{fill:#3b82c4;fill-opacity:.35;stroke:#3b82c4;stroke-width:1.2;vector-effect:non-scaling-stroke}
#fsvg .fa{fill:none;stroke:#d6336c;stroke-width:1.2;vector-effect:non-scaling-stroke}
#fsvg .ft{fill:#e3cf3f;fill-opacity:.5;stroke:#c9b52b;stroke-width:1;vector-effect:non-scaling-stroke}
#fsvg .fz{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
#fsvg .fcur{stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke;opacity:0}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--mute);margin-top:6px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;align-items:center;padding:8px;margin-bottom:6px;border-left:5px solid var(--line);border-radius:6px;background:var(--bg)}
.st.warm{border-color:#5cb85c}.st.work{border-color:#ee6c4d}.st.rec{border-color:#3a9d8f}.st.cool{border-color:#4a90d9}
.st select,.st input,.gh input{padding:7px;background:var(--card)}
.ctl{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}.ctl button{margin:0!important}
.fld{position:relative}.fld input{padding-right:58px}.fld span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:.75rem;color:var(--mute);pointer-events:none}
.grp{border:1px dashed var(--acc);border-radius:8px;padding:8px;margin-bottom:8px}.gh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}.gh .fld{width:90px}.gh .ctl{grid-column:auto;margin-left:auto}.grp>.actions{margin-top:6px}
#loadbox,#lastbox{position:relative}
.days{display:flex;gap:3px;align-items:flex-end;height:96px}
.d{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.65rem;color:var(--mute);cursor:default}
.d:hover{background:var(--bg)}
.d .bar{width:100%;border-radius:3px 3px 0 0;background:var(--line)}
.d .bar.h1{background:#5cb85c}.d .bar.h2{background:#f2a33a}.d .bar.h3{background:#d6336c}
.d.now span{color:var(--ink);font-weight:600}
.tbl table{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 12px;font-size:.8rem;color:var(--mute);margin-top:8px}.kv b{display:block;font-size:1rem;color:var(--ink)}
.lt{font-weight:600}
#lsvg{display:block;width:100%;height:110px;border-radius:6px;background:var(--bg);margin-top:8px;touch-action:none}
#lsvg .lp{fill:var(--acc);fill-opacity:.3;stroke:var(--acc);stroke-width:1.2;vector-effect:non-scaling-stroke}
#lsvg .lh{fill:none;stroke:#d6336c;stroke-width:1.2;vector-effect:non-scaling-stroke}
footer{display:flex;justify-content:center;padding:8px 0 24px}
a.coffee{margin:0;display:inline-flex;gap:8px;align-items:center;background:#ffc439;color:#111!important;border-radius:999px;padding:10px 20px;font-weight:600;text-decoration:none}
a.coffee.soon{opacity:.6}
h2.ic{display:flex;align-items:center;gap:8px}
.hic{width:22px;height:22px;flex:none;stroke:var(--acc);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mode{display:flex;gap:4px;padding:4px;margin-bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.mode button{flex:1;margin:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border-radius:7px;background:transparent;color:var(--ink);font-size:.95rem}
.mode button svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mode button[aria-selected="true"]{background:var(--acc);color:var(--on)}
.stp{display:inline-flex;align-items:center;gap:4px}
.stp input{width:64px;padding:7px 4px;text-align:center;-moz-appearance:textfield;appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stp button{margin:0!important;min-width:36px;padding:7px 0!important;font-size:1.1rem!important;line-height:1}
</style>
</head>

<div class="phead"><h2 class="ic"><svg class="hic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span data-i="edT"></span></h2></div>

function toast(m){ $("toastt").textContent = m; $("toast").hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { $("toast").hidden = true; }, 12000); }
function say(k, cls, ...a){
  const txt = k ? t(k, ...a) : "";
  if(cls === "err"){ MSG = null; $("msg").textContent = ""; if(txt) toast(txt); return; }
  MSG = k ? {k, cls, a} : null; $("msg").textContent = txt; $("msg").className = cls || "";
}
$("toastx").onclick = () => { $("toast").hidden = true; };
function progStart(k){
  clearInterval(ptimer); clearTimeout(phide); const t0 = Date.now();
  $("progk").textContent = t(k); $("prog").hidden = false;
  const upd = () => { const sec = (Date.now() - t0) / 1000; $("progf").style.width = (92 * (1 - Math.exp(-sec / 20))).toFixed(1) + "%"; $("progs").textContent = Math.round(sec) + " s"; $("prog").querySelector(".pb").setAttribute("aria-valuenow", parseInt($("progf").style.width)); };
  upd(); ptimer = setInterval(upd, 250);
}
function progEnd(){
  clearInterval(ptimer); if($("prog").hidden) return; $("progf").style.width = "100%";
  phide = setTimeout(() => { $("prog").hidden = true; $("progf").style.width = "0"; }, 500);
}

function ask(k){
  return new Promise(res => {
    const d = $("cfm"); $("cfmt").textContent = t(k);
    const done = v => { if(d.open) d.close(); res(v); };
    $("cfmy").onclick = () => done(true); $("cfmn").onclick = () => done(false);
    d.addEventListener("cancel", () => res(false), {once: true});
    d.showModal();
  });
}

function badges(){
  [["gkey","bg"],["ikey","bi"],["hfkey","bh"],["oakey","bo"]].forEach(([k, b]) => {
    const ok = !!store.get("si_" + k); $(b).textContent = t(ok ? "saved" : "missing"); $(b).className = "badge " + (ok ? "ok" : "err");
  });
}
function fillModels(list, sel){
  const ids = [...new Set([sel, ...list].filter(Boolean))];
  $("model").innerHTML = ""; ids.forEach(id => { const o = document.createElement("option"); o.value = o.textContent = id; $("model").appendChild(o); });
  $("model").value = sel;
}
function loadSettings(){
  FIELDS.forEach(k => { if(k !== "model") $(k).value = store.get("si_" + k) || DEF[k] || ""; });
  fillModels(modelList, store.get("si_model") || DEF.model);
  SECRET.forEach(k => $(k).type = "password");
  document.querySelectorAll(".tog").forEach(b => { b.dataset.i = "show"; b.textContent = t("show"); });
  provUI(); badges();
}
document.querySelectorAll(".tog").forEach(b => b.onclick = () => {
  const i = $(b.dataset.for), show = i.type === "password";
  i.type = show ? "text" : "password"; b.dataset.i = show ? "hide" : "show"; b.textContent = t(b.dataset.i);
});
$("prov").onchange = provUI;
$("open").onclick = () => {
  loadSettings(); $("cfg").showModal();
  const pv = store.get("si_prov");
  if(pv === "hf"){ if(!hfList.length) $("refh").click(); }
  else if(pv === "oa"){ if(store.get("si_oakey") && !oaList.length) $("refo").click(); }
  else if(store.get("si_gkey") && !modelList.length) $("refm").click();
};

async function fetchList(url, key){
  const r = await fetch(url, key ? {headers: {Authorization: "Bearer " + key}} : {});
  const j = await r.json();
  if(!r.ok) throw new Error((j.error && (j.error.message || (typeof j.error === "string" ? j.error : ""))) || ("HTTP " + r.status));
  return j;
}
function listBtn(btn, noteId, run){
  $(btn).onclick = async () => {
    const note = (k, c, ...a) => { $(noteId).textContent = t(k, ...a); $(noteId).className = "badge " + (c || ""); };
    $(btn).disabled = true; note("loading");
    try{ await run(note); }catch(e){ note("err", "err", errText(e)); }
    $(btn).disabled = false;
  };
}
async function geminiModels(key){
  const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000", {headers: {"x-goog-api-key": key}});
  const j = await r.json();
  if(!r.ok) throw new Error(j.error?.message || ("HTTP " + r.status));
  const ver = n => parseFloat((n.match(/^gemini-(\d+(?:\.\d+)?)-/) || [])[1]);
  return (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => m.name.replace("models/", ""))
    .filter(n => /flash/.test(n) && !/image|tts|live|audio|embed|robotics|computer|native/.test(n) && ver(n) >= 3.6)
    .sort((x, y) => ver(y) - ver(x) || x.localeCompare(y));
}
listBtn("refm", "mnote", async note => {
  const key = $("gkey").value.trim();
  if(!key) return note("needG", "err");
  modelList = await geminiModels(key);
  const cur = $("model").value;
  fillModels(modelList, modelList.includes(cur) ? cur : (modelList[0] || cur));

function ds(arr, n){
  if(!arr || !arr.length) return [];
  const w = Math.max(1, Math.floor(arr.length / n)), out = [];
  for(let i = 0; i < arr.length; i += w){
    let s = 0, c = 0;
    for(let j = i; j < Math.min(i + w, arr.length); j++){ const v = arr[j]; if(typeof v === "number" && !isNaN(v)){ s += v; c++; } }
    out.push(c ? s / c : 0);
  }
  return out;
}

// ---------- Graphe de la séance ----------
let selLine = null, EXPL = null;
function parseWorkout(txt, sport, ftp){
  const steps = []; let group = null;
  const flush = () => { if(group){ for(let i = 0; i < group.n; i++) steps.push(...group.items); group = null; } };
  const num = x => parseFloat(String(x).replace(",", "."));
  const dur = str => {
    let tt = 0, m; const re = /(\d+(?:[.,]\d+)?)\s*(h|min|m|s)(?![a-z])/gi;
    while((m = re.exec(str))){ const v = num(m[1]), u = m[2].toLowerCase(); tt += u === "h" ? v * 3600 : u === "s" ? v : v * 60; }
    return tt;
  };
  const dist = str => {
    const m = str.match(/(\d+(?:[.,]\d+)?)\s*(mtr|km|yrd)/i); if(!m) return 0;
    const v = num(m[1]), u = m[2].toLowerCase(); return u === "km" ? v * 1000 : u === "yrd" ? v * 0.9144 : v;
  };
  const inten = str => {
    let m = str.match(/(\d+(?:[.,]\d+)?)(?:\s*-\s*(\d+(?:[.,]\d+)?))?\s*%/);
    if(m){ const a = num(m[1]), b = m[2] ? num(m[2]) : a; return {a, b, idx: m.index, ramp: /ramp/i.test(str)}; }
    m = str.match(/(\d+(?:[.,]\d+)?)\s*w\b/i);
    if(m && ftp > 0){ const v = num(m[1]) / ftp * 100; return {a: v, b: v, idx: m.index, ramp: false}; }
    m = str.match(/\bz([1-7])\b/i);
    if(m){ const v = [50, 65, 82, 97, 112, 135, 160][m[1] - 1]; return {a: v, b: v, idx: m.index, ramp: false}; }
    return null;
  };
  const spm = sport === "Swim" ? 1 : sport === "Run" ? 0.24 : 0.36;
  for(const [li, raw] of txt.split("\n").entries()){
    const line = raw.trim();
    if(!line){ flush(); continue; }
    if(line.startsWith("-")){
      const it = inten(line); if(!it) continue;
      const pre = line.slice(0, it.idx), mid = (it.a + it.b) / 2;
      let d = dur(pre);
      if(!d){ const m = dist(pre); if(m) d = m * spm / Math.max(mid / 100, 0.3); }
      if(!d) continue;
      const step = {d, a: it.ramp ? it.a : mid, b: it.ramp ? it.b : mid, line: li};
      if(group) group.items.push(step); else steps.push(step);
    }else{
      flush();
      const r = line.match(/(\d+)\s*x\s*$/i);
      if(r) group = {n: Math.min(parseInt(r[1], 10), 50), items: []};
    }
  }
  flush();
  return steps;
}
const zoneOf = p => p < 56 ? 1 : p < 76 ? 2 : p < 91 ? 3 : p < 106 ? 4 : p < 121 ? 5 : p < 151 ? 6 : 7;
const toWatts = (desc, ftp) => desc.split("\n").map(l => l.trim().startsWith("-") ? l.replace(/(\d+(?:\.\d+)?)\s*%/, (m, p) => Math.round(p * ftp / 100) + "w") : l).join("\n");

  const box = $("chart"), sport = $("sport").value, ftp = curFtp();
  const steps = parseWorkout($("desc").value, sport, ftp);
  if(!steps.length){ box.innerHTML = ""; box._steps = []; $("explain").hidden = true; return; }
  const total = steps.reduce((s, x) => s + x.d, 0), peak = Math.max(120, ...steps.map(s => Math.max(s.a, s.b)));
  const W = 300, H = 100, meta = [];
  let x = 0, path = "", wsum = 0, t0 = 0;
  for(const s of steps){
    const w = s.d / total * W, ya = H - s.a / peak * (H - 4), yb = H - s.b / peak * (H - 4);
    path += `<path data-n="${meta.length}" class="z${zoneOf((s.a + s.b) / 2)}${s.line === selLine ? " sel" : ""}" d="M${x.toFixed(2)} ${H}L${x.toFixed(2)} ${ya.toFixed(1)}L${(x + w).toFixed(2)} ${yb.toFixed(1)}L${(x + w).toFixed(2)} ${H}Z"/>`;
    meta.push({d: s.d, a: s.a, b: s.b, start: t0, line: s.line}); t0 += s.d; x += w; wsum += s.d * (s.a + s.b) / 2;
  }
  const avg = Math.round(wsum / total), pace = sport === "Run" || sport === "Swim", mins = Math.round(total / 60);
  const dtxt = mins >= 60 ? Math.floor(mins / 60) + "h" + pad(mins % 60) : mins + " min";
  const cap = dtxt + t("capAvg") + avg + (pace ? t("pctPace") : t("pctFtp")) + (!pace && ftp > 0 ? " (" + Math.round(avg * ftp / 100) + " W)" : "");
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(cap)}">${path}</svg><div class="cap">${esc(cap)}</div><div class="tip" hidden></div>`;
  box._steps = meta; renderExplain(steps);
}
function tipText(s, ftp, pace){

// ---------- Génération ----------
const SYSTEM = `You are an expert coach. You create ONE structured workout.
Reply only with JSON containing "name" (short title), "description" (the workout text in intervals.icu workout format), and "explanation_en" and "explanation_fr" (2-3 sentences each, in English and in French: purpose of the session, physiological benefits, and where it fits in a training week).
Format of "description":
- One section per block: a title line (e.g. "Warmup", "Main set 3x", "Cooldown") followed by lines starting with "- ". Leave a blank line between sections.
- Durations: 10m, 30s, 1h. Cycling intensity: % of FTP, a single value per line (e.g. "- 10m 55%").
- FORBIDDEN: no ramps ("ramp") and no intensity ranges (no "50-75%" and no "90-95%"), because the Tacx trainer does not support them. For a gradual rise or fall (warm-up, cool-down, progression) use several short steps at constant intensity, increasing or decreasing (e.g. "- 3m 50%", "- 3m 60%", "- 4m 70%").
- Running: intensity in % of threshold pace (e.g. "- 5m 80% Pace") or a zone ("Z2 Pace").
- Swimming: distances in meters with "mtr" (e.g. "- 100mtr 85% Pace"), intensity in % of threshold pace, rest as "- 20s 40% Pace"; put drill or technique cues as free text after the values.
- Repetitions: "Main set 4x" then the lines of the block.
- Free-text cues may follow the values (e.g. "- 10m 95% cadence 90rpm").
No markdown, no text outside the JSON.`;
async function generate(ctx){
  const prov = $("prov").value, chat = prov !== "gemini", sport = $("sport").value;
  let url = "", key, model;
  const bad = k => { progEnd(); say(k, "err"); };
  if(prov === "hf"){ url = "https://router.huggingface.co/v1/chat/completions"; key = $("hfkey").value.trim(); model = $("hfmodel").value.trim(); }
  else if(prov === "oa"){ url = $("oaurl").value.trim().replace(/\/+$/, "") + "/chat/completions"; key = $("oakey").value.trim(); model = $("oamodel").value.trim(); }
  else{ key = $("gkey").value.trim(); model = $("model").value.trim() || DEF.model; }
  const ask1 = $("prompt").value.trim(), bike = isBike(sport), ftp = bike ? curFtp() : 0;
  if(prov === "oa" && !$("oaurl").value.trim()) return bad("needUrl");
  if(!key) return bad(prov === "hf" ? "needH" : prov === "oa" ? "needA" : "needG");
  if(!model) return bad("needM");
  if(!ask1) return bad("needAsk");
  const durTxt = $("dur").value ? `Total duration: about ${$("dur").value} minutes (warm-up and cool-down included).\n` : "";
  const ftpTxt = ftp > 0 ? `Athlete FTP (${$("ftpsel").value === "in" ? "indoor" : "outdoor"}): ${ftp} W (intensities stay expressed in % of FTP).\n` : "";
  const userText = `Sport: ${sport}. Date: ${$("date").value}.\n${durTxt}${ftpTxt}${typeof ctx === "string" ? ctx + "\n" : ""}Request: ${ask1}\nReply (name and instructions) in ${lang === "fr" ? "French" : "English"}.` + (chat ? `\nReply only with a JSON object {"name": "...", "description": "...", "explanation_en": "...", "explanation_fr": "..."} and no text around it.` : "");
  $("gen").disabled = true; $("rand").disabled = true;
  const t0 = Date.now();
  say(null); progStart("genning");
  const timed = async (ms, fn) => { const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), ms); try{ return await fn(ctl.signal); }finally{ clearTimeout(to); } };
  const parse = txt => {
    const m = txt.replace(/<think>[\s\S]*?<\/think>/g, "").match(/\{[\s\S]*\}/);
    const w = JSON.parse((m ? m[0] : txt).replace(/```json|```/g, "").trim());
    if(!w.name || !w.description) throw new Error(t("badResp"));
    return w;
  };
  const callGemini = (mdl, ms) => timed(ms, async signal => {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(mdl)}:generateContent`, {method: "POST", signal,
      headers: {"Content-Type": "application/json", "x-goog-api-key": key},
      body: JSON.stringify({systemInstruction: {parts: [{text: SYSTEM}]}, contents: [{role: "user", parts: [{text: userText}]}],
        generationConfig: {...(/^gemini-3/.test(mdl) && $("think").value !== "default" ? {thinkingConfig: {thinkingLevel: $("think").value}} : {}),
          responseMimeType: "application/json", responseSchema: {type: "OBJECT", properties: {name: {type: "STRING"}, description: {type: "STRING"}, explanation_en: {type: "STRING"}, explanation_fr: {type: "STRING"}}, required: ["name", "description"]}}})});
    const j = await r.json().catch(() => ({}));
    if(!r.ok){ const err = new Error(j.error?.message || ("HTTP " + r.status)); err.fatal = r.status === 401 || /api key/i.test(err.message); throw err; }
    const txt = j.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("") || "";
    return {w: parse(txt), usage: j.usageMetadata ? t("thoughts", j.usageMetadata.thoughtsTokenCount || 0) : ""};
  });
  try{
    let w, usage = "";
    if(chat){
      const txt = await timed(120000, async signal => {
        const r = await fetch(url, {method: "POST", signal, headers: {"Content-Type": "application/json", Authorization: "Bearer " + key},
          body: JSON.stringify({model, max_tokens: 3000, messages: [{role: "system", content: SYSTEM}, {role: "user", content: userText}]})});
        const j = await r.json().catch(() => ({}));
        if(!r.ok) throw new Error((j.error && (j.error.message || (typeof j.error === "string" ? j.error : ""))) || ("HTTP " + r.status));
        return (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "";
      });
      w = parse(txt);
    }else{
      // modèle sélectionné d'abord ; en cas d'erreur, on essaie les autres modèles flash disponibles
      const errs = []; let cands = [model];
      for(let n = 0; n < cands.length; n++){
        try{
          const r = await callGemini(cands[n], n ? 60000 : 120000);
          w = r.w; usage = r.usage; if(n) usage += t("usedModel", cands[n]);
          break;
        }catch(e){
          errs.push(e); if(e.fatal) break;
          if(n === 0){
            if(!modelList.length){ try{ modelList = await geminiModels(key); }catch(_){} }
            cands = [model, ...modelList.filter(x => x !== model)];
          }
          if(n + 1 < cands.length) $("progk").textContent = t("tryNext", cands[n], cands[n + 1]);
        }
      }
      if(!w) throw new Error(errText(errs[0]) + (errs.length > 1 ? t("alsoFailed", errs.length - 1) : ""));
    }
    $("name").value = w.name;
    $("desc").value = $("unit").value === "w" && bike && ftp > 0 ? toWatts(w.description, ftp) : w.description;
    EXPL = {en: w.explanation_en || "", fr: w.explanation_fr || ""}; selLine = null; renderChart();
    $("prev").hidden = false; say("genDone", "ok", Math.round((Date.now() - t0) / 1000), usage);
  }catch(e){
    say(prov === "hf" ? "errH" : prov === "oa" ? "errA" : "errG", "err", errText(e));
  }
  progEnd();
  $("gen").disabled = false; $("rand").disabled = false;
}
$("gen").onclick = () => generate();

async function smartRandom(){
  if(!KEY()) return classicRandom();
  $("rand").disabled = true; progStart("analyzing");
  try{
    const rng = `oldest=${daysAgo(27)}&newest=${daysAgo(0)}`;
    const [acts, well] = await Promise.all([icu(`/activities?${rng}`), icu(`/wellness?oldest=${daysAgo(3)}&newest=${daysAgo(0)}`).catch(() => [])]);
    acts.sort((x, y) => (x.start_date_local || "") < (y.start_date_local || "") ? -1 : 1);
    const w = well[well.length - 1], ctl = w && w.ctl != null ? w.ctl : 0, tsb = w && w.ctl != null ? w.ctl - w.atl : 0;
    const lines = acts.slice(-14).map(a => `- ${(a.start_date_local || "").slice(0, 10)} ${a.type} "${a.name}" ${hm(a.moving_time || 0)}, load ${Math.round(a.icu_training_load || 0)}` + (a.icu_weighted_avg_watts ? `, NP ${Math.round(a.icu_weighted_avg_watts)} W` : "")).join("\n");
    const fit = w && w.ctl != null ? `Current form: CTL ${Math.round(w.ctl)}, ATL ${Math.round(w.atl)}, TSB ${Math.round(w.ctl - w.atl)}.` : "";
    const yest = acts.filter(a => (a.start_date_local || "").slice(0, 10) === daysAgo(1));
    const yLoad = yest.reduce((s, a) => s + (a.icu_training_load || 0), 0);
    const yIF = Math.max(0, ...yest.map(a => a.icu_intensity ? (a.icu_intensity > 5 ? a.icu_intensity / 100 : a.icu_intensity) : 0));
    const yTime = yest.reduce((s, a) => s + (a.moving_time || 0), 0), hard = yest.length && (yLoad >= 90 || yIF >= 0.85 || (ctl && yLoad > ctl * 1.2) || yTime >= 7200), mod = yest.length && !hard && (yLoad >= 60 || yTime >= 5400);
    let rule = "Yesterday: no recorded workout (rest day).";
    if(yest.length) rule = `Yesterday: ${yest.map(a => `"${a.name}" ${hm(a.moving_time || 0)}`).join(", ")}, total load ${Math.round(yLoad)}, max IF ${yIF.toFixed(2)} => ${hard ? "HARD session" : mod ? "moderately hard session" : "easy session"}.`;
    if(hard) rule += "\nMANDATORY: yesterday was hard, so today MUST be an easy day: active recovery or very easy endurance only, Z1-Z2 (at most 65% intensity), no intervals, no tempo, at most 60 minutes (this overrides any longer requested duration).";
    else if(mod) rule += "\nYesterday was fairly demanding: no hard intervals today, prefer endurance or light tempo.";
    if(!hard && tsb < -25) rule += "\nMANDATORY: accumulated fatigue is high (form " + Math.round(tsb) + "), so today MUST be an easy day: Z1-Z2 only, no intervals.";
    const ctx = `intervals.icu context (last 28 days):\n${lines || "- no workout"}\n${fit}\n${rule}\nPropose today's workout in the spirit of these recent workouts and adapted to my current load, with some variety.`;
    $("date").value = iso(new Date());
    $("prompt").value = t("randPrompt");
    $("rand").disabled = false;
    generate(ctx);
  }catch(e){
    progEnd(); $("rand").disabled = false; say("randFallback", "err", errText(e)); classicRandom();
  }
}

// ---------- Explication de la séance ----------
function renderExplain(steps){
  const el = $("explain"), tot = steps.reduce((x, y) => x + y.d, 0) || 1, z = {e: 0, t: 0, h: 0, v: 0};
  steps.forEach(p => { const m = (p.a + p.b) / 2; z[m < 76 ? "e" : m < 91 ? "t" : m < 106 ? "h" : "v"] += p.d; });
  const k = z.v / tot > .08 ? "exV" : z.h / tot > .12 ? "exH" : z.t / tot > .15 ? "exT" : "exE", pc = x => Math.round(x / tot * 100);
  el.innerHTML = `<b>${esc(t("exTitle"))}</b><p>${esc((EXPL && EXPL[lang]) || t(k))}</p><div class="hint">${esc(t("exMix", pc(z.e), pc(z.t), pc(z.h + z.v)))}</div>`;
  el.hidden = false;
}

  $("edftp").disabled = $("edunit").disabled = !edKm();
  $("edhint").textContent = t(edW() ? "edHintW" : edKm() ? "edHintP" : "edHintPace");
  $("edbox").innerHTML = ED.length ? ED.map((x, i) => x.k === "g" ? edGrp(x, i) : edStep(x, String(i))).join("") : `<div class="hint">${esc(t("edNone"))}</div>`;
  edSum();
}
$("edbox").addEventListener("input", e => {
  const el = e.target, h = el.closest("[data-p]"); if(!h || !el.dataset.f) return;
  const {list, i} = edAt(h.dataset.p); list[i][el.dataset.f] = el.value;
  if(el.dataset.f === "ty" || el.dataset.f === "mode") edRender(); else edSum();
});
$("edbox").addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if(!b) return; const a = b.dataset.a;
  const gp = (a === "rm" || a === "rp") ? b.closest("[data-p]").dataset.p : null;
  if(a === "addin") ED[+b.dataset.g].items.push(edDef(b.dataset.ty));
  else{
    const {list, i} = edAt(b.closest("[data-p]").dataset.p);
    if(a === "rm" || a === "rp") list[i].r = Math.min(50, Math.max(1, (parseInt(list[i].r, 10) || 1) + (a === "rp" ? 1 : -1)));
    else if(a === "del") list.splice(i, 1);
    else if(a === "dup") list.splice(i + 1, 0, JSON.parse(JSON.stringify(list[i])));
    else if(a === "rec") list.splice(i + 1, 0, edDef("rec"));
    else if(a === "up" && i > 0){ const o = list[i - 1]; list[i - 1] = list[i]; list[i] = o; }
    else if(a === "down" && i < list.length - 1){ const o = list[i + 1]; list[i + 1] = list[i]; list[i] = o; }
  }
  edRender();
  if(gp !== null){ const nb = $("edbox").querySelector(`[data-p="${gp}"] [data-a="${a}"]`); if(nb) nb.focus(); }
});
document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { const ty = b.dataset.add; ED.push(ty === "grp" ? {k: "g", r: 4, items: [edDef("work"), edDef("rec")]} : edDef(ty)); edRender(); });
$("edsport").onchange = edRender; $("unit").addEventListener("change", edRender);
$("edgo").onclick = () => {
  const txt = edText(); if(!txt) return say("edNone", "err");
  $("sport").value = edSp(); syncUnit(); $("name").value = $("edname").value.trim() || t("edDefName"); $("desc").value = txt;
  EXPL = null; selLine = null; $("prev").hidden = false; renderChart(); $("prev").scrollIntoView({behavior: "smooth", block: "start"}); say("edBuilt", "ok");
};
$("edsport").value = $("sport").value;
[["ftpsel", "edftp"], ["unit", "edunit"]].forEach(([a, b]) => {
  $(b).onchange = () => { $(a).value = $(b).value; $(a).dispatchEvent(new Event("change")); };
  $(a).addEventListener("change", () => { $(b).value = $(a).value; });
});

// ---------- Bascule IA / éditeur manuel ----------
let mode = store.get("si_mode") === "edit" ? "edit" : "ai";
function applyMode(){
  document.querySelector('[data-block="req"]').hidden = mode !== "ai";
  document.querySelector('[data-block="edit"]').hidden = mode !== "edit";
  document.querySelectorAll(".mode button").forEach(b => { const on = b.dataset.m === mode; b.setAttribute("aria-selected", String(on)); b.tabIndex = on ? 0 : -1; });
}
document.querySelectorAll(".mode button").forEach(b => {
  b.onclick = () => { mode = b.dataset.m; store.set("si_mode", mode); applyMode(); };
  b.onkeydown = e => { if(e.key === "ArrowLeft" || e.key === "ArrowRight"){ mode = mode === "ai" ? "edit" : "ai"; store.set("si_mode", mode); applyMode(); document.querySelector(`.mode [data-m="${mode}"]`).focus(); } };
});

// ---------- Blocs repliables, liens, langue, démarrage ----------
let off = []; try{ const so = store.get("si_off"); if(so) off = JSON.parse(so).filter(k => k !== "req" && k !== "edit"); }catch(e){}
function applyBlocks(){
  document.querySelectorAll("[data-block]").forEach(sec => {
    const closed = off.includes(sec.dataset.block); sec.classList.toggle("off", closed);
    const b = sec.querySelector(".tgl"); if(b){ b.textContent = closed ? "▸" : "▾"; b.setAttribute("aria-expanded", String(!closed)); }
  });
}
document.querySelectorAll('[data-block]:not([data-block="req"]):not([data-block="edit"]) > .phead').forEach(h => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "alt small icon tgl"; b.dataset.ia = "title:collapse;aria-label:collapse";
  b.onclick = () => { const k = h.parentNode.dataset.block; off = off.includes(k) ? off.filter(x => x !== k) : [...off, k]; store.set("si_off", JSON.stringify(off)); applyBlocks(); };
  h.appendChild(b);
});
function setLinks(){
  $("mail").href = LINKS.mail;
  [["gh", LINKS.github], ["coffee", LINKS.coffee], ["coffeeTop", LINKS.coffee]].forEach(([id, url]) => {
    const a = $(id);
    if(url){ a.href = url; a.target = "_blank"; a.rel = "noopener"; a.classList.remove("soon"); }
    else{ a.removeAttribute("href"); a.classList.add("soon"); a.title = t("soon"); }
  });
}
function applyLang(){
  document.documentElement.lang = lang; document.title = t("docTitle");
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t(el.dataset.i); });
  document.querySelectorAll("[data-ia]").forEach(el => el.dataset.ia.split(";").forEach(p => { const [a, k] = p.split(":"); el.setAttribute(a, t(k)); }));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
  setLinks(); fillFtp(); profText(); badges(); renderHist(); renderChart(); renderBest(); renderLoad(); renderLast(); renderFit(); edRender();
  if(MSG) say(MSG.k, MSG.cls, ...MSG.a);
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.l; store.set("si_lang", lang); applyLang(); });
$("date").value = iso(new Date());
applyBlocks(); applyMode(); loadSettings(); applyLang(); syncUnit(); $("edsport").value = $("sport").value; edRender();
$("ftpsel").value = store.get("si_ftpsel") || "in"; $("bkind").value = store.get("si_bkind") || "VirtualRide";
$("fper").value = store.get("si_fper") || "60"; $("edftp").value = $("ftpsel").value; $("edunit").value = $("unit").value;
if(!store.get("si_gkey") && !store.get("si_hfkey") && !store.get("si_oakey") || !KEY()) $("cfg").showModal();
loadAll();
</script>
