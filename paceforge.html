<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaceForge — Forge your next workout</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%23ffb000'/%3E%3Cstop offset='1' stop-color='%23ff3d00'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='%23141b24'/%3E%3Cpath d='M34 5C38 18 23 21 29 34c-5-3-8-8-8-13C9 34 13 49 25 56c-1-9 7-12 9-19 8 8 8 14 4 20 13-4 19-17 12-29-1 8-5 10-7 11C45 25 45 16 34 5Z' fill='url(%23g)'/%3E%3Cpath d='M35 24 24 40h9l-3 12 13-19h-9z' fill='%23fff4d6'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#1b2733;--mute:#5d6b78;--line:#cfd7de;--acc:#0f6e6e;--err:#b3261e;--ok:#1d7a3a;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#12181e;--card:#1a232b;--ink:#e6ebef;--mute:#98a6b3;--line:#2d3944;--acc:#4fc3c3;--err:#ff8a80;--ok:#7bd88f;--on:#08201f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:1240px;margin:0 auto;padding:20px 16px 24px}
h1{font-size:1.65rem;margin:0;font-weight:600;letter-spacing:-0.02em}
p.sub{color:var(--mute);margin:6px 0 20px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
#prev{position:sticky;top:8px;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.18);max-height:calc(100vh - 24px);overflow:auto}
h2{font-size:1rem;margin:0 0 12px}
h3.blk{font-size:1rem;margin:20px 0 0}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:90px;resize:vertical}
#desc{font-family:"IBM Plex Mono",monospace;font-size:.85rem;min-height:240px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button,a.alt{display:inline-block;margin-top:14px;padding:11px 16px;border:0;border-radius:6px;background:var(--acc);color:var(--on);font-family:inherit;font-weight:600;font-size:1rem;cursor:pointer;text-decoration:none}
button:disabled{opacity:.5;cursor:default}
.alt{background:transparent!important;color:var(--acc)!important;border:1px solid var(--acc)!important}
.small{margin:0!important;padding:8px 12px!important;font-size:.9rem!important;white-space:nowrap}
.icon{padding:6px 8px!important;line-height:0!important}
.icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon svg.fill{fill:currentColor;stroke:none}
.danger{color:var(--err)!important;border-color:var(--err)!important}
.soon{opacity:.45}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
#msg{margin:-4px 0 16px;padding:0 4px;font-size:.9rem}#msg:empty{display:none}
.err{color:var(--err)}.ok{color:var(--ok)}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;flex:none}
.logo rect{fill:var(--acc)}
.tools{display:flex;gap:8px;align-items:center}
.lang{display:flex;border:1px solid var(--acc);border-radius:6px;overflow:hidden}
.lang button{margin:0;padding:6px 10px;border-radius:0;background:transparent;color:var(--acc);font-size:.85rem}
.lang button[aria-pressed="true"]{background:var(--acc);color:var(--on)}
.layout{display:grid;grid-template-columns:minmax(0,760px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.phead h2{margin:0 auto 0 0}
.phead select{width:auto}
.tgl{font-size:1rem!important;line-height:1!important;min-width:32px}
.off>:not(.phead){display:none!important}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.actions button{margin:0}
.pw{display:flex;gap:8px}.pw{align-items:center}.pw>select,.pw>input{flex:1 1 0;width:0;min-width:0}.pw button{flex:none;margin:0;padding:8px 12px;font-size:.9rem;white-space:nowrap}
.lbl{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}.lbl label{margin:10px 0 4px}
.badge{font-size:.8rem}
.hint{font-size:.8rem;color:var(--mute);margin-top:6px}
.hint a,.help{color:var(--acc);font-size:.8rem}
.help{display:block;margin-top:4px}
dialog{width:min(92vw,560px);max-height:90vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin-bottom:6px}
.chart{position:relative;margin-bottom:6px}
.chart svg{display:block;width:100%;height:64px;border-radius:6px;background:var(--bg)}
.chart path{stroke:var(--bg);stroke-width:1;vector-effect:non-scaling-stroke;cursor:grab}
.chart path:active{cursor:grabbing}
.chart path:hover{opacity:.8}
.chart path.sel{stroke:var(--ink);stroke-width:2}
.chart .cap{font-size:.8rem;color:var(--mute);margin-top:4px}
.z1{fill:#3a9d8f}.z2{fill:#5cb85c}.z3{fill:#e3cf3f}.z4{fill:#f2a33a}.z5{fill:#ee6c4d}.z6{fill:#d6336c}.z7{fill:#8e44ad}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:var(--card);padding:6px 8px;border-radius:6px;font-size:.8rem;line-height:1.35;width:max-content;max-width:260px;white-space:pre-line;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.tip .act{margin-top:6px}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;align-items:flex-start;max-width:min(92vw,560px);padding:12px 14px;border-radius:8px;background:var(--card);color:var(--ink);border:1px solid var(--err);border-left:6px solid var(--err);box-shadow:0 6px 24px rgba(0,0,0,.3);font-size:.9rem}
#toast button{margin:0;padding:0 6px;line-height:1.2;font-size:1.2rem;background:transparent;color:var(--mute)}
#toastAct{font-family:inherit;font-size:.9rem;color:var(--acc)!important;text-decoration:underline}
/* sections encadrées des réglages */
.cfg-sec{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.cfg-sec>h3{margin:-12px -14px 10px;padding:9px 14px;font-size:.9rem;font-weight:600;color:var(--on);background:var(--acc);border-radius:10px 10px 0 0;display:flex;align-items:center;gap:8px}
.cfg-sec>h3 .badge{margin-left:auto;color:var(--on)!important;font-weight:400}
.cfg-sec>h3 svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cfg-tabs{margin-bottom:10px}
#cfg [data-cfgp]{min-height:var(--cfgH,0);box-sizing:border-box}
.cfg-tabs button span{font-size:.85rem}
#toast.ok{border-color:var(--ok);border-left-color:var(--ok)}
#toast.info{border-color:var(--acc);border-left-color:var(--acc)}
#expDlg [data-exp]:hover,#expDlg [data-exp]:focus-visible{background:var(--acc)!important;color:var(--on)!important;border-color:var(--acc)!important}
#prog{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:999;width:min(92vw,460px);padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);box-shadow:0 6px 24px rgba(0,0,0,.25);margin:0}.pt{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--mute);margin-bottom:4px}.pb{height:10px;border-radius:999px;background:var(--line);overflow:hidden}.pb i{display:block;height:100%;width:0;border-radius:999px;background:var(--acc);transition:width .3s}
.explain{margin-top:10px;padding:10px 12px;border-radius:6px;background:var(--bg);font-size:.9rem}.explain p{margin:4px 0 6px}
#fsvg{display:block;width:100%;height:150px;border-radius:6px;background:var(--bg);touch-action:none}
#fsvg .fc{fill:#3b82c4;fill-opacity:.35;stroke:#3b82c4;stroke-width:1.2;vector-effect:non-scaling-stroke}
#fsvg .fa{fill:none;stroke:#d6336c;stroke-width:1.2;vector-effect:non-scaling-stroke}
#fsvg .ft{fill:#e3cf3f;fill-opacity:.5;stroke:#c9b52b;stroke-width:1;vector-effect:non-scaling-stroke}
#fsvg .fz{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
#fsvg .fcur{stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke;opacity:0}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--mute);margin-top:6px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;align-items:center;padding:8px;margin-bottom:6px;border-left:5px solid var(--line);border-radius:6px;background:var(--bg)}
.st.warm{border-color:#5cb85c}.st.work{border-color:#ee6c4d}.st.rec{border-color:#3a9d8f}.st.cool{border-color:#4a90d9}
.st select,.st input,.gh input{padding:7px;background:var(--card)}
.ctl{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}.ctl button{margin:0!important}
.drg{cursor:grab;color:var(--mute);user-select:none;font-size:1.05rem;line-height:1;padding:0 3px}
.st.dropover,.gh.dropover{outline:2px dashed var(--acc);outline-offset:-2px}
.fld{position:relative}.fld input{padding-right:58px}.fld span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:.75rem;color:var(--mute);pointer-events:none}
.grp{border:1px dashed var(--acc);border-radius:8px;padding:8px;margin-bottom:8px}.gh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}.gh .fld{width:90px}.gh .ctl{grid-column:auto;margin-left:auto}.grp>.actions{margin-top:6px}
/* blocs de l'éditeur manuel : étapes consécutives de même type regroupées */
.blk{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:8px;margin-bottom:10px;background:var(--bg)}
.blk .st{margin-bottom:6px;background:var(--card)}
.blk .st:last-child{margin-bottom:0}
.blk-h{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600;color:var(--mute);margin:0 0 8px;padding-left:2px}
.blk-h .badge{margin-left:auto;font-weight:400}
.blk-warm{border-left-color:#5cb85c}.blk-work{border-left-color:#ee6c4d}.blk-rec{border-left-color:#3a9d8f}.blk-cool{border-left-color:#4a90d9}
.blk.closed .st{display:none}
.blk.closed{padding:6px 8px}
.blk-h .tglb{margin:0!important;padding:3px 10px!important;font-size:.85rem!important;line-height:1.2!important}
#loadbox,#lastbox{position:relative}
.days{display:flex;gap:3px;align-items:flex-end;height:96px}
.d{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.65rem;color:var(--mute);cursor:default}
.d:hover{background:var(--bg)}
.d .bar{width:100%;border-radius:3px 3px 0 0;background:var(--line)}
.d .bar.h1{background:#5cb85c}.d .bar.h2{background:#f2a33a}.d .bar.h3{background:#d6336c}
.d.now span{color:var(--ink);font-weight:600}
.tbl table{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 12px;font-size:.8rem;color:var(--mute);margin-top:8px}.kv b{display:block;font-size:1rem;color:var(--ink)}
.lt{font-weight:600}
#lsvg{display:block;width:100%;height:110px;border-radius:6px;background:var(--bg);margin-top:8px;touch-action:none}
#lsvg .lp{fill:var(--acc);fill-opacity:.3;stroke:var(--acc);stroke-width:1.2;vector-effect:non-scaling-stroke}
#lsvg .lh{fill:none;stroke:#d6336c;stroke-width:1.2;vector-effect:non-scaling-stroke}
footer{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0 32px;color:var(--mute);font-size:.9rem}
footer a{color:var(--acc);text-decoration:none}
footer a:hover{text-decoration:underline}
a.coffee{margin:0;display:inline-flex;gap:8px;align-items:center;background:#ffc439;color:#111!important;border-radius:999px;padding:10px 20px;font-weight:600;text-decoration:none}
a.coffee.soon{opacity:.6}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:6px}
.wgrid label{display:flex;align-items:center;gap:8px;margin:0;font-size:.9rem;color:var(--ink);cursor:pointer}
.wgrid input{width:auto;padding:0;margin:0}
.act-row{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;margin:0 0 4px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer;font:inherit;font-size:.85rem;color:var(--ink);white-space:nowrap}
.act-row:hover{border-color:var(--acc)}
.act-row:disabled{opacity:.5;cursor:default}
.act-row b{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.act-row .hint{flex:1;min-width:0;margin:0;overflow:hidden;text-overflow:ellipsis;text-align:right}
#actbox{max-height:430px;overflow:auto}
h2.ic{display:flex;align-items:center;gap:8px}
.hic{width:22px;height:22px;flex:none;stroke:var(--acc);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mode{display:flex;gap:4px;padding:4px;margin-bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.mode button{flex:1;min-width:0;margin:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 8px;border-radius:7px;background:transparent;color:var(--ink);font-size:.9rem;white-space:nowrap}
.mode button span{overflow:hidden;text-overflow:ellipsis}
.mode button svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:560px){.mode button{gap:0;padding:9px 4px}.mode button span{display:none}}
.mode button[aria-selected="true"]{background:var(--acc);color:var(--on)}
.stp{display:inline-flex;align-items:center;gap:4px}
.stp input{width:64px;padding:7px 4px;text-align:center;-moz-appearance:textfield;appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stp button{margin:0!important;min-width:36px;padding:7px 0!important;font-size:1.1rem!important;line-height:1}
.lib-card{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px;background:var(--bg)}
.lib-card h3{margin:0 0 4px;font-size:1rem}
.lib-card p{margin:0 0 10px;font-size:.85rem;color:var(--mute)}
.lib-preview{display:block;width:100%;height:42px;margin:8px 0 10px;border-radius:6px;background:var(--card);overflow:hidden}
.lib-preview svg{display:block;width:100%;height:100%}
.lib-stats{margin:0 0 8px;font-size:.8rem;color:var(--mute)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:.75rem}
.cal-h{text-align:center;color:var(--mute);padding:2px 0;font-size:.7rem}
.cal-d{min-height:54px;border:1px solid var(--line);border-radius:5px;padding:2px;background:var(--bg);display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal-d.empty{border:0;background:transparent;min-height:0}
.cal-d.today{border-color:var(--acc)}
.cal-d.over{outline:2px dashed var(--acc);outline-offset:-2px}
.cal-n{color:var(--mute);font-size:.7rem;padding-left:3px}
.cal-d.today .cal-n{color:var(--ink);font-weight:600}
.cal-ev{display:flex;align-items:center;gap:2px;background:var(--acc);color:var(--on);border-radius:4px;padding:1px 3px;cursor:grab;min-width:0}
.cal-ev.run{background:#8e44ad}
.cal-ev.done{background:#4a90d9;opacity:.78;cursor:default}
.cal-ev.done.run{background:#8e44ad}
.cal-ev.done .cal-x{display:none}
.cal-ev-t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.cal-x{margin:0;padding:0 3px;line-height:1.1;background:transparent;color:var(--on);font-size:.85rem;border:0;cursor:pointer;opacity:.55;flex:none}
.cal-x:hover{opacity:1}
.phead .ext{margin:0;padding:5px 7px!important;flex:none}
.phead .ext svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dcalbox .cal-d:not(.empty){cursor:pointer}
#calbox,#dcalbox{position:relative}
.tip .cal-prev{display:block;width:210px;height:46px;margin:6px 0 2px;border-radius:4px;background:var(--bg)}
.tip .cal-prev svg{display:block;width:100%;height:100%}
.tip b{display:block;margin-bottom:2px}
.cal-d.sel{outline:2px solid var(--acc);outline-offset:-2px}
#aiBody{line-height:1.6}
#aiBody p{margin:8px 0}
#aiBody ul,#aiBody ol{margin:8px 0;padding-left:22px}
#aiBody li{margin:4px 0}
#aiBody h3{margin:14px 0 4px;font-size:1rem}
.lib-theme{border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden;background:var(--card)}
.lib-theme>summary{display:flex;align-items:center;gap:10px;list-style:none;cursor:pointer;padding:13px 14px;font-weight:600;background:var(--bg);user-select:none}
.lib-theme>summary::-webkit-details-marker{display:none}
.lib-theme>summary:before{content:"＋";display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--acc);color:var(--on);font-size:16px;line-height:1}
.lib-theme[open]>summary:before{content:"−"}
.lib-theme .theme-count{margin-left:auto;color:var(--mute);font-size:.8rem;font-weight:400}
.lib-theme-body{padding:12px}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.lib-grid .lib-card{margin:0;min-width:0}
.lib-theme .theme-icon{font-size:1.15rem}
</style>
</head>

helpContent:[
  `<h3>1. How it works</h3><p>PaceForge allows you to build structured training workouts either by prompting an AI assistant, writing them manually, or picking from a built-in library. Once generated or selected, you can review the workout graph and send it directly to your <b>intervals.icu</b> calendar with one click. You can also reorder the workout by <b>dragging the blocks in the preview chart</b>, or the ⠿ handles in the manual editor — the description updates automatically.</p><h3>2. Getting your intervals.icu API key</h3><p>To send workouts to your calendar and fetch your fitness data/FTP, you need your intervals.icu API key:<br>• Go to <a href="https://intervals.icu/settings" target="_blank">intervals.icu/settings</a>.<br>• Scroll down to the <b>Developer Settings</b> section.<br>• Copy your API key and paste it into the PaceForge settings.</p><h3>3. Getting an AI Provider Key</h3><p>• <b>Gemini (Recommended):</b> Free and fast. Get a key from <a href="https://aistudio.google.com/apikey" target="_blank">Google AI Studio</a>.<br>• <b>Hugging Face:</b> Free tier available. Generate a token in your <a href="https://huggingface.co/settings/tokens" target="_blank">HF Settings</a>.<br>• <b>OpenAI-compatible:</b> Use free tiers from <a href="https://console.groq.com/keys" target="_blank">Groq</a>, <a href="https://openrouter.ai/keys" target="_blank">OpenRouter</a>, or Mistral.</p>`,
  `<h3>1. Comment ça fonctionne</h3><p>PaceForge vous permet de concevoir des séances structurées soit en décrivant votre envie à une IA, soit via l'éditeur manuel, soit en piochant dans la bibliothèque. Une fois prête, vérifiez le graphique et envoyez la séance directement dans votre calendrier <b>intervals.icu</b>. Vous pouvez aussi réordonner la séance en <b>glissant les blocs du graphique d'aperçu</b>, ou les poignées ⠿ de l'éditeur manuel — la description se met à jour automatiquement.</p><h3>2. Obtenir sa clé API intervals.icu</h3><p>Indispensable pour envoyer les séances et récupérer votre FTP et vos charges :<br>• Rendez-vous sur <a href="https://intervals.icu/settings" target="_blank">intervals.icu/settings</a>.<br>• Descendez jusqu'à la section <b>Developer Settings</b> (Paramètres développeur).<br>• Copiez votre clé API et collez-la dans les réglages de PaceForge.</p><h3>3. Obtenir une clé de Fournisseur d'IA</h3><p>• <b>Gemini (Recommandé) :</b> Gratuit et rapide. Obtenez une clé sur <a href="https://aistudio.google.com/apikey" target="_blank">Google AI Studio</a>.<br>• <b>Hugging Face :</b> Offre gratuite disponible. Générez un jeton dans vos <a href="https://huggingface.co/settings/tokens" target="_blank">Paramètres HF</a>.<br>• <b>Compatible OpenAI :</b> Utilisez les clés gratuites de <a href="https://console.groq.com/keys" target="_blank">Groq</a>, <a href="https://openrouter.ai/keys" target="_blank">OpenRouter</a> ou Mistral.</p>`
],

async function geminiModels(key){
  const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000", {headers: {"x-goog-api-key": key}});
  const j = await r.json();
  if(!r.ok) throw new Error(j.error?.message || ("HTTP " + r.status));
  const ver = n => parseFloat((n.match(/^gemini-(\d+(?:\.\d+)?)-/) || [])[1]);
  return (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => m.name.replace("models/", ""))
    .filter(n => /flash/.test(n) && !/image|tts|live|audio|embed|robotics|computer|native/.test(n) && ver(n) >= 3.6)

}

const grp = l => l.reduce((m, a) => { const k = (a.start_date_local || "").slice(0, 10); (m[k] = m[k] || []).push(a); return m; }, {});
function dayHtml(k, L, w, P){
  const f = v => Math.round(v), n1 = v => String(Math.round(v * 10) / 10);
  let h = `<b>${esc(new Date(k + "T12:00:00").toLocaleDateString(loc(), {weekday: "long", day: "numeric", month: "long"}))}</b>`;
  if(w && w.ctl != null) h += `<div>CTL ${f(w.ctl)} · ATL ${f(w.atl)} · ${lang === "fr" ? "forme" : "form"} ${f(w.ctl - w.atl)}</div>`;
  if(!L.length) h += `<div>${t("rest")}</div>`;
  for(const a of L){
    const parts = [hm(a.moving_time || 0)];
    if(a.distance) parts.push(n1(a.distance / 1000) + " km");
    if(a.total_elevation_gain) parts.push(t("dElev", f(a.total_elevation_gain)));
    const q = [t("dLoad", f(a.icu_training_load || 0))];
    if(a.icu_intensity) q.push("IF " + (a.icu_intensity > 5 ? a.icu_intensity / 100 : a.icu_intensity).toFixed(2));
    if(a.icu_weighted_avg_watts) q.push("NP " + f(a.icu_weighted_avg_watts) + " W");
    if(a.icu_average_watts) q.push(t("dAvg", f(a.icu_average_watts)));
    if(a.average_heartrate) q.push(t("dHR", f(a.average_heartrate)));
    h += `<div class="act"><b>${esc(a.name || a.type || "")}</b> ${esc(actT(a.type))} ${esc((a.start_date_local || "").slice(11, 16))}<br>${esc(parts.join(" · "))}<br>${esc(q.join(" · "))}</div>`;
  }
  for(const e of P) h += `<div class="act">${esc(t("planned", (e.name || "") + (e.moving_time ? " (" + hm(e.moving_time) + ")" : "")))}</div>`;
  return h;
}
function renderLoad(){
  if(!LAST.acts) return;
  const by = grp(LAST.acts), pl = grp(LAST.plan || []), wl = {};
  (LAST.well || []).forEach(w => { wl[w.id] = w; });
  const cols = []; let max = 1, tl = 0, tt = 0;
  for(let i = 13; i >= 0; i--){
    const k = daysAgo(i), L = by[k] || [], load = L.reduce((s, a) => s + (a.icu_training_load || 0), 0);
    max = Math.max(max, load); tl += load; tt += L.reduce((s, a) => s + (a.moving_time || 0), 0);
    cols.push({k, load, html: dayHtml(k, L, wl[k], pl[k] || [])});
  }

function ds(arr, n){
  if(!arr || !arr.length) return [];
  const w = Math.max(1, Math.floor(arr.length / n)), out = [];
  for(let i = 0; i < arr.length; i += w){
    let s = 0, c = 0;
    for(let j = i; j < Math.min(i + w, arr.length); j++){ const v = arr[j]; if(typeof v === "number" && !isNaN(v)){ s += v; c++; } }
    out.push(c ? s / c : 0);
  }
  return out;
}

function mdLite(txt){
  const inline = s => esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, "$1<i>$2</i>");
  const out = [];
  let list = null;
  const closeList = () => { if(list){ out.push(list === "ul" ? "</ul>" : "</ol>"); list = null; } };
  for(const raw of String(txt).split(/\r?\n/)){
    const line = raw.trim();
    if(!line){ closeList(); continue; }
    const li = line.match(/^[-*•]\s+(.*)$/) || line.match(/^\d+[.)]\s+(.*)$/);
    if(li){
      const kind = /^[-*•]/.test(line) ? "ul" : "ol";
      if(list !== kind){ closeList(); out.push(kind === "ul" ? "<ul>" : "<ol>"); list = kind; }
      out.push(`<li>${inline(li[1])}</li>`);
    }else{
      closeList();
      const h = line.match(/^#{1,4}\s+(.*)$/);
      if(h) out.push(`<h3>${inline(h[1])}</h3>`);

// ---------- Graphe de la séance ----------
let selLine = null, EXPL = null;
function parseWorkout(txt, sport, ftp){
  const steps = []; let group = null;
  const flush = () => { if(group){ for(let i = 0; i < group.n; i++) steps.push(...group.items); group = null; } };
  const num = x => parseFloat(String(x).replace(",", "."));
  const dur = str => {
    let tt = 0, m;
    // formes : 10m, 5min, 30s, 1h, 1h30, 2m45 (composées), 10:00 (mm:ss), 1:30:00 (h:mm:ss)
    const re = /(\d+(?:[.,]\d+)?)\s*(h|min|m|s)(?![a-z])|(\d+):(\d{2})(?::(\d{2}))?/gi;
    while((m = re.exec(str))){
      if(m[3] != null){ tt += m[5] != null ? (+m[3]) * 3600 + (+m[4]) * 60 + (+m[5]) : (+m[3]) * 60 + (+m[4]); continue; }
      const v = num(m[1]), u = m[2].toLowerCase();
      tt += u === "h" ? v * 3600 : u === "s" ? v : v * 60;
      // nombre isolé juste après une unité h ou m/min : "1h30" → 30 min, "2m45" → 45 s
      const rest = str.slice(re.lastIndex).match(/^\s*(\d{1,2})(?![^\s])/);
      if(rest && u !== "s") tt += u === "h" ? (+rest[1]) * 60 : +rest[1];
    }
    return tt;
  };
  const dist = str => {
    const m = str.match(/(\d+(?:[.,]\d+)?)\s*(mtr|km|yrd)/i); if(!m) return 0;
    const v = num(m[1]), u = m[2].toLowerCase(); return u === "km" ? v * 1000 : u === "yrd" ? v * 0.9144 : v;
  };
  const inten = str => {
    let m = str.match(/(\d+(?:[.,]\d+)?)(?:\s*-\s*(\d+(?:[.,]\d+)?))?\s*%/);
    if(m){ const a = num(m[1]), b = m[2] ? num(m[2]) : a; return {a, b, idx: m.index, ramp: /ramp/i.test(str)}; }
    m = str.match(/(\d+(?:[.,]\d+)?)\s*w\b/i);
    if(m && ftp > 0){ const v = num(m[1]) / ftp * 100; return {a: v, b: v, idx: m.index, ramp: false}; }
    m = str.match(/\bz([1-7])\b/i);
    if(m){ const v = [50, 65, 82, 97, 112, 135, 160][m[1] - 1]; return {a: v, b: v, idx: m.index, ramp: false}; }
    return null;
  };
  const spm = sport === "Swim" ? 1 : sport === "Run" ? 0.24 : 0.36;
  for(const [li, raw] of txt.split("\n").entries()){
    const line = raw.trim();
    if(!line){ flush(); continue; }
    const dashed = line.startsWith("-");
    const body = dashed ? line.slice(1).replace(/^\s*/, "") : line;
    const it = inten(body);
    if(it){
      // une ligne avec durée + intensité est une étape, avec ou sans tiret (format natif intervals.icu)
      const pre = body.slice(0, it.idx), mid = (it.a + it.b) / 2;
      let d = dur(pre);
      if(!d){ const m = dist(pre); if(m) d = m * spm / Math.max(mid / 100, 0.3); }
      if(!d) continue;
      const step = {d, a: it.ramp ? it.a : mid, b: it.ramp ? it.b : mid, line: li};
      if(group) group.items.push(step); else steps.push(step);
    }else if(dashed){
      continue;
    }else{
      flush();
      const r = line.match(/(\d+)\s*x\s*$/i);
      if(r) group = {n: Math.min(parseInt(r[1], 10), 50), items: []};
    }
  }
  flush();
  return steps;
}
const zoneOf = p => p < 56 ? 1 : p < 76 ? 2 : p < 91 ? 3 : p < 106 ? 4 : p < 121 ? 5 : p < 151 ? 6 : 7;
const toWatts = (desc, ftp) => desc.split("\n").map(l => l.trim().startsWith("-") ? l.replace(/(\d+(?:\.\d+)?)\s*%/, (m, p) => Math.round(p * ftp / 100) + "w") : l).join("\n");
function renderChart(ovr){
  const box = $("chart"), sport = $("sport").value, ftp = curFtp();
  const steps = ovr || parseWorkout($("desc").value, sport, ftp);
  if(!steps.length){ box.innerHTML = ""; box._steps = []; $("explain").hidden = true; return; }
  const total = steps.reduce((s, x) => s + x.d, 0), peak = Math.max(120, ...steps.map(s => Math.max(s.a, s.b)));
  const W = 300, H = 100, meta = [];
  let x = 0, path = "", wsum = 0, t0 = 0;
  for(const s of steps){
    const w = s.d / total * W, ya = H - s.a / peak * (H - 4), yb = H - s.b / peak * (H - 4);
    path += `<path data-n="${meta.length}" class="z${zoneOf((s.a + s.b) / 2)}${s.line === selLine ? " sel" : ""}" d="M${x.toFixed(2)} ${H}L${x.toFixed(2)} ${ya.toFixed(1)}L${(x + w).toFixed(2)} ${yb.toFixed(1)}L${(x + w).toFixed(2)} ${H}Z"/>`;
    meta.push({d: s.d, a: s.a, b: s.b, start: t0, line: s.line}); t0 += s.d; x += w; wsum += s.d * (s.a + s.b) / 2;
  }
  const avg = Math.round(wsum / total), pace = sport === "Run" || sport === "Swim", mins = Math.round(total / 60);
  const dtxt = mins >= 60 ? Math.floor(mins / 60) + "h" + pad(mins % 60) : mins + " min";
  const cap = dtxt + t("capAvg") + (!pace && ftp > 0 && $("unit").value === "w" ? Math.round(avg * ftp / 100) + " W (" + avg + t("pctFtp") + ")" : avg + (pace ? t("pctPace") : t("pctFtp")) + (!pace && ftp > 0 ? " (" + Math.round(avg * ftp / 100) + " W)" : ""));

  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(cap)}">${path}</svg><div class="cap">${esc(cap)}</div>${load}<div class="tip" hidden></div>`;
  box._steps = meta; renderExplain(steps);
}
function tipText(s, ftp, pace){

  return d + " · " + val + "\n" + t("tipZ", zoneOf((s.a + s.b) / 2), mmss(s.start));
}

// ---------- Réduction à durée cible (shrink) ----------
function fmtDur(sec){
  sec = Math.max(1, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? `${h}h${m}m` : m ? (s ? `${m}m${s}s` : `${m}m`) : `${s}s`;
}
function reTime(line, sec){
  const tok = "(?:\\d+(?:[.,]\\d+)?\\s*(?:h|min|m|s)(?![a-z])|\\d+:\\d{2}(?::\\d{2})?)";
  // remplace TOUTE l'expression de durée en tête de ligne (« 15m », « 1h30 », « 2m5s »…) par une durée unique et propre
  const re = new RegExp("^(\\s*-\\s*)(" + tok + "(?:\\s*\\d{1,2}(?![a-z0-9%:-]))?(?:\\s*" + tok + ")*)(?=\\s|$)", "i");
  const m = line.match(re);
  return m ? m[1] + fmtDur(sec) + line.slice(m[0].length) : line;
}
function shrinkRegion(lines, steps, cut){
  // raccourcit les lignes de la région (échauffement ou retour au calme) pour lui retirer ~cut secondes
  if(!steps.length || cut <= 0) return 0;
  const tot = steps.reduce((s, x) => s + x.d, 0);
  const scale = Math.max(0, (tot - cut) / tot);
  const byLine = {};
  steps.forEach(s => { (byLine[s.line] = byLine[s.line] || []).push(s); });
  let done = 0;
  for(const li of Object.keys(byLine)){
    const ls = byLine[li], per = ls[0].d;
    const newPer = Math.max(30, Math.round(per * scale / 30) * 30);
    if(newPer >= per) continue;
    const nl = reTime(lines[li], newPer);
    if(nl === lines[li]) continue; // durée non réécrite (ex. étape en distance) : ne pas comptabiliser
    lines[li] = nl;
    done += ls.length * (per - newPer);
  }
  return done;
}

// --- ajustement global des intensités (±5 % de FTP) ---
function shiftIntensity(delta){
  const steps = parseWorkout($("desc").value, $("sport").value, curFtp());
  if(!steps.length) return say("prevEmpty", "err");
  pushUndo();
  const lines = $("desc").value.split("\n");
  let touched = 0;
  // décale les pourcentages et les watts ; les rampes gardent leur écart
  lines.forEach((line, i) => {
    if(!/^\s*-/.test(line)) return;
    let moved = false;
    // décale les pourcentages (bornes des plages comprises) et les watts
    const np = line.replace(/(\d+(?:\.\d+)?)(?:\s*-\s*(\d+(?:\.\d+)?))?\s*%/g, (m, p, q) => {
      moved = true;
      const sh = v => Math.max(0, Math.round((+v + delta) * 10) / 10);
      return q != null ? sh(p) + "-" + sh(q) + "%" : sh(p) + "%";
    });
    const nw = np.replace(/(\d+(?:\.\d+)?)\s*w\b/gi, (m, w) => { moved = true; return (Math.max(0, Math.round((+w * (1 + delta / 100)) * 10) / 10)) + "w"; });
    if(moved){ lines[i] = nw; touched++; }
  });
  if(!touched){ UNDO = null; $("undoBtn").hidden = true; return say("shrinkNone", "err"); }
  $("desc").value = lines.join("\n"); selLine = null; renderChart();
  say("intensDone", "ok", (delta > 0 ? "+" : "") + delta + " % FTP");
  toast(t("intensDone", (delta > 0 ? "+" : "") + delta + " % FTP"), "ok", doUndo);
}
$("minus5").onclick = () => shiftIntensity(-5);

$("shrinkbtn").onclick = () => {
  const before = $("desc").value;
  const steps = parseWorkout(before, $("sport").value, curFtp());
  if(!steps.length) return say("prevEmpty", "err");
  const total = steps.reduce((s, x) => s + x.d, 0);
  const target = (+$("shrinksel").value) * 60;
  if(total <= target + 5) return say("shrinkAlready", "ok", hm(target));
  const mid = s => (s.a + s.b) / 2;
  const cnt = {}; steps.forEach(s => cnt[s.line] = (cnt[s.line] || 0) + 1);
  // les étapes d'un bloc de répétitions font partie du cœur : on n'y touche pas
  const easy = s => mid(s) < 80 && cnt[s.line] === 1;
  let wi = 0; while(wi < steps.length && easy(steps[wi])) wi++;
  let ci = steps.length; while(ci > wi && easy(steps[ci - 1])) ci--;
  if(wi >= steps.length){ wi = Math.ceil(steps.length / 2); ci = wi; } // séance entièrement facile : couper au milieu
  const wSteps = steps.slice(0, wi), cSteps = steps.slice(ci);
  const wTot = wSteps.reduce((s, x) => s + x.d, 0), cTot = cSteps.reduce((s, x) => s + x.d, 0);
  const wAvail = Math.max(0, wTot - 300), cAvail = Math.max(0, cTot - 300); // on laisse jusqu'à 5' de chaque côté
  if(wAvail + cAvail <= 0) return say("shrinkNone", "err");
  const excess = Math.min(total - target, wAvail + cAvail);
  let wCut = Math.min(Math.round(excess * wAvail / (wAvail + cAvail)), wAvail);
  const cCut = Math.min(excess - wCut, cAvail);
  const lines = before.split("\n");
  const done = shrinkRegion(lines, wSteps, wCut) + shrinkRegion(lines, cSteps, cCut);
  if(!done) return say("shrinkNone", "err");
  pushUndo();
  $("desc").value = lines.join("\n"); selLine = null; renderChart();
  const newTotal = total - done;
  if(newTotal > target + 60) say("shrinkPart", "ok", hm(done), hm(newTotal));
  else say("shrinkDone", "ok", hm(total), hm(newTotal));
  toast(t(newTotal > target + 60 ? "shrinkPart" : "shrinkDone", ...(newTotal > target + 60 ? [hm(done), hm(newTotal)] : [hm(total), hm(newTotal)])), "ok", doUndo);
};

function bzWarm(theme){
  if(theme === "bz_recovery") return "Warmup\n- 5m 45%";
  if(theme === "bz_endurance") return "Warmup\n- 15m 55%";
  if(theme === "bz_tempo") return "Warmup\n- 10m 50%\n- 5m 65%";
  if(theme === "bz_test") return "Warmup\n- 15m 50%\n- 5m 65%";
  return "Warmup\n- 10m 50%\n- 5m 70%\n- 3x 30s 115%\n- 2m 50%";
}
function bz(theme, name, name_fr, main, expl_en, expl_fr, warm, cool){
  const desc_en = (warm || bzWarm(theme)) + "\n\n" + main + "\n\n" + (cool || "Cooldown\n- 10m 50%");
  LIBRARY.push(extraWorkout(theme, name, name_fr, desc_en, expl_en, expl_fr));
}

function workoutPreviewSvg(desc, sport, ftp){
  const steps = parseWorkout(desc, sport, ftp);
  if(!steps.length) return "";
  const total = steps.reduce((sum, step) => sum + step.d, 0);
  const peak = Math.max(120, ...steps.map(step => Math.max(step.a, step.b)));
  const W = 300, H = 100;
  let x = 0, path = "";
  for(const step of steps){
    const w = step.d / total * W;
    const ya = H - step.a / peak * (H - 4), yb = H - step.b / peak * (H - 4);
    path += `<path class="z${zoneOf((step.a + step.b) / 2)}" d="M${x.toFixed(2)} ${H}L${x.toFixed(2)} ${ya.toFixed(1)}L${(x+w).toFixed(2)} ${yb.toFixed(1)}L${(x+w).toFixed(2)} ${H}Z"/>`;
    x += w;
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${path}</svg>`;
}

// Durée / puissance moyenne / NP d'une séance de la bibliothèque
function libDuration(item){
  if(item._dur == null){
    const steps = parseWorkout(item.desc_en, item.sport, 0);
    item._dur = steps.reduce((s, x) => s + x.d, 0);
  }
  return item._dur;
}
function stepsStats(steps){
  if(!steps.length) return null;
  const total = steps.reduce((s, x) => s + x.d, 0);
  const avgPct = steps.reduce((s, x) => s + x.d * (x.a + x.b) / 2, 0) / total;
  // NP : moyenne glissante 30 s, puissance^4, moyenne, racine 4e (échantillonnage à la seconde)
  const win = 30, ser = [];
  for(const st of steps){
    const d = Math.round(st.d);
    for(let i = 0; i < d; i++) ser.push(st.a + (st.b - st.a) * (d > 1 ? i / (d - 1) : 0));
  }
  let npPct = avgPct;
  if(ser.length >= win){
    let sum = 0; const pre = [];
    for(let i = 0; i < ser.length; i++){ sum += ser[i]; if(i >= win) sum -= ser[i - win]; if(i >= win - 1) pre.push(sum / win); }
    const m4 = pre.reduce((s, v) => s + Math.pow(Math.max(v, 0), 4), 0) / pre.length;
    npPct = Math.pow(m4, 0.25);
  }
  // TSS = heures × IF² × 100 (IF = NP / FTP)
  const iff = npPct / 100, tss = total / 3600 * iff * iff * 100;
  return {total, avgPct, npPct, iff, tss};
}
function libStats(item, ftp){ return stepsStats(parseWorkout(item.desc_en, item.sport, ftp)); }
function libStatsText(item, ftp){
  const st = libStats(item, ftp);
  if(!st) return "";
  const w = ftp > 0;
  const np = w ? " · NP " + Math.round(st.npPct * ftp / 100) + " W" : " · NP " + Math.round(st.npPct) + " %";
  const load = " · IF " + st.iff.toFixed(2) + " · TSS " + Math.round(st.tss);
  return hm(st.total) + " · " + t("libAvg") + " " + (w ? Math.round(st.avgPct * ftp / 100) + " W" : Math.round(st.avgPct) + " %") + np + load;
}

function renderLibrary(){
  const c = $("libContainer");
  const q = ($("libsearch").value || "").trim().toLowerCase();
  const durF = $("libdur").value || "all";
  const starOnly = $("libstar").checked;
  const matches = item => {
    if(starOnly && !stars().includes(item.id)) return false;
    if(q){
      const hay = [item.name_en, item.name_fr, item.expl_en, item.expl_fr, item.desc_en].join(" ").toLowerCase();
      if(!q.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    if(durF !== "all"){
      const d = libDuration(item);
      if(durF === "inf" ? d <= 105 * 60 : !(durF === "45" ? d <= 45 * 60 : durF === "75" ? d > 45 * 60 && d <= 75 * 60 : d > 75 * 60 && d <= 105 * 60)) return false;
    }
    return true;
  };
  const themes = [
    {id:"beginner",icon:"🌱",en:"Beginner & Short Sessions",fr:"Débutant & séances courtes"},
    {id:"recovery",icon:"🌿",en:"Recovery & Taper",fr:"Récupération & affûtage"},
    {id:"endurance",icon:"🚴",en:"Endurance",fr:"Endurance"},
    {id:"tempo",icon:"📈",en:"Tempo & Sweet Spot",fr:"Tempo & sweet spot"},
    {id:"threshold",icon:"🔥",en:"Threshold",fr:"Seuil"},
    {id:"vo2max",icon:"⚡",en:"VO₂ Max & Anaerobic",fr:"VO₂ Max & anaérobie"},
    {id:"sprint",icon:"💥",en:"Sprint & Race",fr:"Sprint & course"},
    {id:"testing",icon:"🎯",en:"Testing",fr:"Tests"}
  ];
  // Regroupement des anciennes catégories (toutes les séances sont conservées)
  const CATMAP = {beginner:"beginner",short:"beginner",recovery:"recovery",bz_recovery:"recovery",taper:"recovery",endurance:"endurance",bz_endurance:"endurance",tempo:"tempo",sweetspot:"tempo",bz_tempo:"tempo",threshold:"threshold",bz_threshold:"threshold",vo2max:"vo2max",bz_vo2max:"vo2max",anaerobic:"vo2max",fast:"vo2max",sprint:"sprint",bz_sprint:"sprint",uae:"sprint",adq:"sprint",testing:"testing",bz_test:"testing"};
  const groups=themes.map(theme=>({...theme,items:[]}));
  const categorize=item=>{
    if(item.category) return CATMAP[item.category] || "endurance";
    const n=(item.name_en+" "+item.name_fr).toLowerCase();
    let base="endurance";
    if(/recovery|récupération/.test(n)) base="recovery";
    else if(/vo2|max|punchy|explosif|anaerobic|anaérobie/.test(n)) base="vo2max";
    else if(/sprint/.test(n)) base="sprint";
    else if(/threshold|seuil|over-under|redline/.test(n)) base="threshold";
    else if(/sweet spot/.test(n)) base="tempo";
    else if(/tempo|cadence|fast finish/.test(n)) base="tempo";
    else if(/endurance|aerobic|aérobie/.test(n)) base="endurance";
    else if(/uae team em|uae team adq/.test(n)) base="sprint";
    else if(/beginner|débutant/.test(n)) base="beginner";
    return CATMAP[base] || "endurance";
  };
  LIBRARY.forEach((item,idx)=>{ if(!matches(item)) return; const group=groups.find(g=>g.id===categorize(item))||groups[5]; group.items.push({item,idx}); });
  const filled = groups.filter(g => g.items.length);
  if(!filled.length){ c.innerHTML = `<div class="hint">${esc(t("libNo"))}</div>`; return; }

let starList = (() => { try{ const a = JSON.parse(store.get("si_stars") || "[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; } })();
const stars = () => starList;
function setStars(a){ starList = Array.isArray(a) ? a.slice() : []; store.set("si_stars", JSON.stringify(starList)); }
function toggleStar(id){ const a = stars().slice(); const i = a.indexOf(id); if(i >= 0) a.splice(i, 1); else a.push(id); setStars(a); }

// ---------- Historique et envoi ----------
const hist = () => { try{ return JSON.parse(store.get("si_hist") || "[]"); }catch(e){ return []; } };
function renderHist(){
  const cur = $("hist").value;
  $("hist").innerHTML = `<option value="">${esc(t("histPick"))}</option>` + hist().map((h, i) => `<option value="${i}">${esc(h.date)} · ${esc(h.name)}</option>`).join("");
  $("hist").value = cur;
}
function addHist(h){

function dlFile(name, data, mime){

function expFname(ext){

}
function buildZwo(steps){
  const body = steps.map(s => {
    const dur = Math.round(s.d), lo = Math.min(s.a, s.b) / 100, hi = Math.max(s.a, s.b) / 100;
    if(Math.abs(s.a - s.b) > 0.5) return `<${lo < hi ? "Warmup" : "Cooldown"} Duration="${dur}" PowerLow="${lo.toFixed(3)}" PowerHigh="${hi.toFixed(3)}"/>`;
    return `<SteadyState Duration="${dur}" Power="${(s.a / 100).toFixed(3)}"/>`;
  }).join("\n      ");
  return `<?xml version="1.0" encoding="UTF-8"?>\n<workout_file>\n  <author>PaceForge</author>\n  <name>${esc(($("name").value || "Workout").trim())}</name>\n  <workout>\n      ${body}\n  </workout>\n</workout_file>`;
}
// --- FIT binaire (workout) ---
function fitCrc(bytes){
  let crc = 0;
  for(const b of bytes){ crc ^= b << 8; for(let i = 0; i < 8; i++) crc = crc & 0x8000 ? ((crc << 1) ^ 0x1021) & 0xffff : (crc << 1) & 0xffff; }
  return crc;
}
function fitDef(local, global, fields){
  const b = [0x40 | local, 0, 0, global & 0xff, (global >> 8) & 0xff, fields.length];
  fields.forEach(([n, s, t]) => b.push(n, s, t));
  return b;
}
const u16 = v => [v & 0xff, (v >> 8) & 0xff];
const u32 = v => [v & 0xff, (v >> 8) & 0xff, (v >> 16) & 0xff, (v >>> 24) & 0xff];
function buildFit(steps){
  const str = (s, n) => { const b = []; for(let i = 0; i < n; i++) b.push(i < s.length ? s.charCodeAt(i) & 0xff : 0); return b; };
  const pad4 = n => Math.min(64, (Math.floor(n / 4) + 1) * 4); // chaîne FIT : multiple de 4 recommandé
  const name = ($("name").value || "Workout").trim().slice(0, 40), nameLen = pad4(name.length + 1);
  const ts = Math.floor(Date.now() / 1000) - 631065600; // epoch FIT : 31/12/1989
  const records = [];
  // file_id (local 0) : time(4,u32), manufacturer(1,u16), product(2,u16), serial(3,u32), type(0,enum)
  records.push(fitDef(0, 0, [[4, 4, 134], [1, 2, 132], [2, 2, 132], [3, 4, 134], [0, 1, 0]]));
  records.push([0, ...u32(ts), ...u16(255), ...u16(0), ...u32(ts), 5]);
  // workout (local 1) : sport(0,enum), num_valid_steps(5,u16), wkt_name(6,string), sub_sport(11,enum)
  records.push(fitDef(1, 26, [[0, 1, 0], [5, 2, 132], [6, nameLen, 7], [11, 1, 0]]));
  records.push([1, isBike($("sport").value) ? 2 : 1, ...u16(steps.length), ...str(name, nameLen), 0]);
  // workout_step (local 2) : message_index(254,u16), duration_type(0,enum), duration_value(1,u32),
  // target_type(2,enum), target_value(3,u32), custom_target_value_low(5,u32), custom_target_value_high(6,u32), intensity(7,enum)
  records.push(fitDef(2, 27, [[254, 2, 132], [0, 1, 0], [1, 4, 134], [2, 1, 0], [3, 4, 134], [5, 4, 134], [6, 4, 134], [7, 1, 0]]));
  steps.forEach((s, i) => {
    const mid = (s.a + s.b) / 2;
    let intensity = 0; // active
    if(i === 0 && mid < 76) intensity = 2; // warmup
    else if(i === steps.length - 1 && mid < 76) intensity = 3; // cooldown
    else if(mid < 56) intensity = 1; // rest
    const pm = Math.max(0, Math.min(1000, Math.round(mid * 10))); // puissance relative 0..1000 pour mille
    records.push([2, ...u16(i), 0, ...u32(Math.round(s.d) * 1000), 4, ...u32(0), ...u32(pm), ...u32(pm), intensity]);
  });
  const data = records.flat();
  const head = [12, 0x10, 0xB6, 0x0B, ...u32(data.length), 0x2E, 0x46, 0x49, 0x54];
  const headCrc = fitCrc(head);
  const file = [...head, headCrc & 0xff, (headCrc >> 8) & 0xff, ...data];
  const crc = fitCrc(file);
  file.push(crc & 0xff, (crc >> 8) & 0xff);
  return file;
}
// --- ERG / MRC : points « minutes valeur » (rampes = deux points, paliers = saut vertical) ---
function buildErgPoints(steps, val){
  const rows = []; let t = 0;
  steps.forEach(s => { rows.push(t.toFixed(2) + "\t" + val(s.a)); t += s.d / 60; rows.push(t.toFixed(2) + "\t" + val(s.b)); });
  return rows;
}
function ergHeader(kind, fname, desc){
  return `[COURSE HEADER]\nVERSION = 2\nUNITS = ENGLISH\nDESCRIPTION = ${desc}\nFILE NAME = ${fname}\nMINUTES ${kind === "mrc" ? "PERCENT" : "WATTS"}\n[END]\n[COURSE DATA]\n`;
}
function buildErg(steps){
  const ftp = curFtp(), name = ($("name").value || "workout").trim();
  return ergHeader("erg", expFname(".erg"), name) + buildErgPoints(steps, p => Math.round(p * ftp / 100)).join("\n") + "\n[END]";
}
function buildMrc(steps){
  const name = ($("name").value || "workout").trim();
  return ergHeader("mrc", expFname(".mrc"), name) + buildErgPoints(steps, p => p.toFixed(1)).join("\n") + "\n[END]";
}
function buildJson(steps){

    name: ($("name").value || "Workout").trim(),

// ---------- Import .zwo / .fit ----------
function fmtDurImp(sec){
  sec = Math.round(sec);
  if(sec >= 3600 && sec % 3600 === 0) return (sec / 3600) + "h";
  if(sec >= 3600) return Math.floor(sec / 3600) + "h" + Math.round((sec % 3600) / 60);
  if(sec >= 60 && sec % 60 === 0) return (sec / 60) + "m";
  if(sec < 60) return sec + "s";
  return Math.floor(sec / 60) + "m" + (sec % 60);
}
function stepsToDesc(steps, watt){
  const key = s => Math.round(s.d) + "|" + s.a.toFixed(1) + "|" + s.b.toFixed(1);
  const line = s => {
    const p = Math.abs(s.a - s.b) > 0.5
      ? Math.round(Math.min(s.a, s.b)) + " - " + Math.round(Math.max(s.a, s.b)) + (watt ? "w" : "% ramp")
      : Math.round(s.a) + (watt ? "w" : "%");
    return "- " + fmtDurImp(s.d) + " " + p;
  };
  const out = []; let i = 0;
  while(i < steps.length){
    if(i + 1 < steps.length && key(steps[i]) === key(steps[i + 1])){ // même étape répétée d'affilée
      let n = 1, j = i + 1;
      while(j < steps.length && key(steps[j]) === key(steps[i])){ n++; j++; }
      out.push(n + " x", line(steps[i]), ""); i = j; continue;
    }
    if(i + 3 < steps.length && key(steps[i]) === key(steps[i + 2]) && key(steps[i + 1]) === key(steps[i + 3])){ // couple effort/récup répété
      let n = 1, j = i + 2;
      while(j + 1 < steps.length && key(steps[j]) === key(steps[i]) && key(steps[j + 1]) === key(steps[i + 1])){ n++; j += 2; }
      out.push(n + " x", line(steps[i]), line(steps[i + 1]), ""); i = j; continue;
    }
    out.push(line(steps[i])); i++;
  }
  return out.join("\n");
}
function parseZwo(xml){
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  if(doc.querySelector("parsererror")) throw new Error("invalid XML");
  const wk = doc.querySelector("workout");
  if(!wk) throw new Error("no <workout> element");
  const out = [];
  const p = (el, n) => { const v = el.getAttribute(n); return v == null ? null : parseFloat(v); };
  const add = (d, a, b) => { if(d > 0 && a != null) out.push({d: Math.round(d), a: a * 100, b: b * 100}); };
  for(const el of wk.children){
    const tag = el.tagName.toLowerCase();
    if(tag === "steadystate"){ add(p(el, "Duration"), p(el, "Power"), p(el, "Power")); }
    else if(tag === "warmup" || tag === "cooldown" || tag === "ramp" || tag === "warmdown"){
      const lo = p(el, "PowerLow"), hi = p(el, "PowerHigh");
      add(p(el, "Duration"), Math.min(lo, hi), Math.max(lo, hi));
    }
    else if(tag === "intervals" || tag === "intervalst"){
      const rep = p(el, "Repeat") || 1, on = p(el, "OnDuration"), off = p(el, "OffDuration");
      const op = p(el, "OnPower"), fp2 = p(el, "OffPower");
      for(let k = 0; k < rep; k++){ add(on, op, op); if(off && fp2 != null) add(off, fp2, fp2); }
    }
  }
  return out;
}
// --- lecture d'un fichier FIT (workout) ---
function parseFit(bytes){
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  if(bytes.length < 12 || bytes[1] !== 0x10 || String.fromCharCode(...bytes.slice(8, 12)) !== ".FIT") throw new Error("not a FIT file");
  const hl = bytes[0];
  const defs = new Map(), msgs = {};
  const rd = (base, p, big) => {
    switch(base){
      case 0: case 2: case 10: return bytes[p];
      case 1: return dv.getInt8(p);
      case 3: return dv.getInt16(p, !big);
      case 4: case 11: return dv.getUint16(p, !big);
      case 5: return dv.getInt32(p, !big);
      case 6: case 12: return dv.getUint32(p, !big);
      case 8: return dv.getFloat32(p, !big);
      case 9: return dv.getFloat64(p, !big);
      default: return null;
    }
  };
  const scan = (start, stop) => {
    defs.clear(); Object.keys(msgs).forEach(k => delete msgs[k]);
    let pos = start;
    try{
      while(pos < stop && pos < bytes.length){
        let h = bytes[pos++];
        if(h & 0x80){ pos += 2; continue; } // horodatage compressé : ignoré
        if(h & 0x40){
          pos++; // réservé
          const big = bytes[pos] === 1; // architecture : 0 = petit boutiste, 1 = gros boutiste
          pos++;
          const g = dv.getUint16(pos, !big); pos += 2;
          const n = bytes[pos++], fields = [];
          for(let k = 0; k < n; k++){ fields.push([bytes[pos], bytes[pos + 1], bytes[pos + 2]]); pos += 3; }
          defs.set(h & 0x0f, {g, fields, big});
        }else{
          const d = defs.get(h & 0x0f);
          if(!d) break;
          const rec = {};
          for(const [num, sz, tp] of d.fields){
            if((tp & 0x1f) === 7){ // chaîne
              let e = pos; while(e < bytes.length && bytes[e]) e++;
              rec[num] = new TextDecoder().decode(bytes.slice(pos, Math.min(e, pos + sz)));
              pos += sz;
            }else{
              rec[num] = rd(tp & 0x1f, pos, d.big);
              pos += sz;
            }
          }
          (msgs[d.g] = msgs[d.g] || []).push(rec);
        }
      }
    }catch(e){ /* flux désynchronisé ou tronqué : on garde ce qui a été lu */ }
  };
  scan(hl === 14 ? 14 : 12, hl === 14 ? 14 + dv.getUint32(4, true) : bytes.length);
  if(!(msgs[27] || []).length && hl === 12 && bytes.length > 14){
    // certaines écritures placent un CRC après une en-tête de 12 octets : les données commencent alors à 14
    scan(14, bytes.length);
  }
  // workout (26) / workout_step (27)
  const ftp = curFtp();
  const out = [];
  for(const r of (msgs[27] || [])){
    let d = 0;
    if((r[0] === 0 || r[0] == null) && r[1]) d = r[1] / 1000; // durée en ms
    if(!d) continue;
    let a = null, b = null;
    if(r[2] === 4 && r[3] != null){ // cible puissance relative (pour mille)
      const v = r[3];
      if(v <= 1000) a = b = v / 10;
      else if(ftp > 0) a = b = v / ftp * 100;
    }
    if(r[5] != null && r[6] != null){ // plage personnalisée
      const lo = r[5], hi = r[6];
      if(lo <= 1000 && hi <= 1000){ a = lo / 10; b = hi / 10; }
      else if(ftp > 0){ a = lo / ftp * 100; b = hi / ftp * 100; }
    }
    if(a == null) continue;
    out.push({d: Math.round(d), a, b});
  }
  return out;
}
async function importFile(f){
  try{
    const buf = new Uint8Array(await f.arrayBuffer());
    const steps = /\.fit$/i.test(f.name) ? parseFit(buf) : parseZwo(new TextDecoder().decode(buf));
    if(!steps.length) return say("impEmpty", "err");
    const nm = f.name.replace(/\.(zwo|fit|xml)$/i, "").replace(/[_-]+/g, " ").replace(/\s*\b\w/g, c => c.toUpperCase()).trim().slice(0, 60);
    if(nm) $("name").value = nm;

    renderChart(); say("impOk", "ok", f.name);

    say("impErr", "err", e && e.message ? e.message : errText(e));
  }
}

// Détection d'intervalles : lissage 5 s, segmentation par paliers, fusion des segments courts,
// tolérance adaptative pour éviter les séances-patates d'arena à des centaines d'étapes.
function detectSteps(watts, ftp){
  const s = [];
  for(const v of watts) s.push(typeof v === "number" && v >= 0 && v < 2500 ? v : 0);
  const N = s.length;
  if(N < 60 || !ftp) return [];
  const K = 5, sm = [];
  let sum = 0;
  for(let i = 0; i < N; i++){ sum += s[i]; if(i >= K) sum -= s[i - K]; sm.push(sum / Math.min(i + 1, K)); }
  const build = rel => {
    const tol = v => Math.max(8, v * rel);
    const groups = [];
    let g = null;
    for(let i = 0; i < N; i++){
      const v = sm[i], avg = g ? g.sum / g.n : 0;
      if(g && Math.abs(v - avg) <= tol(avg)){ g.sum += v; g.n++; g.end = i; }
      else{ if(g) groups.push(g); g = {sum: v, n: 1, start: i, end: i}; }
    }
    if(g) groups.push(g);
    // fusion des segments courts (< 20 s) dans le voisin
    const min = 20, out = [];
    for(const gr of groups){
      if(gr.n >= min){ out.push({...gr}); continue; }
      if(out.length){ const p = out[out.length - 1]; p.sum += gr.sum; p.n += gr.n; p.end = gr.end; }
      else out.push({...gr}); // court en tête : absorbé par le suivant
    }
    const out2 = [];
    for(let i = 0; i < out.length; i++){
      if(!out2.length && out[i].n < min && i + 1 < out.length){ const nx = out[i + 1]; nx.sum += out[i].sum; nx.n += out[i].n; nx.start = out[i].start; continue; }
      out2.push(out[i]);
    }
    // étapes : moyennes en excluant ~8 s de transition aux bords des groupes
    const ents = [];
    for(const gr of out2){
      const raw = s.slice(gr.start, gr.end + 1);
      const off = raw.length >= 25 ? 8 : 0;
      const core = off ? raw.slice(off, raw.length - off) : raw;
      const edge = arr => arr.reduce((x, y) => x + y, 0) / arr.length;
      ents.push({d: gr.n, headW: edge(core.slice(0, Math.min(15, core.length))), tailW: edge(core.slice(-Math.min(15, core.length))), midW: edge(core), wN: core.length});
    }
    // fusion des paliers contigus : une rampe linéaire découpée par la segmentation est recollée
    const mrg = [];
    for(const e of ents){
      const last = mrg[mrg.length - 1];
      if(last && Math.abs(last.tailW - e.headW) <= Math.max(12, (last.midW + e.midW) / 2 * 0.12)){
        last.d += e.d; last.tailW = e.tailW;
        last.midW = (last.midW * last.wN + e.midW * e.wN) / (last.wN + e.wN); last.wN += e.wN;
      }else mrg.push({...e});
    }
    // conversion en % FTP — pas de rampes (certains home trainers ne les gèrent pas) :
    // chaque ancienne rampe devient un palier plat au maximum ou au minimum de la rampe,
    // selon le contexte : voisins plus durs que la rampe → maximum, voisins plus faciles → minimum ;
    // sans voisin, on garde la valeur d'arrivée de la rampe (montante → max, descendante → min).
    // étapes en WATTS ABSOLUS (moyennes réelles du flux de puissance) : pas de conversion en % FTP
    // qui dépend d'une FTP parfois différente de celle de l'activité et surestime les blocs.
    // Les paliers plats utilisent la moyenne du cœur du segment ; les rares rampes sont aplaties
    // au maximum ou au minimum selon le contexte (voisins plus durs → max, plus faciles → min).
    const flat = mrg.map(e => {
      if(e.d >= 30 && Math.abs(e.headW - e.tailW) > Math.max(15, e.midW * 0.15)){
        return {d: e.d, ramp: true, rise: e.tailW >= e.headW, hi: Math.max(e.headW, e.tailW), lo: Math.min(e.headW, e.tailW), mid: e.midW};
      }
      return {d: e.d, ramp: false, mid: e.midW};
    });
    return flat.map((e, i) => {
      if(!e.ramp) return {d: e.d, a: e.mid, b: e.mid};
      const ref = st => st.ramp ? (st.hi + st.lo) / 2 : st.mid;
      const pv = i > 0 ? ref(flat[i - 1]) : null, nx = i + 1 < flat.length ? ref(flat[i + 1]) : null;

        const ctx = arr.reduce((x, y) => x + y, 0) / arr.length;
        v = ctx >= e.mid ? Math.min(e.hi, Math.max(...arr)) : Math.max(e.lo, Math.min(...arr));
      }
      return {d: e.d, a: v, b: v};
    });
  };
  let steps = [];
  for(const rel of [0.07, 0.12, 0.18, 0.25]){
    steps = build(rel);
    if(steps.length <= 50) break;
  }
  return steps;
}
async function buildFromAct(a, btn){

    // On ne suit PAS le sélecteur du panneau « Générer » (souvent sur indoor) : une sortie outdoor
    // reconstruite avec la FTP indoor surestime tous les blocs. Repli sur l'autre FTP si absente.
    const virt = a.type === "VirtualRide";
    const ftp = (virt ? ICU.ftpIn : ICU.ftpOut) || (virt ? ICU.ftpOut : ICU.ftpIn);
    if(!ftp) throw new Error(t("actNeedFtp"));

    const list = Array.isArray(j) ? j : (j.streams || []);

    const w = get("watts", "power", "watts_calc");

      // « intervals.icu FTP » de l'aperçu sur cette même FTP, car l'aperçu, les exports
      // et l'envoi vers intervals.icu réappliquent les pourcentages sur cette FTP :

      const fIn = ICU.ftpIn, fOut = ICU.ftpOut;

      steps = steps.map(s => ({d: s.d, a: s.a / pf * 100, b: s.b / pf * 100}));

// (% FTP ou watts absolus via la FTP sélectionnée), comme pour les autres étapes.
const ED_STD = {
  warm: [[5, 0, 50], [3, 0, 60], [2, 0, 70], [1, 0, 80], [1, 0, 55]],
  cool: [[2, 0, 60], [3, 0, 50], [5, 0, 40]]
};
function stdSteps(ty){
  const f = curFtp();
  return (ED_STD[ty] || []).map(([m, s, pc]) => ({k: "s", ty, mode: "t", v: m + ":" + String(s).padStart(2, "0"), i: String(edW() && f ? Math.round(f * pc / 100) : pc), n: "", uid: ++edUid}));
}
const edBtn = (a, txt, ttl, cls) => `<button class="alt small${cls ? " " + cls : ""}" data-a="${a}" type="button"${ttl ? ` title="${esc(ttl)}" aria-label="${esc(ttl)}"` : ""}>${txt}</button>`;
const edCtl = (rec, std) => `<span class="drg" title="${esc(t("dragLbl"))}" aria-label="${esc(t("dragLbl"))}">⠿</span><span class="ctl">${edBtn("up", "↑", t("mvUp"))}${edBtn("down", "↓", t("mvDown"))}${edBtn("dup", "⧉", t("dup"))}${rec ? edBtn("rec", esc(t("addRecAfter"))) : ""}${std ? edBtn("std", esc(std)) : ""}${edBtn("del", "✕", t("del"), "danger")}</span>`;
function edStep(x, p){
  const u = edW() ? "W" : edKm() ? "% FTP" : "% " + t("pace");
  return `<div class="st ${x.ty}" data-p="${p}"><select data-f="ty" aria-label="${esc(t("edT"))}">${opts(["warm", "work", "rec", "cool"].map(y => [y, t("tt_" + y)]), x.ty)}</select>` +
    `<select data-f="mode">${opts([["t", t("edTime")], ["d", t("edDist")]], x.mode)}</select>` +
    `<div class="fld"><input data-f="v" value="${esc(x.v)}" aria-label="${esc(t(x.mode === "d" ? "edDist" : "edTime"))}"><span>${x.mode === "d" ? (edKm() ? "km" : "m") : "mm:ss"}</span></div>` +
    `<div class="fld"><input data-f="i" type="number" min="0" value="${esc(x.i)}" aria-label="${esc(t("edInt"))}"><span>${esc(u)}</span></div>` +
    `<input data-f="n" value="${esc(x.n)}" placeholder="${esc(t("edNote"))}">${edCtl(x.ty !== "rec", x.ty === "warm" || x.ty === "cool" ? t("std_" + x.ty) : null)}</div>`;
}
const edGrp = (g, i) => `<div class="grp"><div class="gh" data-p="${i}"><b>${esc(t("repLbl"))}</b><span class="stp">${edBtn("rm", "−", t("repDec"))}<input data-f="r" type="number" min="1" max="50" value="${esc(g.r)}" aria-label="${esc(t("repLbl"))}">${edBtn("rp", "+", t("repInc"))}<span aria-hidden="true">×</span></span>${edCtl(false)}</div>${g.items.map((x, j) => edStep(x, i + "." + j)).join("")}<div class="actions"><button class="alt small" data-a="addin" data-g="${i}" data-ty="work" type="button">${esc(t("addWork"))}</button><button class="alt small" data-a="addin" data-g="${i}" data-ty="rec" type="button">${esc(t("addRec"))}</button></div></div>`;
function edDur(x){
  if(x.mode === "d") return (parseFloat(String(x.v).replace(",", ".")) || 0) + (edKm() ? "km" : "mtr");
  const [m, sc] = String(x.v).split(":"), sec = (parseInt(m, 10) || 0) * 60 + (parseInt(sc, 10) || 0), h = Math.floor(sec / 3600), mm = Math.floor(sec % 3600 / 60), ss = sec % 60;
  return (h ? h + "h" : "") + (mm ? mm + "m" : "") + (ss ? ss + "s" : "") || "0s";
}
function edLine(x){
  const i = x.i !== "" && x.i != null ? " " + x.i + (edW() ? "w" : "%") + (edKm() ? "" : " Pace") : "", n = x.n || (x.ty === "rec" ? t("tt_rec") : "");
  return `- ${edDur(x)}${i}${n ? " " + n : ""}`;
}
function edText(){
  const out = []; let lastTy = null;
  ED.forEach(x => {
    if(x.k === "g"){ out.push(`${t("tMain")} ${parseInt(x.r, 10) || 1}x`, ...x.items.map(edLine), ""); lastTy = null; return; }
    // les étapes consécutives de même type sont regroupées sous un seul titre
    // (utile pour les échauffements / retours au calme multi-paliers)
    if(x.ty !== lastTy){ if(lastTy !== null) out.push(""); out.push(t("tt_" + x.ty)); lastTy = x.ty; }
    out.push(edLine(x));
  });
  return out.join("\n").trim();
}
function edSum(){
  const tot = parseWorkout(edText(), edSp(), curFtp()).reduce((a, b) => a + b.d, 0);
  $("edsum").textContent = tot ? t("edTot", hm(tot)) : "";
}
function edHtml(){
  // regroupe les étapes consécutives de même type dans un bloc encadré (même logique
  // que les titres de sections du texte généré par edText) ; chaque bloc est repliable
  let out = "", run = [];
  const edSec = x => { if(x.mode !== "t") return 0; const [m, s] = String(x.v).split(":"); return (parseInt(m, 10) || 0) * 60 + (parseInt(s, 10) || 0); };
  const flush = () => {
    if(!run.length) return;
    const ty = ED[run[0]].ty, bk = "b" + (ED[run[0]].uid || 0), closed = edCollapsed.has(bk);
    const tot = run.reduce((a, i) => a + edSec(ED[i]), 0);
    out += `<div class="blk blk-${ty}${closed ? " closed" : ""}" data-bk="${bk}"><div class="blk-h">${esc(t("tt_" + ty))}<span class="badge">${run.length}${tot ? " · " + fmtDur(tot) : ""}</span><button class="alt small tglb" data-tb="${bk}" type="button" aria-expanded="${!closed}" title="${esc(t("collapse"))}" aria-label="${esc(t("collapse"))}">${closed ? "▸" : "▾"}</button></div>${run.map(i => edStep(ED[i], String(i))).join("")}</div>`;
    run = [];
  };
  ED.forEach((x, i) => { if(x.k === "g"){ flush(); out += edGrp(x, i); } else run.push(i); });
  flush();
  return out;
}
function edRender(){
  $("edftp").disabled = $("edunit").disabled = !edKm();
  $("edhint").textContent = t(edW() ? "edHintW" : edKm() ? "edHintP" : "edHintPace");
  $("edbox").innerHTML = ED.length ? edHtml() : `<div class="hint">${esc(t("edNone"))}</div>`;
  edSum();
}
$("edbox").addEventListener("input", e => {
  const el = e.target, h = el.closest("[data-p]"); if(!h || !el.dataset.f) return;
  const {list, i} = edAt(h.dataset.p); list[i][el.dataset.f] = el.value;
  if(el.dataset.f === "ty" || el.dataset.f === "mode") edRender(); else edSum();
});
$("edbox").addEventListener("click", e => {
  const tb = e.target.closest(".tglb");
  if(tb){ const k = tb.dataset.tb; if(edCollapsed.has(k)) edCollapsed.delete(k); else edCollapsed.add(k); edRender(); return; }
  const b = e.target.closest("[data-a]"); if(!b) return; const a = b.dataset.a;
  const gp = (a === "rm" || a === "rp") ? b.closest("[data-p]").dataset.p : null;
  if(a === "addin") ED[+b.dataset.g].items.push(edDef(b.dataset.ty));
  else{
    const {list, i} = edAt(b.closest("[data-p]").dataset.p);
    if(a === "rm" || a === "rp") list[i].r = Math.min(50, Math.max(1, (parseInt(list[i].r, 10) || 1) + (a === "rp" ? 1 : -1)));
    else if(a === "del") list.splice(i, 1);
    else if(a === "dup"){ const c = JSON.parse(JSON.stringify(list[i])); c.uid = ++edUid; list.splice(i + 1, 0, c); }
    else if(a === "rec") list.splice(i + 1, 0, edDef("rec"));
    else if(a === "std") list.splice(i, 1, ...stdSteps(list[i].ty));
    else if(a === "up" && i > 0){ const o = list[i - 1]; list[i - 1] = list[i]; list[i] = o; }
    else if(a === "down" && i < list.length - 1){ const o = list[i + 1]; list[i + 1] = list[i]; list[i] = o; }
  }
  edRender();
  if(gp !== null){ const nb = $("edbox").querySelector(`[data-p="${gp}"] [data-a="${a}"]`); if(nb) nb.focus(); }
});
// Glisser-déposer pour réordonner les étapes (poignée ⠿)
let edDrag = null;
$("edbox").addEventListener("mousedown", e => {
  const row = e.target.closest && e.target.closest(".drg") ? e.target.closest(".drg").closest("[data-p]") : null;
  document.querySelectorAll('#edbox [draggable="true"]').forEach(el => el.removeAttribute("draggable"));
  if(row) row.setAttribute("draggable", "true");
});
$("edbox").addEventListener("dragstart", e => {
  const row = e.target.closest ? e.target.closest("[data-p]") : null;
  if(!row || row.getAttribute("draggable") !== "true"){ e.preventDefault(); return; }
  edDrag = row.dataset.p;
  e.dataTransfer.effectAllowed = "move";
  try{ e.dataTransfer.setData("text/plain", edDrag); }catch(err){}
});
$("edbox").addEventListener("dragend", () => {
  edDrag = null;
  document.querySelectorAll('#edbox [draggable="true"], #edbox .dropover').forEach(el => { el.removeAttribute("draggable"); el.classList.remove("dropover"); });
});
$("edbox").addEventListener("dragover", e => {
  if(!edDrag) return;
  const row = e.target.closest ? e.target.closest("[data-p]") : null;
  if(!row || row.dataset.p === edDrag) return;
  e.preventDefault();
  document.querySelectorAll('#edbox .dropover').forEach(el => el.classList.remove("dropover"));
  row.classList.add("dropover");
});
$("edbox").addEventListener("drop", e => {
  if(!edDrag) return;
  const row = e.target.closest ? e.target.closest("[data-p]") : null;
  e.preventDefault();
  const src = edAt(edDrag);
  edDrag = null;
  document.querySelectorAll('#edbox .dropover').forEach(el => el.classList.remove("dropover"));
  if(!row) return;
  const tgt = edAt(row.dataset.p);
  if(src.list !== tgt.list || src.i === tgt.i) return;
  const r = row.getBoundingClientRect(), after = (e.clientY - r.top) > r.height / 2;
  let j = tgt.i + (after ? 1 : 0);
  const it = src.list.splice(src.i, 1)[0];
  if(src.i < j) j--;
  src.list.splice(Math.max(0, Math.min(src.list.length, j)), 0, it);
  edRender();
});
document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { const ty = b.dataset.add; ED.push(ty === "grp" ? {k: "g", r: 4, items: [edDef("work"), edDef("rec")]} : edDef(ty)); edRender(); });
$("edreset").onclick = async () => { if(!ED.length || !(await ask("cfmReset"))) return; ED.length = 0; edCollapsed.clear(); edRender(); say("edResetOk", "ok"); };
$("edsport").onchange = edRender; $("unit").addEventListener("change", edRender);
$("edgo").onclick = () => {
  const txt = edText(); if(!txt) return say("edNone", "err");
  $("sport").value = edSp(); syncUnit(); $("name").value = $("edname").value.trim() || t("edDefName"); $("desc").value = txt;
  EXPL = null; selLine = null; $("prev").hidden = false; renderChart(); $("prev").scrollIntoView({behavior: "smooth", block: "start"}); say("edBuilt", "ok");
};
$("edsport").value = $("sport").value;
[["ftpsel", "edftp"], ["unit", "edunit"]].forEach(([a, b]) => {
  $(b).onchange = () => { $(a).value = $(b).value; $(a).dispatchEvent(new Event("change")); };
  $(a).addEventListener("change", () => { $(b).value = $(a).value; });
});

// ---------- Bascule des modes (AI / Edit / Lib) ----------
let mode = store.get("si_mode") || "ai";
function applyMode(){
  document.querySelector('[data-block="req"]').hidden = mode !== "ai";
  document.querySelector('[data-block="edit"]').hidden = mode !== "edit";
  document.querySelector('[data-block="lib"]').hidden = mode !== "lib";
  document.querySelector('[data-block="imp"]').hidden = mode !== "imp";
  document.querySelector('[data-block="act"]').hidden = mode !== "act";
  document.querySelectorAll('.mode:not(.cfg-tabs) button').forEach(b => { const on = b.dataset.m === mode; b.setAttribute("aria-selected", String(on)); b.tabIndex = on ? 0 : -1; });
}
document.querySelectorAll('.mode:not(.cfg-tabs) button').forEach(b => {
  b.onclick = () => { mode = b.dataset.m; store.set("si_mode", mode); applyMode(); if(mode === "act" && ACTS.list === null) loadActs().catch(() => {}); };
  b.onkeydown = e => {
    const modes = ["lib", "edit", "ai", "imp", "act"]; let idx = modes.indexOf(mode);
    if(e.key === "ArrowLeft") idx = (idx - 1 + modes.length) % modes.length;
    else if(e.key === "ArrowRight") idx = (idx + 1) % modes.length;
    else return;
    mode = modes[idx]; store.set("si_mode", mode); applyMode(); document.querySelector(`.mode [data-m="${mode}"]`).focus();
  };
});

// ---------- Blocs repliables, liens, langue, démarrage ----------
// --- Widgets visibles de la colonne de droite (réglages) ---
const WIDGETS = ["cal", "fit", "last", "load", "best"];
let widgets = [];
function loadWidgets(){
  const raw = store.get("si_widgets");
  let v = null;
  try{ v = raw ? JSON.parse(raw) : null; }catch(e){ v = null; }
  widgets = WIDGETS.filter(k => v ? v.includes(k) : WIDGETS.indexOf(k) < 3);
}
function applyWidgets(){
  WIDGETS.forEach(k => { const sec = document.querySelector(`[data-block="${k}"]`); if(sec) sec.hidden = !widgets.includes(k); });
  WIDGETS.forEach(k => { const c = $("w_" + k); if(c) c.checked = widgets.includes(k); });
}
function toggleWidget(k){ widgets = widgets.includes(k) ? widgets.filter(x => x !== k) : [...widgets, k]; store.set("si_widgets", JSON.stringify(widgets)); applyWidgets(); }
let off = []; try{ const so = store.get("si_off"); if(so) off = JSON.parse(so).filter(k => k !== "req" && k !== "edit" && k !== "lib" && k !== "imp" && k !== "act"); }catch(e){}
function applyBlocks(){
  document.querySelectorAll("[data-block]").forEach(sec => {
    const closed = off.includes(sec.dataset.block); sec.classList.toggle("off", closed);
    const b = sec.querySelector(".tgl"); if(b){ b.textContent = closed ? "▸" : "▾"; b.setAttribute("aria-expanded", String(!closed)); }
  });
}
document.querySelectorAll('[data-block]:not([data-block="req"]):not([data-block="edit"]):not([data-block="lib"]):not([data-block="imp"]):not([data-block="act"]) > .phead').forEach(h => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "alt small icon tgl"; b.dataset.ia = "title:collapse;aria-label:collapse";
  b.onclick = () => { const k = h.parentNode.dataset.block; off = off.includes(k) ? off.filter(x => x !== k) : [...off, k]; store.set("si_off", JSON.stringify(off)); applyBlocks(); };
  h.appendChild(b);
});
function setLinks(){
  $("mail").href = LINKS.mail;
  [["gh", LINKS.github], ["coffee", LINKS.coffee], ["coffeeTop", LINKS.coffee]].forEach(([id, url]) => {
    const a = $(id);
    if(url){ a.href = url; a.target = "_blank"; a.rel = "noopener"; a.classList.remove("soon"); }
    else{ a.removeAttribute("href"); a.classList.add("soon"); a.title = t("soon"); }
  });
}
function applyLang(){
  document.documentElement.lang = lang; document.title = t("docTitle");
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t(el.dataset.i); });
  document.querySelectorAll("[data-ia]").forEach(el => el.dataset.ia.split(";").forEach(p => { const [a, k] = p.split(":"); el.setAttribute(a, t(k)); }));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
  setLinks(); fillFtp(); profText(); badges(); renderHist(); refreshDateBtn(); renderChart(); renderBest(); renderLoad(); renderLast(); renderFit(); renderCal(); edRender(); renderLibrary(); renderActs(); updateIcuLinks();
  if(MSG) say(MSG.k, MSG.cls, ...MSG.a);
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.l; store.set("si_lang", lang); applyLang(); });
$("date").value = iso(new Date()); refreshDateBtn();
loadWidgets(); applyBlocks(); applyMode(); loadSettings(); applyLang(); syncUnit(); $("edsport").value = $("sport").value; edRender(); renderLibrary();
$("ftpsel").value = store.get("si_ftpsel") || "in"; $("bkind").value = store.get("si_bkind") || "VirtualRide"; $("actper").value = store.get("si_actper") || "14"; $("actout").value = store.get("si_actout") || "w"; $("actftp").value = store.get("si_actftp") || "in"; $("actftpbox").hidden = $("actout").value !== "pct";
$("fper").value = store.get("si_fper") || "60"; $("edftp").value = $("ftpsel").value; $("edunit").value = $("unit").value; $("libftp").value = $("ftpsel").value;
if(!store.get("si_gkey") && !store.get("si_hfkey") && !store.get("si_oakey") || !KEY()) $("cfg").showModal();
loadAll();
</script>
